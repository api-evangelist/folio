openapi: 3.2.0
info:
  title: Mod Login Keycloak Login Attempts API
  version: v1
  description: Mod Login Keycloak API
servers:
- url: http://localhost:8081
  description: Locally deployed server
tags:
- name: loginAttempts
paths:
  /authn/loginAttempts/{userId}:
    get:
      description: Get login attempts for a single user
      operationId: getLoginAttempts
      tags:
      - loginAttempts
      parameters:
      - $ref: '#/components/parameters/pathUserId'
      responses:
        '200':
          description: Number of login attempts for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loginAttempts'
        '404':
          $ref: '#/components/responses/entityNotFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Get login attempts
      x-summary-source: derived
components:
  schemas:
    loginAttempts:
      $schema: http://json-schema.org/draft-04/schema#
      id: loginAttempts.json
      title: Login Attempts Schema
      description: An object describing a login attempt
      type: object
      properties:
        id:
          description: Unique id
          type: string
        userId:
          description: Unique user id
          type: string
        lastAttempt:
          description: Last attempt date
          type: string
          format: date-time
        attemptCount:
          description: Number of user login attempts
          type: integer
    error:
      $schema: http://json-schema.org/draft-04/schema#
      id: error.json
      title: Error Schema
      description: An error object
      type: object
      properties:
        message:
          type: string
          description: Error message text
        type:
          type: string
          description: Error message type
        code:
          description: Error message code
          $ref: '#/components/schemas/errorCode'
        parameters:
          description: List of key/value parameters of an error
          $ref: '#/components/schemas/parameters'
    errorCode:
      $schema: http://json-schema.org/draft-04/schema#
      id: errorCode.json
      title: Error Code Schema
      description: Error message code
      type: string
      enum:
      - unknown_error
      - service_error
      - validation_error
      - not_found_error
      - found_error
      - token.parse.failure
      - token.refresh.unprocessable
      - token.logout.unprocessable
      - unauthorized_error
    parameter:
      $schema: http://json-schema.org/draft-04/schema#
      id: parameter.json
      title: Key/Value Parameter Schema
      description: List of key/value parameters of an error
      type: object
      properties:
        key:
          description: Parameter key
          type: string
        value:
          description: Parameter value
          type: string
    parameters:
      $schema: http://json-schema.org/draft-04/schema#
      id: parameters.json
      title: List of Parameters Schema
      description: List of key/value parameters of an error
      type: array
      items:
        $ref: '#/components/schemas/parameter'
    errors:
      $schema: http://json-schema.org/draft-04/schema#
      id: Errors Schema
      description: A set of errors
      type: object
      properties:
        errors:
          description: List of errors
          id: errors
          type: array
          items:
            $ref: '#/components/schemas/error'
        total_records:
          description: Total number of errors
          type: integer
  responses:
    internalServerErrorResponse:
      description: Error response for unhandled or critical server exceptions, e.g. NullPointerException.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errors'
    entityNotFoundResponse:
      description: Error response if entity is not found by id (in json format)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errors'
  parameters:
    pathUserId:
      in: path
      required: true
      name: userId
      description: User identifier
      schema:
        type: string
