openapi: 3.2.0
info:
  title: Inventory Material Types API
  version: v1
  description: Inventory API
servers:
- url: /inventory
tags:
- name: materialTypes
paths:
  /inventory/material-types:
    get:
      tags:
      - materialTypes
      operationId: getMaterialTypes
      summary: Retrieve collection of material type items
      description: Retrieve collection of material type items.
      parameters:
      - $ref: '#/components/parameters/x-okapi-tenant-header'
      - $ref: '#/components/parameters/x-okapi-token-header'
      - $ref: '#/components/parameters/request-query-parameters'
      responses:
        '200':
          description: 'Calls the mod-inventory-storage GET /material-types API and returns the result as-is. \

            The example of response: https://github.com/folio-org/mod-inventory-storage/blob/master/ramls/examples/materialtypes.json

            '
          content:
            application/json:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /inventory/material-types/{materialTypeId}:
    get:
      tags:
      - materialTypes
      operationId: getMaterialTypeById
      summary: Retrieve material type information by id
      description: Retrieve material type information by id.
      parameters:
      - $ref: '#/components/parameters/x-okapi-tenant-header'
      - $ref: '#/components/parameters/x-okapi-token-header'
      - $ref: '#/components/parameters/material-type-id'
      responses:
        '200':
          description: 'Calls the mod-inventory-storage GET /material-types{materialTypeId} API and returns the result as-is. \

            https://github.com/folio-org/mod-inventory-storage/blob/master/ramls/materialtype.json

            '
          content:
            application/json:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/notFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
components:
  responses:
    notFoundResponse:
      description: Item with a given ID not found
      content:
        application/json:
          example:
            code: 404
            errorMessage: Record by given id not found
          schema:
            $ref: '#/components/schemas/Error'
    badRequestResponse:
      description: Validation errors
      content:
        application/json:
          example:
            code: 400
            errorMessage: Validation error
          schema:
            $ref: '#/components/schemas/Error'
    internalServerErrorResponse:
      description: When unhandled exception occurred during code execution, e.g. NullPointerException
      content:
        application/json:
          example:
            code: 500
            errorMessage: internal error
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    x-okapi-token-header:
      name: x-okapi-token
      in: header
      description: x-okapi-token header value
      required: false
      schema:
        type: string
    x-okapi-tenant-header:
      name: x-okapi-tenant
      in: header
      description: x-okapi-tenant header value
      required: false
      schema:
        type: string
    material-type-id:
      name: materialTypeId
      in: path
      description: Material type id
      required: true
      schema:
        type: string
    request-query-parameters:
      name: requestQueryParameters
      in: query
      description: Request query parameters(query, limit, offset and etc.) as object.
      schema:
        $ref: '#/components/schemas/RequestQueryParameters'
  schemas:
    Error:
      type: object
      properties:
        code:
          description: Error status code
          type: integer
        errorMessage:
          description: Error message text
          type: string
    RequestQueryParameters:
      type: object
      properties:
        query:
          type: string
          description: A CQL query string with search conditions.
          minLength: 1
        limit:
          type: integer
          description: Limit the number of elements returned in the response
          maximum: 2147483647
          minimum: 0
          default: 10
        offset:
          type: integer
          description: Skip over a number of elements by specifying an offset value for the query
          maximum: 2147483647
          minimum: 0
          default: 0
        lang:
          type: string
          description: Requested language
          default: en
          pattern: '[a-zA-Z]{2}'
        expand:
          type: string
          description: Whether or not to expand the id fields
