openapi: 3.2.0
info:
  version: 7.3.0
  title: Folio ERM Agreements Statistics API
  description: API for the Folio library services platform mod-agreements app
  contact:
    name: Knowledge Integration
    url: https://www.k-int.com
servers:
- url: https://folio-snapshot-okapi.dev.folio.org
- url: https://folio-snapshot-2-okapi.dev.folio.org
- url: https://folio-etesting-snapshot-kong.ci.folio.org
security:
- accessToken: []
- okapiToken: []
tags:
- name: Statistics
paths:
  /erm/statistics/kbCount:
    get:
      tags:
      - Statistics
      summary: Get record counts for knowledge base resource types
      operationId: getKbCountStatistics
      description: Counts every row in each of the listed tables -- not scoped to any particular agreement or package.
      parameters:
      - $ref: '#/components/parameters/x-okapi-tenant'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Total record count per resource type.
                properties:
                  ErmResource:
                    type: integer
                  Pkg:
                    type: integer
                  PackageContentItem:
                    type: integer
                  PlatformTitleInstance:
                    type: integer
                  TitleInstance:
                    type: integer
                  Work:
                    type: integer
        '400':
          description: Bad request error
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrailsErrorResponse'
  /erm/statistics/sasCount:
    get:
      tags:
      - Statistics
      summary: Get record counts for agreements and their entitlements
      operationId: getSasCountStatistics
      description: Counts every row in each of the listed tables -- not scoped to any particular agreement.
      parameters:
      - $ref: '#/components/parameters/x-okapi-tenant'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Total record count per resource type.
                properties:
                  SubscriptionAgreement:
                    type: integer
                  Entitlement:
                    type: integer
        '400':
          description: Bad request error
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrailsErrorResponse'
components:
  parameters:
    x-okapi-tenant:
      in: header
      name: x-okapi-tenant
      required: true
      schema:
        type: string
  schemas:
    GrailsErrorResponse:
      type: object
      description: Error-handler body for an uncaught exception raised during request processing. `exception` and `stackTrace` usually suppressed in production systems
      required:
      - error
      - timestamp
      - message
      properties:
        error:
          type: integer
          description: HTTP status code
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        exception:
          type: string
          description: Exception class and message.
        stackTrace:
          type: array
          items:
            type: string
  securitySchemes:
    okapiToken:
      type: apiKey
      in: header
      name: x-okapi-token
    accessToken:
      type: apiKey
      in: cookie
      name: folioAccessToken
