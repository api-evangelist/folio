          type: object
          properties:
            firstName:
              description: First name of the requester
              type: string
            lastName:
              description: Last name of the requester
              type: string
            middleName:
              description: Middle name of the requester
              type: string
            barcode:
              description: Barcode of the requester
              type: string
            patronGroupId:
