openapi: 3.2.0
info:
  title: Folio Mediated Requests Crud API
  version: v1
  description: 'Operations tagged mediatedRequestsCrud across 2 of this provider''s published API definitions: folio-mod-requests-mediated-openapi.json, folio-mod-requests-mediated-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: mediatedRequestsCrud
paths:
  /requests-mediated/mediated-requests:
    post:
      description: Create mediated request
      operationId: postMediatedRequest
      tags:
      - mediatedRequestsCrud
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediatedRequest'
        required: true
      responses:
        '201':
          $ref: '#/components/responses/mediatedRequest'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '422':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Post mediated request
      x-summary-source: derived
    get:
      description: Retrieve a collection of mediated requests
      operationId: getMediatedRequestCollection
      tags:
      - mediatedRequestsCrud
      parameters:
      - $ref: '#/components/parameters/trait_queryable_query'
      - $ref: '#/components/parameters/trait_pageable_offset'
      - $ref: '#/components/parameters/trait_pageable_limit'
      responses:
        '200':
          $ref: '#/components/responses/mediatedRequests'
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
                example: Bad request
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: Internal server error
      summary: Get mediated request collection
      x-summary-source: derived
  /requests-mediated/mediated-requests/{mediatedRequestId}:
    get:
      description: Retrieve mediated request object by id
      operationId: getMediatedRequestById
      tags:
      - mediatedRequestsCrud
      parameters:
      - $ref: '#/components/parameters/mediatedRequestId'
      responses:
        '200':
          $ref: '#/components/responses/mediatedRequest'
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
                example: Bad request
        '404':
          description: Not found
          content:
            text/plain:
              schema:
                type: string
                example: Not found
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: Internal server error
      summary: Get mediated request by id
      x-summary-source: derived
    put:
      description: Update mediated request by ID
      operationId: putMediatedRequestById
      tags:
      - mediatedRequestsCrud
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediatedRequest'
        required: true
      parameters:
      - $ref: '#/components/parameters/mediatedRequestId'
      responses:
        '204':
          description: Mediated request successfully updated
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          $ref: '#/components/responses/notFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Put mediated request by id
      x-summary-source: derived
    delete:
      description: Remove mediated request by ID
      operationId: deleteMediatedRequestById
      tags:
      - mediatedRequestsCrud
      parameters:
      - $ref: '#/components/parameters/mediatedRequestId'
      responses:
        '204':
          description: Mediated request successfully removed
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          $ref: '#/components/responses/notFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Delete mediated request by id
      x-summary-source: derived
