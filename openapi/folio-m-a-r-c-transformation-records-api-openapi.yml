openapi: 3.2.0
info:
  title: INN-Reach Settings M A R C Transformation Records API
  version: v1
servers:
- url: /inn-reach/
tags:
- name: M-A-R-C-transformation-records
paths:
  /central-servers/{centralServerId}/marc-record-transformation/{inventoryInstanceId}:
    get:
      tags:
      - M-A-R-C-transformation-records
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransformedMARCRecordDTO'
        '400':
          $ref: '#/components/responses/trait_response_validation_400'
        '500':
          $ref: '#/components/responses/trait_response_500'
      description: Transform MARC record by Id according to CentralServer settings
      operationId: transformMARCRecord
      parameters:
      - $ref: '#/components/parameters/centralServerId'
      - $ref: '#/components/parameters/inventoryInstanceId'
      summary: Transform MARC record
      x-summary-source: derived
components:
  schemas:
    UUID:
      type: string
      format: uuid
    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message text
        type:
          type: string
          description: Error message type
        code:
          type: string
          description: Error message code
      additionalProperties: false
      required:
      - message
    TransformedMARCRecordDTO:
      description: SRS MARC record
      type: object
      properties:
        id:
          description: MARC record id
          type: string
          format: UUID
        content:
          description: Formatted content
          type: string
        base64rawContent:
          description: Base64 encoded raw content
          type: string
      additionalProperties: false
      required:
      - id
      - content
      - base64rawContent
    validationErrorsDTO:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        validationErrors:
          type: array
          items:
            $ref: '#/components/schemas/validationErrorDTO'
    validationErrorDTO:
      description: Validation error
      type: object
      properties:
        fieldName:
          type: string
          description: Field name
        message:
          type: string
          description: Validation error message text
      additionalProperties: false
      required:
      - fieldName
      - message
  responses:
    trait_response_validation_400:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/validationErrorsDTO'
    trait_response_500:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    inventoryInstanceId:
      name: inventoryInstanceId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    centralServerId:
      name: centralServerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
