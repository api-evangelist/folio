openapi: 3.2.0
info:
  contact:
    name: Spitfire team
  description: API for managing record specifications and validating records against them
  title: Record Specifications Specification Storage API
  version: 1.0.0
servers:
- description: Development environments.
  url: https://{environment}-okapi.ci.folio.org
  variables:
    environment:
      default: folio-dev-spitfire
      enum:
      - folio-dev-spitfire
      - folio-perf-spitfire
- description: Reference environments.
  url: https://folio-{environment}-okapi.dev.folio.org
  variables:
    environment:
      default: snapshot
      enum:
      - snapshot
      - snapshot-2
tags:
- description: Provides API for managing specifications.
  name: specification-storage
paths:
  /specification-storage/specifications:
    get:
      description: Get a collection of specifications.
      operationId: getSpecifications
      parameters:
      - description: Filter by specification's family.
        in: query
        name: family
        schema:
          $ref: '#/components/schemas/family'
      - description: Filter by specification's family profile.
        in: query
        name: profile
        schema:
          $ref: '#/components/schemas/familyProfile'
      - description: Limit the number of elements returned in the response.
        in: query
        name: include
        schema:
          $ref: '#/components/schemas/includeParam'
      - description: Limit the number of elements returned in the response.
        in: query
        name: limit
        schema:
          default: 100
          maximum: 500
          minimum: 0
          type: integer
      - description: Skip over a number of elements by specifying an offset value for the query.
        in: query
        name: offset
        schema:
          default: 0
          maximum: 9999
          minimum: 0
          type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                Collection:
                  $ref: '#/components/examples/specificationDtoCollection'
              schema:
                $ref: '#/components/schemas/specificationDtoCollection'
          description: Collection of specifications
        '400':
          content:
            application/json:
              examples:
                validationErrorResponse:
                  $ref: '#/components/examples/validationErrorResponse'
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: Validation errors
        '500':
          content:
            application/json:
              examples:
                unknownError:
                  $ref: '#/components/examples/unknownErrorResponse'
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: When unhandled exception occurred during code execution, e.g. NullPointerException.
      summary: Get Specifications
      tags:
      - specification-storage
  /specification-storage/specifications/{specificationId}:
    get:
      description: Get a specification by id.
      operationId: getSpecification
      parameters:
      - description: Specification ID
        in: path
        name: specificationId
        required: true
        schema:
          format: uuid
          type: string
      - description: Limit the number of elements returned in the response.
        in: query
        name: include
        schema:
          $ref: '#/components/schemas/includeParam'
      responses:
        '200':
          content:
            application/json:
              examples:
                RequestExample:
                  $ref: '#/components/examples/specificationDto'
              schema:
                $ref: '#/components/schemas/specificationDto'
          description: Specification object
        '400':
          content:
            application/json:
              examples:
                validationErrorResponse:
                  $ref: '#/components/examples/validationErrorResponse'
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: Validation errors
        '500':
          content:
            application/json:
              examples:
                unknownError:
                  $ref: '#/components/examples/unknownErrorResponse'
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: When unhandled exception occurred during code execution, e.g. NullPointerException.
      summary: Get Specification by ID
      tags:
      - specification-storage
  /specification-storage/specifications/{specificationId}/sync:
    post:
      description: Sync or return to defaults the specification (will remove all changes)
      operationId: syncSpecification
      parameters:
      - description: Specification ID
        in: path
        name: specificationId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '202':
          description: Specification successfully synced
        '400':
          content:
            application/json:
              examples:
                validationErrorResponse:
                  $ref: '#/components/examples/validationErrorResponse'
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: Validation errors
        '500':
          content:
            application/json:
              examples:
                unknownError:
                  $ref: '#/components/examples/unknownErrorResponse'
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: When unhandled exception occurred during code execution, e.g. NullPointerException.
      summary: Sync specification
      tags:
      - specification-storage
  /specification-storage/specifications/{specificationId}/rules:
    get:
      description: Get a collection of specification rules enabled and disabled.
      operationId: getSpecificationRules
      parameters:
      - description: Specification ID
        in: path
        name: specificationId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                Collection:
                  $ref: '#/components/examples/specificationRuleDtoCollection'
              schema:
                $ref: '#/components/schemas/specificationRuleDtoCollection'
          description: Collection of specifications
        '400':
          content:
            application/json:
              examples:
                validationErrorResponse:
                  $ref: '#/components/examples/validationErrorResponse'
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: Validation errors
        '500':
          content:
            application/json:
              examples:
                unknownError:
                  $ref: '#/components/examples/unknownErrorResponse'
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: When unhandled exception occurred during code execution, e.g. NullPointerException.
      summary: Get Specification Rules
      tags:
      - specification-storage
  /specification-storage/specifications/{specificationId}/rules/{id}:
    patch:
      description: Enable or disable specification rule.
      operationId: toggleSpecificationRule
      parameters:
      - description: Specification ID
        in: path
        name: specificationId
        required: true
        schema:
          format: uuid
          type: string
      - description: Specification Rule ID
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              Enable:
                summary: Enables rule for the specification
                value:
                  enabled: true
              Disable:
                summary: Disables rule for the specification
                value:
                  enabled: false
            schema:
              $ref: '#/components/schemas/toggleSpecificationRuleDto'
        required: true
      responses:
        '202':
          description: Operation was successful
        '400':
          content:
            application/json:
              examples:
                validationErrorResponse:
                  $ref: '#/components/examples/validationErrorResponse'
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: Validation errors
        '500':
          content:
            application/json:
              examples:
                unknownError:
                  $ref: '#/components/examples/unknownErrorResponse'
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: When unhandled exception occurred during code execution, e.g. NullPointerException.
      summary: Toggle Specification Rule
      tags:
      - specification-storage
  /specification-storage/specifications/{specificationId}/fields:
    get:
      description: Get a collection of fields definitions that are defined in the specification.
      operationId: getSpecificationFields
      parameters:
      - description: Specification ID
        in: path
        name: specificationId
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                Collection:
                  $ref: '#/components/examples/specificationFieldDtoCollection'
              schema:
                $ref: '#/components/schemas/specificationFieldDtoCollection'
          description: Collection of fields definitions
        '400':
          content:
            application/json:
              examples:
                validationErrorResponse:
                  $ref: '#/components/examples/validationErrorResponse'
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: Validation errors
        '500':
          content:
            application/json:
              examples:
                unknownError:
                  $ref: '#/components/examples/unknownErrorResponse'
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: When unhandled exception occurred during code execution, e.g. NullPointerException.
      summary: Get Specification Field Definitions
      tags:
      - specification-storage
    post:
      description: Create new local field definition for the specification
      operationId: createSpecificationLocalField
      parameters:
      - description: Specification ID
        in: path
        name: specificationId
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            examples:
              RequestExample:
                $ref: '#/components/examples/specificationFieldChangeDto'
            schema:
              $ref: '#/components/schemas/specificationFieldChangeDto'
        required: true
      responses:
        '201':
          content:
            application/json:
              examples:
                Created:
                  $ref: '#/components/examples/specificationFieldDto'
              schema:
                $ref: '#/components/schemas/specificationFieldDto'
          description: Local field definition was created
        '400':
          content:
            application/json:
              examples:
                validationErrorResponse:
                  $ref: '#/components/examples/validationErrorResponse'
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: Validation errors
        '500':
          content:
            application/json:
              examples:
                unknownError:
                  $ref: '#/components/examples/unknownErrorResponse'
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: When unhandled exception occurred during code execution, e.g. NullPointerException.
      summary: Create Local Field Definition
      tags:
      - specification-storage
