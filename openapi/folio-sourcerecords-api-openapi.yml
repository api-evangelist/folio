openapi: 3.2.0
info:
  title: Folio Source Records API
  version: v1
  description: 'Operations tagged sourceRecords across 2 of this provider''s published API definitions: folio-edge-inventory-openapi.json, folio-edge-inventory-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /inventory
tags:
- name: sourceRecords
paths:
  /inventory/source-records/{instanceId}:
    get:
      tags:
      - sourceRecords
      operationId: getSourceRecords
      summary: Retrieve source records by id from folio mod-source-record-storage
      parameters:
      - $ref: '#/components/parameters/x-okapi-tenant-header'
      - $ref: '#/components/parameters/x-okapi-token-header'
      - $ref: '#/components/parameters/instance-id'
      responses:
        '200':
          description: 'Calls the mod-source-record-storage GET source-storage/records/{id} API and returns the result as-is. \

            The example of response: https://github.com/folio-org/data-import-raml-storage/blob/e7f0fef18a5a00925e04a79bbbe5b6c82ae0df9c/schemas/dto/sourceRecord.json

            '
          content:
            application/json:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          $ref: '#/components/responses/notFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    servers:
    - url: /inventory
components:
  schemas:
    Error:
      type: object
      properties:
        code:
          description: Error status code
          type: integer
        errorMessage:
          description: Error message text
          type: string
  responses:
    internalServerErrorResponse:
      description: When unhandled exception occurred during code execution, e.g. NullPointerException
      content:
        application/json:
          example:
            code: 500
            errorMessage: internal error
          schema:
            $ref: '#/components/schemas/Error'
    notFoundResponse:
      description: Item with a given ID not found
      content:
        application/json:
          example:
            code: 404
            errorMessage: Record by given id not found
          schema:
            $ref: '#/components/schemas/Error'
    badRequestResponse:
      description: Validation errors
      content:
        application/json:
          example:
            code: 400
            errorMessage: Validation error
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    x-okapi-token-header:
      name: x-okapi-token
      in: header
      description: x-okapi-token header value
      required: false
      schema:
        type: string
    instance-id:
      name: instanceId
      in: path
      description: Inventory Instance's UUID
      required: true
      schema:
        type: string
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
    x-okapi-tenant-header:
      name: x-okapi-tenant
      in: header
      description: x-okapi-tenant header value
      required: false
      schema:
        type: string
x-refined-from:
- folio-edge-inventory-openapi.json
- folio-edge-inventory-openapi.yml
