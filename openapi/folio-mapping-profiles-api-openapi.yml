openapi: 3.2.0
info:
  title: Folio Mapping Profiles API
  version: v1
  description: 'Operations tagged Mapping Profiles across 2 of this provider''s published API definitions: folio-mod-data-export-openapi.json, folio-mod-data-export-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /data-export/
tags:
- name: Mapping Profiles
paths:
  /mapping-profiles:
    get:
      description: API for getting mapping profiles
      operationId: getMappingProfiles
      parameters:
      - $ref: '#/components/parameters/trait_queryable'
      - $ref: '#/components/parameters/trait_pageable_offset'
      - $ref: '#/components/parameters/trait_pageable_limit'
      responses:
        '200':
          description: Mapping profiles collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mappingProfileCollection'
              example:
                mappingProfiles:
                - id: 3798f546-7afb-11ea-bc55-0242ac130003
                  name: Example mapping profile
                  description: Example mapping profile description
                  recordTypes:
                  - INSTANCE
                  outputFormat: MARC
                  transformations:
                  - fieldId: electronicAccess.linkText
                    path: Json path for electronicAccess[*].linkText
                    transformation: '001'
                    enabled: true
                    recordType: INSTANCE
                  userInfo:
                    firstName: User
                    lastName: User
                    userName: '@username'
                  metadata:
                    createdDate: '2020-04-10T12:41:22.000'
                    createdByUserId: ''
                    createdByUsername: '@username'
                    updatedDate: '2020-04-10T12:41:22.000'
                    updatedByUserId: ''
                    updatedByUsername: '@username'
                totalRecords: 1
        '400':
          description: Bad request
          content:
            text/plain:
              example: malformed parameter 'query', syntax error at column 6
        '401':
          description: Not authorized to perform requested action
          content:
            text/plain:
              example: unauthorized
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            text/plain:
              example: Internal server error
      tags:
      - Mapping Profiles
      summary: Get mapping profiles
      x-summary-source: derived
