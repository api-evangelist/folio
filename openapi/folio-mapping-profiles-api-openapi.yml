      parameters:
      - name: mappingProfileId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/uuid'
      responses:
        '204':
          description: Updated
        '400':
          description: Bad request
          content:
            text/plain:
              example: malformed parameter 'query', syntax error at column 6
        '404':
