      description: API for uploading mapping profiles
      operationId: postMappingProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/mappingProfile'
            example:
              id: 3798f546-7afb-11ea-bc55-0242ac130003
              name: Mapping profile
              description: Mapping profile description
              recordTypes:
              - INSTANCE
              outputFormat: MARC
              transformations:
              - fieldId: electronicAccess.linkText
                path: Json path for electronicAccess[*].linkText
                transformation: '001'
                enabled: true
                recordType: INSTANCE
              userInfo:
                firstName: User
                lastName: User
                userName: '@username'
              metadata:
                createdDate: '2019-07-22T11:22:07Z'
                createdByUserId: dee12548-9cee-45fa-bbae-675c1cc0ce3b
                createdByUsername: janedoeuser
                updatedDate: '2019-07-27T13:28:54Z'
                updatedByUserId: dee12548-9cee-45fa-bbae-675c1cc0ce3b
                updatedByUsername: ''
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mappingProfile'
              example:
                id: 3798f546-7afb-11ea-bc55-0242ac130003
                name: Mapping profile
                description: Mapping profile description
                recordTypes:
                - INSTANCE
                outputFormat: MARC
                transformations:
                - fieldId: electronicAccess.linkText
                  path: Json path for electronicAccess[*].linkText
                  transformation: '001'
                  enabled: true
                  recordType: INSTANCE
                userInfo:
                  firstName: User
                  lastName: User
                  userName: '@username'
                metadata:
                  createdDate: '2019-07-22T11:22:07Z'
                  createdByUserId: dee12548-9cee-45fa-bbae-675c1cc0ce3b
                  createdByUsername: janedoeuser
                  updatedDate: '2019-07-27T13:28:54Z'
                  updatedByUserId: dee12548-9cee-45fa-bbae-675c1cc0ce3b
                  updatedByUsername: ''
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
            text/plain:
              example: Invalid request
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            text/plain:
              example: Internal server error
      tags:
      - Mapping Profiles
      summary: Post mapping profile
      x-summary-source: derived
    servers:
    - url: /data-export/
  /mapping-profiles/{mappingProfileId}:
    get:
      description: Get specific mapping profile
      operationId: getMappingProfileById
      parameters:
      - name: mappingProfileId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/uuid'
      responses:
        '200':
          description: Mapping profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/mappingProfile'
              example:
                id: 3798f546-7afb-11ea-bc55-0242ac130003
                name: Mapping profile
                description: Mapping profile description
                recordTypes:
                - INSTANCE
                outputFormat: MARC
                transformations:
                - fieldId: electronicAccess.linkText
                  path: Json path for electronicAccess[*].linkText
                  transformation: '001'
