                  createdByUsername: janedoeuser
                  updatedDate: '2019-07-27T13:28:54Z'
                  updatedByUserId: dee12548-9cee-45fa-bbae-675c1cc0ce3b
                  updatedByUsername: ''
        '400':
          description: Bad request
          content:
            text/plain:
              example: malformed parameter 'query', syntax error at column 6
        '500':
