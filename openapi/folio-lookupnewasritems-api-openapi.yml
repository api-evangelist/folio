openapi: 3.2.0
info:
  title: Folio Lookup New Asr Items API
  version: v1
  description: 'Operations tagged LookupNewAsrItems across 2 of this provider''s published API definitions: folio-edge-dematic-openapi.json, folio-edge-dematic-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /asrService/asr/
tags:
- name: LookupNewAsrItems
paths:
  /lookupNewAsrItems/{remoteStorageConfigurationId}:
    get:
      responses:
        '200':
          description: The polling API for accessions
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/asrItems'
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: Internal server error
      description: Get a list of items
      operationId: getAsrItems
      parameters:
      - $ref: '#/components/parameters/storage_id'
      - $ref: '#/components/parameters/x-okapi-token'
      - $ref: '#/components/parameters/x-okapi-tenant'
      tags:
      - LookupNewAsrItems
      summary: Get asr items
      x-summary-source: derived
    servers:
    - url: /asrService/asr/
components:
  parameters:
    x-okapi-token:
      name: x-okapi-token
      in: header
      required: true
      schema:
        type: string
    storage_id:
      name: remoteStorageConfigurationId
      in: path
      required: true
      schema:
        type: string
    x-okapi-tenant:
      name: x-okapi-tenant
      in: header
      required: true
      schema:
        type: string
  schemas:
    asrItems:
      type: object
      properties:
        asrItems:
          type: array
          items:
            $ref: '#/components/schemas/asrItem'
          xml:
            name: asrItem
            wrapped: true
      xml:
        name: asrItems
    asrItem:
      type: object
      properties:
        author:
          type: string
        title:
          type: string
        itemNumber:
          type: string
        callNumber:
          type: string
x-refined-from:
- folio-edge-dematic-openapi.json
- folio-edge-dematic-openapi.yml
