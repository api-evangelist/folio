          minLength: 0
          type: string
        historyTimeToLive:
          minimum: 0
          type: integer
          format: int32
        initialContext:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/JsonNode'
        name:
          maxLength: 64
          minLength: 4
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        setup:
          $ref: '#/components/schemas/Setup'
        versionTag:
          maxLength: 64
          minLength: 1
          type: string
    Node:
      required:
      - name
      type: object
      properties:
        id:
          type: string
        name:
          maxLength: 64
          minLength: 3
          type: string
        description:
          maxLength: 512
          minLength: 0
          type: string
        deserializeAs:
          type: string
          readOnly: true
        identifier:
          type: string
    ResponseErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        total_records:
          type: integer
          format: int32
    JsonNode_2: {}
