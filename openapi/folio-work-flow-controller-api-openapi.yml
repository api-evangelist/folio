components:
  schemas:
    Parameter:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    JsonNode:
      type: object
    Setup:
      type: object
      properties:
        asyncAfter:
          type: boolean
        asyncBefore:
          type: boolean
    Error:
      required:
      - message
      type: object
      properties:
        message:
          type: string
        type:
          type: string
        code:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/Parameter'
    Workflow:
      required:
      - name
      - versionTag
      type: object
      properties:
        id:
          type: string
        active:
          type: boolean
        deploymentId:
          type: string
        description:
