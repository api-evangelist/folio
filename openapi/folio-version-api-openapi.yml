openapi: 3.2.0
info:
  title: Okapi Core API Facade Version API
  version: v2.0
  description: Okapi Core API Facade
servers:
- url: http://localhost:8081
  description: Locally deployed server
tags:
- name: Version
paths:
  /_/version:
    get:
      responses:
        '200':
          description: OK, with version in body
          headers:
            X-Okapi-Trace:
              $ref: '#/components/headers/X-Okapi-Trace'
        '400':
          description: Bad Request
        '500':
          description: Server Error
      description: Get Okapi version
      operationId: getVersion
      tags:
      - Version
      summary: Get version
      x-summary-source: derived
components:
  headers:
    X-Okapi-Trace:
      required: false
      description: Okapi trace and timing
      schema:
        type: string
