  /settings/entries:
    parameters:
    - $ref: '#/components/parameters/okapi-permissions'
    - $ref: '#/components/parameters/okapi-tenant'
    - $ref: '#/components/parameters/okapi-token'
    - $ref: '#/components/parameters/okapi-url'
    - $ref: '#/components/parameters/okapi-user'
    - $ref: '#/components/parameters/limit'
    - $ref: '#/components/parameters/offset_2'
    - $ref: '#/components/parameters/query'
    get:
      description: Get settings with optional CQL query. If X-Okapi-Permissions includes mod-settings.global.read.SCOPE then settings without a userId are returned. If X-Okapi-Permissions includes mod-settings.users.read.SCOPE then settings with a userId are returned. If X-Okapi-Permissions includes mod-settings.owner.read.SCOPE then settings with userId = current-user are returned.
      operationId: getSettings
      responses:
        '200':
          description: Setting entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/entries'
        '400':
          $ref: '#/components/responses/trait_400'
        '404':
          $ref: '#/components/responses/trait_404'
        '500':
          $ref: '#/components/responses/trait_500'
      tags:
      - Settings
      summary: Get settings
      x-summary-source: derived
    post:
      description: Create setting entry. If X-Okapi-Permissions includes mod-settings.global.write.SCOPE, then a setting without a userId may be created. If X-Okapi-Permissions includes mod-settings.users.write.SCOPE, then a setting with a userId may be created. If X-Okapi-Permissions includes mod-settings.owner.write.SCOPE, then a setting with userId = current-user may be created.
      operationId: postSetting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/entry'
      responses:
        '204':
          description: Setting created
        '400':
          $ref: '#/components/responses/trait_400'
        '403':
          $ref: '#/components/responses/trait_403'
        '413':
          $ref: '#/components/responses/trait_413'
        '500':
          $ref: '#/components/responses/trait_500'
      tags:
      - Settings
      summary: Post setting
      x-summary-source: derived
  /settings/entries/{id}:
    parameters:
    - $ref: '#/components/parameters/okapi-permissions'
    - $ref: '#/components/parameters/okapi-tenant'
    - $ref: '#/components/parameters/okapi-token'
    - $ref: '#/components/parameters/okapi-url'
    - $ref: '#/components/parameters/okapi-user'
    - in: path
      name: id
      required: true
      description: Settings entry identifier
      schema:
        type: string
        format: uuid
    get:
      description: Get setting. If X-Okapi-Permissions includes mod-settings.global.read.SCOPE, then a setting without a userId may be retrieved. If X-Okapi-Permissions includes mod-settings.users.read.SCOPE, then a setting with a userId may be retrieved. If X-Okapi-Permissions includes mod-settings.owner.read.SCOPE, then a setting with userId = current-user may be retrieved.
      operationId: getSetting
      responses:
        '200':
          description: Configuration entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/entry'
        '400':
          $ref: '#/components/responses/trait_400'
        '403':
          $ref: '#/components/responses/trait_403'
        '404':
          $ref: '#/components/responses/trait_404'
        '500':
          $ref: '#/components/responses/trait_500'
      tags:
      - Settings
      summary: Get setting
      x-summary-source: derived
    put:
      description: Update setting. If X-Okapi-Permissions includes mod-settings.global.write.SCOPE, then a setting without a userId may be updated. If X-Okapi-Permissions includes mod-settings.users.write.SCOPE, then a setting with a userId may be updated. If X-Okapi-Permissions includes mod-settings.owner.write.SCOPE, then a setting with userId = current-user may be updated.
      operationId: putSetting
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/entry'
      responses:
        '204':
