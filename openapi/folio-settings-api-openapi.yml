      summary: Delete setting
      x-summary-source: derived
  /settings/upload:
    parameters:
    - $ref: '#/components/parameters/okapi-permissions'
    - $ref: '#/components/parameters/okapi-tenant'
    - $ref: '#/components/parameters/okapi-token'
    - $ref: '#/components/parameters/okapi-url'
    - $ref: '#/components/parameters/okapi-user'
    put:
      description: Upload settings. The entries are inserted or updated depending on whether key, scope, userId already. Each entry gets a unique identifier assigned if it's a new setting. The id must not be supplied. If X-Okapi-Permissions includes mod-settings.global.write.SCOPE, then a setting without a userId may be created/updated. If X-Okapi-Permissions includes mod-settings.users.write.SCOPE, then a setting with a userId may be created/updated. If X-Okapi-Permissions includes mod-settings.owner.write.SCOPE, then a setting with userId = current-user may be created/updated.
      operationId: uploadSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/uploadRequest'
      responses:
        '200':
          description: Settings uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/uploadResponse'
        '400':
          $ref: '#/components/responses/trait_400'
        '403':
          $ref: '#/components/responses/trait_403'
        '500':
          $ref: '#/components/responses/trait_500'
      tags:
      - Settings
      summary: Upload settings
      x-summary-source: derived
components:
  parameters:
    offset:
      in: query
      name: offset
      required: false
      schema:
        type: integer
    perPage:
      in: query
      name: perPage
      required: false
      schema:
        type: integer
    settingId:
      in: path
      name: settingId
      description: Identifier for an application setting
      required: true
      schema:
        type: string
    page:
      in: query
      name: page
      required: false
      schema:
