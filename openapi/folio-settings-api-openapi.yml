        '413':
          $ref: '#/components/responses/trait_413'
        '500':
          $ref: '#/components/responses/trait_500'
      tags:
      - Settings
      summary: Put setting
      x-summary-source: derived
    delete:
      description: Delete setting. If X-Okapi-Permissions includes mod-settings.global.write.SCOPE, then a setting without a userId may be deleted. If X-Okapi-Permissions includes mod-settings.users.write.SCOPE, then a setting with a userId may be deleted. If X-Okapi-Permissions includes mod-settings.owner.write.SCOPE, then a setting with userId = current-user may be deleted.
      operationId: deleteSetting
      responses:
        '204':
          description: Setting deleted
        '400':
          $ref: '#/components/responses/trait_400'
        '404':
          $ref: '#/components/responses/trait_404'
        '500':
