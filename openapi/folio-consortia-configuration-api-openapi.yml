openapi: 3.2.0
info:
  title: integration Consortia Configuration API
  description: Consortia Configuration integration API
  version: 0.0.1
tags:
- name: Consortia Configuration
paths:
  /consortia-configuration:
    get:
      summary: Get consortium configuration
      operationId: getConfiguration
      responses:
        '200':
          $ref: '#/components/responses/ConsortiaConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
      - Consortia Configuration
    post:
      summary: Save consortia configuration
      operationId: saveConfiguration
      responses:
        '201':
          $ref: '#/components/responses/ConsortiaConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
      requestBody:
        $ref: '#/components/requestBodies/ConfigurationBody'
      tags:
      - Consortia Configuration
    delete:
      summary: Delete consortia configuration
      operationId: deleteConfiguration
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
      tags:
      - Consortia Configuration
components:
  schemas:
    Parameter:
      description: List of key/value parameters of an error
      type: object
      properties:
        key:
          type: string
          minLength: 1
        value:
          type: string
      additionalProperties: false
      required:
      - key
    Error:
      description: An error
      type: object
      properties:
        message:
          type: string
          minLength: 1
          description: Error message text
        type:
          type: string
          description: Error message type
        code:
          type: string
          description: Error message code
        parameters:
          description: Error message parameters
          $ref: '#/components/schemas/Parameters'
      additionalProperties: false
      required:
      - message
    ConsortiaConfiguration:
      type: object
      description: Consortia Configuration
      properties:
        id:
          type: string
          format: uuid
        centralTenantId:
          type: string
      additionalProperties: false
      required:
      - centralTenantId
    Parameters:
      description: List of key/value parameters of an error
      type: array
      items:
        $ref: '#/components/schemas/Parameter'
      additionalProperties: false
  responses:
    ConsortiaConfiguration:
      description: Consortia configuration object
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsortiaConfiguration'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoContent:
      description: No content
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  requestBodies:
    ConfigurationBody:
      description: Consortia configuration object
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConsortiaConfiguration'
