openapi: 3.2.0
info:
  title: Circulation BFF requests Declare Item Lost API
  version: v1
tags:
- name: declareItemLost
paths:
  /circulation-bff/loans/{loanId}/declare-item-lost:
    post:
      operationId: declareItemLost
      description: Declares item lost
      tags:
      - declareItemLost
      parameters:
      - name: loanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: The ID of the loan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/declareItemLostRequest'
        required: true
      responses:
        '204':
          description: The loaned item has been successfully declared lost
        '404':
          $ref: '#/components/responses/notFoundResponse'
        '422':
          $ref: '#/components/responses/unprocessableEntityResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Declare item lost
      x-summary-source: derived
