openapi: 3.2.0
info:
  title: Folio Providers API
  version: v1
  description: 'Operations tagged Providers across 2 of this provider''s published API definitions: folio-mod-remote-storage-openapi.json, folio-mod-remote-storage-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /remote-storage/
tags:
- name: Providers
paths:
  /providers:
    get:
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/providers'
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: Internal server error
      description: Get a list of providers
      operationId: getProviders
      tags:
      - Providers
      summary: Get providers
      x-summary-source: derived
    servers:
    - url: /remote-storage/
components:
  schemas:
    provider:
      $schema: http://json-schema.org/draft-04/schema#
      description: Provider
      type: object
      properties:
        name:
          description: provider name
          type: string
        id:
          description: provider id
          type: string
      additionalProperties: false
      required:
      - name
      - id
    providers:
      type: array
      items:
        $ref: '#/components/schemas/provider'
x-refined-from:
- folio-mod-remote-storage-openapi.json
- folio-mod-remote-storage-openapi.yml
