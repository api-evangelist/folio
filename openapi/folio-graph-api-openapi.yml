openapi: 3.2.0
info:
  title: Folio Graph API
  version: v1
  description: 'Operations tagged graph across 2 of this provider''s published API definitions: folio-mod-linked-data-openapi.json, folio-mod-linked-data-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Graph
paths:
  /linked-data/resource/{id}/graph:
    get:
      operationId: getResourceGraphById
      tags:
      - Graph
      description: Get a resource graph by id
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Resource graph as json string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourcePlaceholder'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          description: No Resource graph is found by id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Get resource graph by id
      x-summary-source: derived
components:
  schemas:
    parameter:
      description: List of key/value parameters of an error
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      properties:
        key:
          description: Parameter key
          type: string
        value:
          description: Parameter value
          type: string
    resourcePlaceholder:
      $schema: http://json-schema.org/draft-04/schema#
      description: Resource placeholder
      type: object
      format: Resource
    error:
      description: An error
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      properties:
        message:
          type: string
          description: Error message text
        type:
          type: string
          description: Error message type
        code:
          type: string
          description: Error message code
        parameters:
          type: object
          description: Error message parameters
          $ref: '#/components/schemas/parameters'
    errors:
      description: A set of errors
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      properties:
        errors:
          description: List of errors
          id: errors
          type: array
          items:
            type: object
            $ref: '#/components/schemas/error'
        total_records:
          description: Total number of errors
          type: integer
    parameters:
      description: List of key/value parameters of an error
      $schema: http://json-schema.org/draft-04/schema#
      type: array
      items:
        type: object
        $ref: '#/components/schemas/parameter'
  responses:
    internalServerErrorResponse:
      description: When unhandled exception occurred during code execution, e.g. NullPointerException
      content:
        application/json:
          example: example/unknownError.sample
          schema:
            $ref: '#/components/schemas/errors'
    badRequestResponse:
      description: Validation errors
      content:
        application/json:
          example: examples/validationErrorResponse.sample
          schema:
            $ref: '#/components/schemas/errors'
  parameters:
    id:
      name: id
      in: path
      required: true
      description: Linked Data resource id
      schema:
        type: integer
        format: int64
x-refined-from:
- folio-mod-linked-data-openapi.json
- folio-mod-linked-data-openapi.yml
