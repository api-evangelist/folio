openapi: 3.2.0
info:
  title: OpenAPI definition Action Controller API
  version: v0
servers:
- url: http://localhost:9000
  description: Generated server url
tags:
- name: action-controller
paths:
  /actions:
    get:
      tags:
      - action-controller
      operationId: getActions
      parameters:
      - name: tenant
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Action'
        '204':
          description: No Content
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ResponseErrors'
        '400':
          description: Bad Request
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ResponseErrors'
        '404':
          description: Not Found
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ResponseErrors'
        '500':
          description: Internal Server Error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ResponseErrors'
      summary: Get actions
      x-summary-source: derived
components:
  schemas:
    ResponseErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        total_records:
          type: integer
          format: int32
    Action:
      type: object
      properties:
        interfaceName:
          type: string
        pathPattern:
          type: string
        method:
          type: string
          enum:
          - GET
          - HEAD
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
          - TRACE
      required:
      - interfaceName
      - method
      - pathPattern
    Error:
      type: object
      properties:
        message:
          type: string
        type:
          type: string
        code:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/Parameter'
      required:
      - message
    Parameter:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
