openapi: 3.2.0
info:
  title: Edge CasiaSoft Item Barcodes API
  version: v1
servers:
- url: /caiasoftService/
tags:
- name: ItemBarcodes
paths:
  /ItemBarcodes/{itemBarcode}/accessioned/{remoteStorageConfigurationId}:
    get:
      responses:
        '200':
          description: Success get accession item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accessionItem'
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: Internal server error
      operationId: getAccessionItem
      parameters:
      - $ref: '#/components/parameters/item-barcode'
      - $ref: '#/components/parameters/remote-storage-id'
      - $ref: '#/components/parameters/x-okapi-token'
      - $ref: '#/components/parameters/x-okapi-tenant'
      tags:
      - ItemBarcodes
      summary: Get accession item
      x-summary-source: derived
components:
  schemas:
    accessionItem:
      description: Accession item
      type: object
      properties:
        id:
          description: Accesion itme id
          $ref: '#/components/schemas/uuid'
        itemBarcode:
          description: Item barcode
          type: string
        createdDateTime:
          description: Created Date
          type: string
          format: date-time
        accessionedDateTime:
          description: Accessioned Date
          type: string
          format: date-time
        remoteStorageId:
          description: Remote storage id
          $ref: '#/components/schemas/uuid'
        callNumber:
          description: Call number
          type: string
        instanceTitle:
          description: Instance title
          type: string
        instanceAuthor:
          description: Instance author
          type: string
        instanceContributors:
          description: Instance contributors
          type: string
        publisher:
          description: Publisher
          type: string
        publishYear:
          description: Publish year
          type: string
        publishPlace:
          description: Publish place
          type: string
        volume:
          description: Volume
          type: string
        enumeration:
          description: Enumeration
          type: string
        chronology:
          description: Chronology
          type: string
        issn:
          description: ISSN value
          type: string
        isbn:
          description: ISBN value
          type: string
        oclc:
          description: OCLC value
          type: string
        physicalDescription:
          description: Physical description
          type: string
        materialType:
          description: Material type
          type: string
        copyNumber:
          description: Copy number
          type: string
        permanentLocationId:
          description: Permanent location id
          $ref: '#/components/schemas/uuid'
        notes:
          description: Accession item notes
          type: array
          items:
            description: Item note
            type: object
            $ref: '#/components/schemas/itemNote'
      additionalProperties: false
      required: []
    uuid:
      $schema: http://json-schema.org/draft-04/schema#
      description: Regexp pattern for UUID validation
      type: string
      pattern: ^[a-fA-F0-9]{8}-[a-fA-F0-9]{4}-[1-5][a-fA-F0-9]{3}-[89abAB][a-fA-F0-9]{3}-[a-fA-F0-9]{12}$
    itemNote:
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      description: Accession queue note
      properties:
        noteType:
          description: Note type
          type: string
        note:
          description: Accession queue note
          type: string
        staffOnly:
          description: Staff only flag
          type: boolean
      additionalProperties: false
      required: []
  parameters:
    item-barcode:
      name: itemBarcode
      in: path
      required: true
      schema:
        type: string
    x-okapi-tenant:
      name: x-okapi-tenant
      in: header
      required: true
      schema:
        type: string
    x-okapi-token:
      name: x-okapi-token
      in: header
      required: true
      schema:
        type: string
    remote-storage-id:
      name: remoteStorageConfigurationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/uuid'
