openapi: 3.2.0
info:
  title: Bulk Operations API
  version: v1
  description: Bulk operations API
tags:
- name: Bulk Operations
paths:
  /bulk-operations/upload:
    post:
      description: Upload csv file with identifiers list (barcodes, UUIDs, HRIDs, etc.) or csv-file with already updated entities
      operationId: uploadCsvFile
      parameters:
      - name: entityType
        in: query
        required: true
        description: Entity type (USER, ITEM, HOLDINGS_RECORD)
        schema:
          $ref: '#/components/schemas/EntityType'
      - name: identifierType
        in: query
        required: true
        description: Identifier type (ID, BARCODE, etc.)
        schema:
          $ref: '#/components/schemas/IdentifierType'
      - name: manual
        in: query
        required: false
        description: Key if manual approach is used
        schema:
          default: false
          type: boolean
      - name: operationId
        in: query
        required: false
        description: UUID of the Bulk Operation (applicable for (manual = true) case)
        schema:
          $ref: '#/components/schemas/UUID'
      - name: X-Okapi-User-Id
        in: header
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryRequest'
      tags:
      - Bulk Operations
      summary: Upload csv file
      x-summary-source: derived
  /bulk-operations/query:
    post:
      operationId: triggerBulkEditByQuery
      parameters:
      - name: X-Okapi-User-Id
        in: header
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '201':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
        '422':
          description: Unprocessable entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
      tags:
      - Bulk Operations
      summary: Trigger bulk edit by query
      x-summary-source: derived
  /bulk-operations/{operationId}/content-update:
    post:
      description: Upload content updates
      operationId: postContentUpdates
      parameters:
      - name: operationId
        in: path
        required: true
        description: UUID of the Bulk Operation
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkOperationRuleCollection'
      responses:
        '200':
          description: Rules are saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationRuleCollection'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
      tags:
      - Bulk Operations
      summary: Post content updates
      x-summary-source: derived
  /bulk-operations/{operationId}/marc-content-update:
    post:
      description: Upload MARC content updates
      operationId: postMarcContentUpdates
      parameters:
      - name: operationId
        in: path
        required: true
        description: UUID of the Bulk Operation
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkOperationMarcRuleCollection'
      responses:
        '200':
          description: Rules are saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationMarcRuleCollection'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
      tags:
      - Bulk Operations
      summary: Post marc content updates
      x-summary-source: derived
  /bulk-operations/{operationId}/preview:
    get:
      description: Get preview
      operationId: getPreviewByOperationId
      parameters:
      - name: operationId
        in: path
        required: true
        description: UUID of the Bulk Operation
        schema:
          $ref: '#/components/schemas/UUID'
      - name: step
        in: query
        required: true
        description: Key if manual approach is used
        schema:
          $ref: '#/components/schemas/BulkOperationStep'
      - in: query
        name: limit
        required: true
        schema:
          type: integer
        description: The numbers of records to return
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          type: integer
        description: Query offset
      responses:
        '200':
          description: Collection of records for preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unified_table'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
      tags:
      - Bulk Operations
      summary: Get preview by operation id
      x-summary-source: derived
  /bulk-operations/{operationId}/start:
    post:
      description: Start Bulk Operation
      operationId: startBulkOperation
      parameters:
      - name: operationId
        in: path
        required: true
        description: UUID of the Bulk Operation
        schema:
          $ref: '#/components/schemas/UUID'
      - name: X-Okapi-User-Id
        in: header
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Start'
      responses:
        '200':
          description: Bulk Operation is started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationDto'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
        '404':
          description: Bad Request
          content:
            text/plain:
              schema:
                type: string
                example: Bulk Operation not found
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
      tags:
      - Bulk Operations
      summary: Start bulk operation
      x-summary-source: derived
  /bulk-operations/{operationId}/errors:
    get:
      description: Get a list of errors for preview
      operationId: getErrorsPreviewByOperationId
      parameters:
      - name: operationId
        in: path
        required: true
        description: UUID of the Bulk Operation
        schema:
          $ref: '#/components/schemas/UUID'
      - in: query
        name: limit
        required: true
        schema:
          type: integer
          default: 10
          minimum: 0
        description: The numbers of errors to return
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
        description: Query offset
      - in: query
        name: errorType
        required: false
        schema:
          $ref: '#/components/schemas/ErrorType'
        description: The error type
      responses:
        '200':
          description: Collection of errors for preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
        '404':
          description: No found
          content:
            text/plain:
              schema:
                type: string
                example: Bulk Operation not found
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            text/plain:
              schema:
                type: string
                example: Internal server error
      tags:
      - Bulk Operations
      summary: Get errors preview by operation id
      x-summary-source: derived
  /bulk-operations:
    get:
      description: Get a list of operations
      operationId: getBulkOperationCollection
      parameters:
      - in: query
        name: query
        required: true
        schema:
          type: string
        description: Request query
      - in: query
        name: offset
        required: false
        schema:
          type: integer
        description: Query offset
      - in: query
        name: limit
        required: false
        schema:
          type: integer
        description: Query limit
      responses:
        '200':
          description: Collection of operations for preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationCollection'
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            text/plain:
              schema:
                type: string
                example: Internal server error
      tags:
      - Bulk Operations
      summary: Get bulk operation collection
      x-summary-source: derived
  /bulk-operations/{operationId}/download:
    get:
      operationId: downloadFileByOperationId
      parameters:
      - name: operationId
        in: path
        required: true
        description: UUID of the Bulk Operation
        schema:
          $ref: '#/components/schemas/UUID'
      - in: query
        name: fileContentType
        required: true
        schema:
          $ref: '#/components/schemas/FileContentType'
        description: The file content type
      responses:
        '200':
          description: Preview of updated items to download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
      tags:
      - Bulk Operations
      summary: Download file by operation id
      x-summary-source: derived
  /bulk-operations/{operationId}:
    get:
      operationId: getBulkOperationById
      parameters:
      - name: operationId
        in: path
        required: true
        description: UUID of the Bulk Operation
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Bulk operation DTO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkOperationDto'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            text/plain:
              schema:
                type: string
                example: Internal server error
      tags:
      - Bulk Operations
      summary: Get bulk operation by id
      x-summary-source: derived
  /bulk-operations/clean-up-log-files:
    post:
      description: Removed all files older than 30 days
      operationId: cleanUpLogFiles
      responses:
        '201':
          description: No content
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            text/plain:
              schema:
                type: string
                example: Internal server error
      tags:
      - Bulk Operations
      summary: Clean up log files
      x-summary-source: derived
  /bulk-operations/list-users:
    get:
      description: Get a list of users
      operationId: getListUsers
      parameters:
      - in: query
        name: query
        required: true
        schema:
          type: string
        description: Request query
      - in: query
        name: offset
        required: false
        schema:
          type: integer
        description: Query offset
      - in: query
        name: limit
        required: false
        schema:
          type: integer
        description: Query limit
      responses:
        '200':
          description: Collection of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/users'
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            text/plain:
              schema:
                type: string
                example: Internal server error
      tags:
      - Bulk Operations
      summary: Get list users
      x-summary-source: derived
  /bulk-operations/{operationId}/files/{fileName}:
    delete:
      description: Delete file by name and bulk operation id
      operationId: deleteFileByNameAndOperationId
      parameters:
      - in: path
        name: operationId
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
        description: UUID of the Bulk Operation
      - in: path
        name: fileName
        required: true
        schema:
          type: string
        description: File name
      responses:
        '204':
          description: File deleted successfully
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            text/plain:
              schema:
                type: string
                example: Internal server error
      tags:
      - Bulk Operations
      summary: Delete file by name and operation id
      x-summary-source: derived
  /bulk-operations/{operationId}/cancel:
    post:
      description: Cancel bulk operation by id
      operationId: cancelOperationById
      parameters:
      - in: path
        name: operationId
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
        description: UUID of the Bulk Operation
      responses:
        '200':
          description: Operation cancelled
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            text/plain:
              schema:
                type: string
                example: Internal server error
      tags:
      - Bulk Operations
      summary: Cancel operation by id
      x-summary-source: derived
  /bulk-operations/used-tenants/{operationId}:
    get:
      description: Get a list of used tenants
      operationId: getListUsedTenants
      parameters:
      - in: path
        name: operationId
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
        description: UUID of the Bulk Operation
      responses:
        '200':
          description: Collection of used tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            text/plain:
              schema:
                type: string
                example: Internal server error
      tags:
      - Bulk Operations
      summary: Get list used tenants
      x-summary-source: derived
  /bulk-operations/profiles:
    get:
      description: Get a list of Profiles
      operationId: getProfiles
      parameters:
      - in: query
        name: query
        required: false
        schema:
          type: string
        description: Request query
      - in: query
        name: offset
        required: false
        schema:
          type: integer
        description: Query offset
      - in: query
        name: limit
        required: false
        schema:
          type: integer
        description: Query limit
      responses:
        '200':
          description: returns list of profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/profiles_dto'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
      tags:
      - Bulk Operations
      summary: Get profiles
      x-summary-source: derived
    post:
      description: Create a new Profile
      operationId: createProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/profile_request'
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/profile_dto'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
      tags:
      - Bulk Operations
      summary: Create profile
      x-summary-source: derived
  /bulk-operations/profiles/{id}:
    delete:
      description: Delete a Profile by ID
      operationId: deleteProfile
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        '204':
          description: Profile deleted successfully
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
      tags:
      - Bulk Operations
      summary: Delete profile
      x-summary-source: derived
    put:
      summary: Update a profile
      operationId: updateProfile
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        description: Profile object
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/profile_request'
      responses:
        '200':
          description: returns if a profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/profile_dto'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
      tags:
      - Bulk Operations
components:
  schemas:
    BulkOperationStep:
      type: string
      enum:
      - UPLOAD
      - EDIT
      - COMMIT
      - DELETE
    DataType:
      type: string
      enum:
      - NUMERIC
      - DATE_TIME
      - STRING
    MarcRuleDetails:
      type: object
      properties:
        tag:
          description: MARC field tag
          type: string
        ind1:
          description: MARC field indicator 1
          type: string
          pattern: '[a-z0-9#\\]'
        ind2:
          description: MARC field indicator 2
          type: string
          pattern: '[a-z0-9#\\]'
        subfield:
          description: MARC subfield code
          type: string
          pattern: '[a-z0-9]*'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/MarcAction'
          minItems: 1
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/MarcParameter'
        subfields:
          type: array
          items:
            $ref: '#/components/schemas/MarcSubfieldAction'
        updateOption:
          description: Option to change
          $ref: '#/components/schemas/UpdateOptionType'
      required:
      - tag
      - ind1
      - ind2
      - actions
      additionalProperties: false
    RuleDetails:
      properties:
        option:
          description: Option to change
          $ref: '#/components/schemas/UpdateOptionType'
        tenants:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
          minItems: 1
      additionalProperties: false
    cell:
      $schema: http://json-schema.org/draft-04/schema#
      description: Data cell representation
      type: object
      properties:
        value:
          description: Cell value
          type: string
        dataType:
          description: Data type
          $ref: '#/components/schemas/DataType'
        visible:
          description: Column visibility
          type: boolean
          default: 'true'
        forceVisible:
          description: Column visibility (forced to display in preview)
          type: boolean
          default: 'false'
        ignoreTranslation:
          description: Ignore translation
          type: boolean
          default: 'false'
      additionalProperties: false
      required:
      - value
      - dataType
    BulkOperationRuleCollection:
      type: object
      properties:
        bulkOperationRules:
          description: List of bulk operation rules
          type: array
          items:
            $ref: '#/components/schemas/BulkOperationRule'
        totalRecords:
          type: integer
      required:
      - bulkOperationRules
      - totalRecords
      additionalProperties: false
    errors:
      description: A set of errors
      type: object
      properties:
        errors:
          description: List of errors
          id: errors
          type: array
          items:
            type: object
            $ref: '#/components/schemas/error'
        totalRecords:
          description: Total number of errors
          type: integer
      additionalProperties: false
    MarcAction:
      description: MARC record bulk edit rule action
      type: object
      properties:
        name:
          $ref: '#/components/schemas/UpdateActionType'
        data:
          type: array
          items:
            description: MARC rule action data
            type: object
            properties:
              key:
                $ref: '#/components/schemas/MarcDataType'
              value:
                description: Action value
                type: string
      required:
      - name
      additionalProperties: false
    user:
      description: User who runs bulk edit
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: User's ID
        firstName:
          type: string
          description: User's first name
        lastName:
          type: string
          description: User's last name
        preferredFirstName:
          type: string
          description: User's preferred first name
        middleName:
          type: string
          description: User's middle name
      additionalProperties: false
      required:
      - id
    Start:
      type: object
      properties:
        step:
          description: Bulk operation step
          $ref: '#/components/schemas/BulkOperationStep'
        approach:
          description: Bulk Operation approach type
          $ref: '#/components/schemas/ApproachType'
        entityType:
          description: Entity type
          $ref: '#/components/schemas/EntityType'
        entityCustomIdentifierType:
          description: Entity custom identifier type
          $ref: '#/components/schemas/IdentifierType'
        query:
          description: CQL query for
          type: string
    MarcSubfieldAction:
      description: MARC record subfield rule action
      type: object
      properties:
        subfield:
          description: MARC subfield code
          type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/MarcAction'
          minItems: 1
      required:
      - subfield
      - actions
      additionalProperties: false
    parameter:
      description: List of key/value parameters
      type: object
      properties:
        key:
          description: Parameter key
          type: string
        value:
          description: Parameter value
          type: string
      additionalProperties: false
      required:
      - key
    BulkOperationCollection:
      type: object
      properties:
        bulkOperations:
          description: List of bulk operations
          type: array
          items:
            $ref: '#/components/schemas/BulkOperationDto'
          minItems: 1
        totalRecords:
          type: integer
      required:
      - bulkOperations
      - totalRecords
      additionalProperties: false
    BulkOperationRule:
      type: object
      properties:
        id:
          description: Bulk operation rule ID
          type: string
          format: uuid
        bulkOperationId:
          description: Bulk operation ID
          type: string
          format: uuid
        rule_details:
          description: Rule details
          $ref: '#/components/schemas/RuleDetails'
      required:
      - bulkOperationId
      - rule_details
      additionalProperties: false
    FileContentType:
      type: string
      enum:
      - TRIGGERING_FILE
      - TRIGGERING_QUERY_FILE
      - MATCHED_RECORDS_FILE
      - RECORD_MATCHING_ERROR_FILE
      - PROPOSED_CHANGES_FILE
      - PROPOSED_CHANGES_MARC_FILE
      - COMMITTED_RECORDS_FILE
      - COMMITTED_RECORDS_MARC_FILE
      - COMMITTING_CHANGES_ERROR_FILE
    ErrorType:
      type: string
      enum:
      - ERROR
      - WARNING
    MarcDataType:
      type: string
      enum:
      - VALUE
      - SUBFIELD
    tenantNotePair:
      $schema: http://json-schema.org/draft-04/schema#
      description: NoteType name for which (tenantId)
      type: object
      properties:
        tenantId:
          description: ID of tenant required to show after Note type name
          type: string
        noteTypeName:
          description: Note type name for which tenant ID is required to show
          type: string
        noteTypeId:
          description: Note type id for which tenant ID is required to show
