openapi: 3.2.0
info:
  description: Entity Links API
  title: Entities Links Authority Note Type API
  version: v1.0
servers:
- url: https://localhost:8081
tags:
- name: authority-note-type
paths:
  /authority-note-types:
    get:
      operationId: retrieveAuthorityNoteTypes
      parameters:
      - description: Skip over a number of elements by specifying an offset value for the query.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          maximum: 2147483647
          minimum: 0
          type: integer
      - description: Limit the number of elements returned in the response.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 2000
          minimum: 1
          type: integer
      - description: A query expressed as a CQL string (see [dev.folio.org/reference/glossary#cql](https://dev.folio.org/reference/glossary#cql)) using valid searchable fields. The first example below shows the general form of a full CQL query, but those fields might not be relevant in this context.
        in: query
        name: query
        required: false
        schema:
          default: cql.allRecords=1
          type: string
      responses:
        '200':
          content:
            application/json:
              example: examples/authorities.sample
              schema:
                $ref: '#/components/schemas/authorityNoteTypeDtoCollection'
          description: Returns a list of authority note types
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation errors.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Internal server error.
      tags:
      - authority-note-type
      summary: Retrieve authority note types
      x-summary-source: derived
    post:
      operationId: createAuthorityNoteType
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/authorityNoteTypeDto'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authorityNoteTypeDto'
          description: Record successfully created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation errors.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation error for the request.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Internal server error.
      tags:
      - authority-note-type
      summary: Create authority note type
      x-summary-source: derived
  /authority-note-types/{id}:
    delete:
      operationId: deleteAuthorityNoteType
      parameters:
      - description: The UUID of a record
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Record successfully deleted
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation errors.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Record was not found.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Internal server error.
      tags:
      - authority-note-type
      summary: Delete authority note type
      x-summary-source: derived
    get:
      operationId: getAuthorityNoteType
      parameters:
      - description: The UUID of a record
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authorityNoteTypeDto'
          description: Retrieved record
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation errors.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Record was not found.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Internal server error.
      tags:
      - authority-note-type
      summary: Get authority note type
      x-summary-source: derived
    put:
      operationId: updateAuthorityNoteType
      parameters:
      - description: The UUID of a record
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/authorityNoteTypeDto'
      responses:
        '204':
          description: Record successfully updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation errors.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Record was not found.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation error for the request.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Internal server error.
      tags:
      - authority-note-type
      summary: Update authority note type
      x-summary-source: derived
components:
  schemas:
    error_parameters_inner:
      properties:
        key:
          description: Parameter key
          type: string
        value:
          description: Parameter value
          type: string
      type: object
    errors:
      description: Errors response
      example:
        Error:
          value:
            errors:
            - message: may not be null
              type: 1
              code: -1
              parameters:
              - key: moduleTo
                value: null
      properties:
        errors:
          description: List of errors
          items:
            $ref: '#/components/schemas/error'
          type: array
      type: object
    error:
      description: Error object
      properties:
        message:
          description: Error message
          type: string
        type:
          description: Error type
          type: string
        code:
          description: Error code
          type: string
        parameters:
          description: Error parameters
          items:
            $ref: '#/components/schemas/error_parameters_inner'
          type: array
      type: object
    metadata:
      description: Creater, updater, creation date, last updated date
      example:
        createdDate: '2000-01-23T04:56:07.000+00:00'
        createdByUserId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        updatedDate: '2000-01-23T04:56:07.000+00:00'
        updatedByUserId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        createdDate:
          description: Date and time when the record was created
          format: date-time
          type: string
          x-fqm-value-getter: :sourceAlias.created_date
          x-fqm-value-function: (:value)::timestamp
        createdByUserId:
          description: ID of the user who created the record (when available)
          format: uuid
          type: string
          x-fqm-value-getter: :sourceAlias.created_by_user_id
        updatedDate:
          description: Date and time when the record was last updated
          format: date-time
          type: string
          x-fqm-value-getter: :sourceAlias.updated_date
          x-fqm-value-function: (:value)::timestamp
        updatedByUserId:
          description: ID of the user who last updated the record (when available)
          format: uuid
          type: string
          x-fqm-value-getter: :sourceAlias.updated_by_user_id
      type: object
    authorityNoteTypeDto:
      description: An Authority note type
      example:
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        name: name
        source: source
        metadata:
          createdDate: '2000-01-23T04:56:07.000+00:00'
          createdByUserId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          updatedDate: '2000-01-23T04:56:07.000+00:00'
          updatedByUserId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        id:
          description: Unique ID of the Authority note type; a UUID
          format: uuid
          type: string
          x-fqm-value-getter: :sourceAlias.id
          x-fqm-essential: true
        name:
          description: Name of the Authority note type
          type: string
          x-fqm-essential: true
          x-fqm-id-column-name: id
          x-fqm-visible-by-default: true
          x-fqm-value-getter: :sourceAlias.name
          x-fqm-value-source-api:
            path: authority-note-types
            valueJsonPath: $.authorityNoteTypes.*.id
            labelJsonPath: $.authorityNoteTypes.*.name
        source:
          description: label indicating where the Authority note type entry originates from, i.e. 'folio' or 'local'
          type: string
          x-fqm-ignore: true
        metadata:
          $ref: '#/components/schemas/metadata'
      required:
      - name
      - source
      type: object
    authorityNoteTypeDtoCollection:
      description: A collection of authority note types
      example:
        authorityNoteTypes:
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: name
          source: source
          metadata:
            createdDate: '2000-01-23T04:56:07.000+00:00'
            createdByUserId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
            updatedDate: '2000-01-23T04:56:07.000+00:00'
            updatedByUserId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: name
          source: source
          metadata:
            createdDate: '2000-01-23T04:56:07.000+00:00'
            createdByUserId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
            updatedDate: '2000-01-23T04:56:07.000+00:00'
            updatedByUserId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        totalRecords: 0
      properties:
        authorityNoteTypes:
          description: List of authority note types
          items:
            $ref: '#/components/schemas/authorityNoteTypeDto'
          type: array
        totalRecords:
          description: Total amount of records
          type: integer
      required:
      - authorityNoteTypes
      - totalRecords
      type: object
