openapi: 3.2.0
info:
  version: 7.3.0
  title: Folio Licenses Access Control API
  description: API for the Folio library services platform mod-licenses app
  contact:
    name: Knowledge Integration
    url: https://www.k-int.com
servers:
- url: https://folio-snapshot-okapi.dev.folio.org
- url: https://folio-snapshot-2-okapi.dev.folio.org
- url: https://folio-etesting-snapshot-kong.ci.folio.org
security:
- accessToken: []
- okapiToken: []
tags:
- name: Access Control
paths:
  /licenses/licenses/{licenseId}/claim:
    post:
      tags:
      - Access Control
      summary: Claim the specified license record with a set of access policies
      operationId: postLicenseClaim
      parameters:
      - $ref: '#/components/parameters/licenseId'
      - $ref: '#/components/parameters/x-okapi-tenant'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimBody'
        required: true
      responses:
        '200':
          description: OK, no changes were made
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicyClaimResponse'
        '201':
          description: Created, access policies were updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicyClaimResponse'
        '400':
          description: Bad request error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicyClaimResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicyClaimResponse'
        '404':
          description: Not found error
        '405':
          description: Claiming is not supported on this resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicyClaimResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrailsErrorResponse'
  /licenses/licenses/{licenseId}/policies:
    get:
      tags:
      - Access Control
      summary: Get the access policies for the specified license record, across its ownership…
      operationId: getLicensePolicies
      parameters:
      - $ref: '#/components/parameters/licenseId'
      - $ref: '#/components/parameters/x-okapi-tenant'
      responses:
        '200':
          description: OK
