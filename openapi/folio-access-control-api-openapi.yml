          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrailsErrorResponse'
  /licenses/accessControl/{accessControlId}:
    get:
      tags:
      - Access Control
      summary: Get a specified access policy record
      operationId: getAccessControl
      parameters:
      - in: path
        name: accessControlId
        description: UUID for an access policy
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/x-okapi-tenant'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessPolicy'
        '400':
