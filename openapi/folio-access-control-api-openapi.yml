components:
  schemas:
    AccessPolicyResults:
      type: object
      required:
      - results
      allOf:
      - $ref: '#/components/schemas/ResultsMeta'
      - type: object
      - properties:
          results:
            $ref: '#/components/schemas/AccessPolicyResultsArray'
    AccessPolicyResultsArray:
      type: array
      items:
        $ref: '#/components/schemas/AccessPolicy'
    PoliciesResponse:
      type: object
      properties:
        readPolicies:
          type: array
          items:
            $ref: '#/components/schemas/GroupedExternalPolicies'
        updatePolicies:
          type: array
          items:
            $ref: '#/components/schemas/GroupedExternalPolicies'
        createPolicies:
          type: array
          items:
            $ref: '#/components/schemas/GroupedExternalPolicies'
        deletePolicies:
          type: array
          items:
            $ref: '#/components/schemas/GroupedExternalPolicies'
        claimPolicies:
          type: array
          items:
            $ref: '#/components/schemas/GroupedExternalPolicies'
        applyPolicies:
          type: array
          items:
            $ref: '#/components/schemas/GroupedExternalPolicies'
    ClaimBody:
      type: object
      required:
      - claims
      properties:
        claims:
          type: array
          items:
            $ref: '#/components/schemas/PolicyLink'
    ResultsMeta:
      type: object
      properties:
        meta:
          type: object
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        totalRecords:
          type: integer
    AccessPolicy:
      type: object
      required:
      - id
      - type
      - policyId
      - resourceClass
      - resourceId
      properties:
        id:
          type: string
          readOnly: true
        description:
          type: string
        dateCreated:
          type: string
          format: date-time
          readOnly: true
        type:
          $ref: '#/components/schemas/AccessPolicyType'
        policyId:
          type: string
        resourceClass:
          type: string
          readOnly: true
        resourceId:
          type: string
          readOnly: true
    AccessPolicyType:
      type: string
      description: The mechanism used to enforce this access policy
      enum:
      - ACQ_UNIT
    BasicPolicy:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: Identifier of the policy in the external system that owns it (e.g. an acquisition unit id)
    EnabledEngines:
      type: object
      description: Map of access policy type to whether that policy engine is enabled
      additionalProperties:
        type: boolean
    GroupedExternalPolicies:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/AccessPolicyType'
        policies:
          type: array
          items:
            $ref: '#/components/schemas/BasicPolicy'
        name:
          type: string
          description: A descriptive name for this group of policies
    CanAccessResponse:
      type: object
      properties:
        canRead:
          type: boolean
        canUpdate:
          type: boolean
        canDelete:
          type: boolean
        canCreate:
          type: boolean
        canClaim:
          type: boolean
        canApplyPolicies:
          type: boolean
    AccessPolicyClaimResponse:
      type: object
      properties:
        message:
          type: string
    OwnerPolicyLinkList:
      type: object
      properties:
        ownerLevel:
          type: integer
          description: The ownership depth these policies apply at (0 = the resource itself, higher = ancestor owners)
        resourceClass:
          type: string
        ownerId:
          type: string
        hasStandalonePolicies:
          type: boolean
        policies:
          type: array
          items:
            $ref: '#/components/schemas/PolicyLink'
    GrailsErrorResponse:
      type: object
      description: Error-handler body for an uncaught exception raised during request processing. `exception` and `stackTrace` usually suppressed in production systems
      required:
      - error
      - timestamp
      - message
      properties:
        error:
          type: integer
          description: HTTP status code
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        exception:
          type: string
          description: Exception class and message.
        stackTrace:
          type: array
          items:
            type: string
    PolicyLink:
      type: object
      required:
      - policy
      - type
      properties:
        id:
          type: string
          description: Identifier of this policy link. Supply an existing link's id to update it, or omit to add a new one
        policy:
          $ref: '#/components/schemas/BasicPolicy'
        type:
          $ref: '#/components/schemas/AccessPolicyType'
        description:
          type: string
  parameters:
    stats:
      in: query
      name: stats
      required: false
      schema:
        type: boolean
    perPage:
      in: query
      name: perPage
      required: false
      schema:
        type: integer
    licenseId:
      in: path
      name: licenseId
      description: UUID for a license
      required: true
      schema:
        type: string
        format: uuid
    sort:
      in: query
      name: sort
      required: false
      schema:
        type: string
    filters:
      in: query
      name: filters
      required: false
      schema:
        type: string
    offset:
      in: query
      name: offset
      required: false
      schema:
        type: integer
    amendmentId:
      in: path
      name: amendmentId
      description: UUID for an amendment
      required: true
      schema:
        type: string
        format: uuid
    term:
      in: query
