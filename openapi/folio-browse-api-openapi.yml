openapi: 3.2.0
info:
  contact:
    name: Spitfire team
  description: 'API for searching, browsing, and managing facets for various record types, including instances, holdings, and authorities.

    It also provides endpoints for configuring search and browse features, as well as managing the search index.'
  title: Search Browse API
  version: v4.1.0
servers:
- description: Development environments.
  url: https://{environment}-okapi.ci.folio.org
  variables:
    environment:
      default: folio-dev-spitfire
      enum:
      - folio-dev-spitfire
      - folio-perf-spitfire
- description: Reference environments.
  url: https://folio-{environment}-okapi.dev.folio.org
  variables:
    environment:
      default: snapshot
      enum:
      - snapshot
      - snapshot-2
tags:
- description: Provides endpoints to browse records (e.g., instances, authorities) in alphabetical order by a specific field, such as call number, classification number, subject, or contributor.
  name: Browse
paths:
  /browse/call-numbers/{browseOptionId}/instances:
    get:
      description: Provides list of call numbers
      operationId: browseInstancesByCallNumber
      parameters:
      - description: Browse option type
        in: path
        name: browseOptionId
        required: true
        schema:
          $ref: '#/components/schemas/browseOptionType'
      - description: "A CQL query string with filter conditions must include anchor query with range conditions. Anchor field is `fullCallNumber`. \nFilters support logic operators `AND` and `OR`. All filters should be combined in parentheses.\nAnchor will be included only if `<=` or `>=` are used in the query. Otherwise, the empty row will be added if `highlightMatch` is equal to `true`.\n<table>\n  <caption>\n      Supported filter options\n  </caption>\n  <thead>\n  <tr>\n      <th>Option</th>\n      <th>Data type</th>\n      <th>Supported operators</th>\n      <th>Description</th>\n  </tr>\n  </thead>\n  <tbody>\n  <tr>\n      <td>instances.tenantId</td>\n      <td>string</td>\n      <td>==</td>\n      <td>Filter by tenant ID in consortium</td>\n  </tr>\n  <tr>\n      <td>instances.shared</td>\n      <td>boolean</td>\n      <td>==</td>\n      <td>Filter by shared/non-shared in consortium</td>\n  </tr>\n  <tr>\n      <td>instances.locationId</td>\n      <td>string</td>\n      <td>==</td>\n      <td>Filter by location ID</td>\n  </tr>\n  <tr>\n      <td>callNumberTypeId</td>\n      <td>string</td>\n      <td>==</td>\n      <td>Filter by call-number type ID</td>\n  </tr>\n  </tbody>\n</table>\n"
        examples:
          browseAround:
            summary: Search for all classification numbers before and after "DT571.F84"
            value: number >= "DT571.F84" or number < "DT571.F84"
          browseForward:
            summary: Search for all classification numbers after "DT571.F84"
            value: number >= "DT571.F84"
          browseBackward:
            summary: Search for all classification numbers before "DT571.F84"
            value: number >= "DT571.F84"
          browseAroundWithFilters:
            summary: Search for local classification numbers before and after "DT571.F84"
            value: (number >= "DT571.F84" or number < "DT571.F84") and instances.shared==false and instances.locationId=="2b94c631-fca9-4892-a730-03ee529ff6c3"
        in: query
        name: query
        required: true
        schema:
          type: string
      - description: Limit the number of elements returned in the browse response.
        in: query
        name: limit
        schema:
          default: 100
          maximum: 100
          minimum: 0
          type: integer
      - description: Whether to highlight matched resource by query input or not.
        in: query
        name: highlightMatch
        required: false
        schema:
          default: true
          type: boolean
      - description: Number of preceding records for browsing around and around-including queries
        in: query
        name: precedingRecordsCount
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
      - description: X-Okapi-Tenant header value
        in: header
        name: x-okapi-tenant
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                browseResult:
                  $ref: '#/components/examples/browseCallNumberResult'
              schema:
                $ref: '#/components/schemas/callNumberBrowseResult'
          description: Search result for browsing by call number
        '400':
          content:
            application/json:
              examples:
                validationErrorResponse:
                  $ref: '#/components/examples/validationErrorResponse'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: Validation errors
        '500':
          content:
            application/json:
              examples:
                unknownError:
                  $ref: '#/components/examples/unknownError'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: When unhandled exception occurred during code execution, e.g. NullPointerException.
      summary: Browse Instance Call Numbers
      tags:
      - Browse
  /browse/classification-numbers/{browseOptionId}/instances:
    get:
      description: Provides list of classification numbers
      operationId: browseInstancesByClassificationNumber
      parameters:
      - description: Browse option type
        in: path
        name: browseOptionId
        required: true
        schema:
          $ref: '#/components/schemas/browseOptionType'
      - description: "A CQL query string with filter conditions must include anchor query with range conditions. Anchor field is `number`. \nFilters support logic operators `AND` and `OR`. All filters should be combined in parentheses.\nAnchor will be included only if `<=` or `>=` are used in the query. Otherwise, the empty row will be added if `highlightMatch` is equal to `true`.\n<table>\n  <caption>\n      Supported filter options\n  </caption>\n  <thead>\n  <tr>\n      <th>Option</th>\n      <th>Data type</th>\n      <th>Supported operators</th>\n      <th>Description</th>\n  </tr>\n  </thead>\n  <tbody>\n  <tr>\n      <td>instances.tenantId</td>\n      <td>string</td>\n      <td>==</td>\n      <td>Filter by tenant ID in consortium</td>\n  </tr>\n  <tr>\n      <td>instances.shared</td>\n      <td>boolean</td>\n      <td>==</td>\n      <td>Filter by shared/non-shared in consortium</td>\n  </tr>\n  </tbody>\n</table>\n"
        examples:
          browseAround:
            summary: Search for all classification numbers before and after "DT571.F84"
            value: number >= "DT571.F84" or number < "DT571.F84"
          browseForward:
            summary: Search for all classification numbers after "DT571.F84"
            value: number >= "DT571.F84"
          browseBackward:
            summary: Search for all classification numbers before "DT571.F84"
            value: number >= "DT571.F84"
          browseAroundWithFilters:
            summary: Search for local classification numbers before and after "DT571.F84"
            value: (number >= "DT571.F84" or number < "DT571.F84") and instances.shared==false
        in: query
        name: query
        required: true
        schema:
          type: string
      - description: Limit the number of elements returned in the browse response.
        in: query
        name: limit
        schema:
          default: 100
          maximum: 100
          minimum: 0
          type: integer
      - description: Whether to highlight matched resource by query input or not.
        in: query
        name: highlightMatch
        required: false
        schema:
          default: true
          type: boolean
      - description: Number of preceding records for browsing around and around-including queries
        in: query
        name: precedingRecordsCount
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
      - description: X-Okapi-Tenant header value
        in: header
        name: x-okapi-tenant
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                browseResult:
                  $ref: '#/components/examples/browseClassificationNumberResult'
              schema:
                $ref: '#/components/schemas/classificationNumberBrowseResult'
          description: Search result for browsing by classification number
        '400':
          content:
            application/json:
              examples:
                validationErrorResponse:
                  $ref: '#/components/examples/validationErrorResponse'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: Validation errors
        '500':
          content:
            application/json:
              examples:
                unknownError:
                  $ref: '#/components/examples/unknownError'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: When unhandled exception occurred during code execution, e.g. NullPointerException.
      summary: Browse Instance Classifications
      tags:
      - Browse
  /browse/subjects/instances:
    get:
      description: Provides list of instances for browsing by subject
      operationId: browseInstancesBySubject
      parameters:
      - description: "A CQL query string with filter conditions must include anchor query with range conditions. Anchor field is `value`. \nFilters support logic operators `AND` and `OR`. All filters should be combined in parentheses.\nAnchor will be included only if `<=` or `>=` are used in the query. Otherwise, the empty row will be added if `highlightMatch` is equal to `true`.\n<table>\n  <caption>\n      Supported filter options\n  </caption>\n  <thead>\n  <tr>\n      <th>Option</th>\n      <th>Data type</th>\n      <th>Supported operators</th>\n      <th>Description</th>\n  </tr>\n  </thead>\n  <tbody>\n  <tr>\n      <td>typeId</td>\n      <td>uuid</td>\n      <td>==</td>\n      <td>Filter by subject type</td>\n  </tr>\n  <tr>\n      <td>sourceId</td>\n      <td>uuid</td>\n      <td>==</td>\n      <td>Filter by subject source</td>\n  </tr>\n  <tr>\n      <td>instances.tenantId</td>\n      <td>string</td>\n      <td>==</td>\n      <td>Filter by tenant ID in consortium</td>\n  </tr>\n  <tr>\n      <td>instances.shared</td>\n      <td>boolean</td>\n      <td>==</td>\n      <td>Filter by shared/non-shared in consortium</td>\n  </tr>\n  </tbody>\n</table>\n"
        examples:
          browseAround:
            summary: Search for all subject values before and after "Fantasy"
            value: value >= "Fantasy" or value < "Fantasy"
          browseForward:
            summary: Search for all subject values after "Fantasy"
            value: value >= "Fantasy"
          browseBackward:
            summary: Search for all subject values before "Fantasy"
            value: value >= "Fantasy"
          browseAroundWithFilters:
            summary: Search for local subject values before and after "Fantasy"
            value: (value >= "Fantasy" or value < "Fantasy") and instances.shared==false
        in: query
        name: query
        required: true
        schema:
          type: string
      - description: Limit the number of elements returned in the response.
        in: query
        name: limit
        schema:
          default: 100
          maximum: 500
          minimum: 0
          type: integer
      - description: X-Okapi-Tenant header value
        in: header
        name: x-okapi-tenant
        required: true
        schema:
          type: string
      - description: Whether to highlight matched resource by query input or not.
        in: query
        name: highlightMatch
        required: false
        schema:
          default: true
          type: boolean
      - description: Number of preceding records for browsing around and around-including queries
        in: query
        name: precedingRecordsCount
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                browseResult:
                  $ref: '#/components/examples/browseSubjectResult'
              schema:
                $ref: '#/components/schemas/subjectBrowseResult'
          description: Search result for browsing by call number
        '400':
          content:
            application/json:
              examples:
                validationErrorResponse:
                  $ref: '#/components/examples/validationErrorResponse'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: Validation errors
        '500':
          content:
            application/json:
              examples:
                unknownError:
                  $ref: '#/components/examples/unknownError'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: When unhandled exception occurred during code execution, e.g. NullPointerException.
      summary: Browse Instance Subjects
      tags:
      - Browse
  /browse/contributors/instances:
    get:
      description: Provides list of instances for browsing by contributor
      operationId: browseInstancesByContributor
      parameters:
      - description: "A CQL query string with filter conditions must include anchor query with range conditions. Anchor field is `name`. \nFilters support logic operators `AND` and `OR`. All filters should be combined in parentheses.\nAnchor will be included only if `<=` or `>=` are used in the query. Otherwise, the empty row will be added if `highlightMatch` is equal to `true`.\n<table>\n  <caption>\n      Supported filter options\n  </caption>\n  <thead>\n  <tr>\n      <th>Option</th>\n      <th>Data type</th>\n      <th>Supported operators</th>\n      <th>Description</th>\n  </tr>\n  </thead>\n  <tbody>\n  <tr>\n      <td>contributorNameTypeId</td>\n      <td>uuid</td>\n      <td>==</td>\n      <td>Filter by contributor name type</td>\n  </tr>\n  <tr>\n      <td>instances.tenantId</td>\n      <td>string</td>\n      <td>==</td>\n      <td>Filter by tenant ID in consortium</td>\n  </tr>\n  <tr>\n      <td>instances.shared</td>\n      <td>boolean</td>\n      <td>==</td>\n      <td>Filter by shared/non-shared in consortium</td>\n  </tr>\n  </tbody>\n</table>\n"
        examples:
          browseAround:
            summary: Search for all contributor values before and after "Abedi, Ali"
            value: name >= "Abedi, Ali" or name < "Abedi, Ali"
          browseForward:
            summary: Search for all contributor values after "Abedi, Ali"
            value: name >= "Abedi, Ali"
          browseBackward:
            summary: Search for all contributor values before "Abedi, Ali"
            value: name >= "Abedi, Ali"
          browseAroundWithFilters:
            summary: Search for local contributor values with name type id = "b6993450-25c1-4c23-a1d1-98abb67fb506" before and after "Abedi, Ali"
            value: (name >= "Abedi, Ali" or name < "Abedi, Ali") and instances.shared==false and contributorNameTypeId="b6993450-25c1-4c23-a1d1-98abb67fb506"
        in: query
        name: query
        required: true
        schema:
          type: string
      - description: Limit the number of elements returned in the response.
        in: query
        name: limit
        schema:
          default: 100
          maximum: 500
          minimum: 0
          type: integer
      - description: X-Okapi-Tenant header value
        in: header
        name: x-okapi-tenant
        required: true
        schema:
          type: string
      - description: Whether to highlight matched resource by query input or not.
        in: query
        name: highlightMatch
        required: false
        schema:
          default: true
          type: boolean
      - description: Number of preceding records for browsing around and around-including queries
        in: query
        name: precedingRecordsCount
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              examples:
                browseResult:
                  $ref: '#/components/examples/browseContributorsResult'
              schema:
                $ref: '#/components/schemas/contributorBrowseResult'
          description: Search result for browsing by contributor
        '400':
          content:
            application/json:
              examples:
                validationErrorResponse:
                  $ref: '#/components/examples/validationErrorResponse'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: Validation errors
        '500':
          content:
            application/json:
              examples:
                unknownError:
                  $ref: '#/components/examples/unknownError'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: When unhandled exception occurred during code execution, e.g. NullPointerException.
      summary: Browse Instance Contributors
      tags:
      - Browse
  /browse/authorities:
    get:
      description: Provides list of authorities by headingRef
      operationId: browseAuthorities
      parameters:
      - description: "A CQL query string with filter conditions must include anchor query with range conditions. Anchor field is `headingRef`.\nFilters support logic operators `AND` and `OR`. All filters should be combined in parentheses.\nAnchor will be included only if `<=` or `>=` are used in the query. Otherwise, the empty row will be added if `highlightMatch` is equal to `true`.\n<table>\n  <caption>\n      Supported filter options\n  </caption>\n  <thead>\n  <tr>\n      <th>Option</th>\n      <th>Data type</th>\n      <th>Supported operators</th>\n      <th>Description</th>\n  </tr>\n  </thead>\n  <tbody>\n  <tr>\n      <td>tenantId</td>\n      <td>string</td>\n      <td>==</td>\n      <td>Filter by tenant ID in consortium</td>\n  </tr>\n  <tr>\n      <td>shared</td>\n      <td>boolean</td>\n      <td>==</td>\n      <td>Filter by shared/non-shared in consortium</td>\n  </tr>\n  <tr>\n      <td>sourceFileId</td>\n      <td>uuid</td>\n      <td>==</td>\n      <td>Filter by authority source file ID. `NULL` value to filter by non-specified.</td>\n  </tr>\n  <tr>\n      <td>headingType</td>\n      <td>string</td>\n      <td>==</td>\n      <td>Filter by heading type: `Personal Name`, `Corporate Name`, `Conference Name`, `Geographic Name`, `Uniform\n          Title`, `Topical`, `Genre`\n      </td>\n  </tr>\n  <tr>\n      <td>isTitleHeadingRef</td>\n      <td>boolean</td>\n      <td>==</td>\n      <td>Filter title/non-title heading</td>\n  </tr>\n  <tr>\n      <td>authRefType</td>\n      <td>boolean</td>\n      <td>==</td>\n      <td>Filter by reference type: `Authorized`, `Reference`, `Auth/Ref`</td>\n  </tr>\n  <tr>\n      <td>subjectHeadings</td>\n      <td>char</td>\n      <td>==</td>\n      <td>Filter by subject heading code</td>\n  </tr>\n  <tr>\n      <td>metadata.createdDate</td>\n      <td>date</td>\n      <td>==, >, <, <=, >=</td>\n      <td>Filter by authority create date</td>\n  </tr>\n  <tr>\n      <td>metadata.updatedDate</td>\n      <td>date</td>\n      <td>==, >, <, <=, >=</td>\n      <td>Filter by authority update date</td>\n  </tr>\n  </tbody>\n</table>\n"
        examples:
          browseAround:
            summary: Search for all authority headings before and after "Comic-Con"
            value: headingRef >= "Comic-Con" or headingRef < "Comic-Con"
          browseForward:
            summary: Search for all authority headings after "Comic-Con"
            value: headingRef >= "Comic-Con"
          browseBackward:
            summary: Search for all authority headings before "Comic-Con"
            value: headingRef >= "Comic-Con"
          browseAroundWithFilters:
            summary: Search for "Authorized" or "Auth/Ref" personal name authority headings before and after "Comic-Con"
            value: (headingRef >= "Comic-Con" or headingRef < "Comic-Con") and authRefType==("Authorized" or "Auth/Ref") and headingType=="Personal Name"
        in: query
        name: query
        required: true
        schema:
          type: string
      - description: "Whether to return only basic properties or entire authority record.<br>\nBasic fields are:\n  - id\n  - tenantId\n  - shared\n  - headingType\n  - authRefType\n  - headingRef\n  - sourceFileId\n  - naturalId\n  - numberOfTitles\n"
        in: query
        name: expandAll
        schema:
          default: false
          type: boolean
      - description: Whether to highlight matched resource by query input or not.
        in: query
        name: highlightMatch
        required: false
        schema:
          default: true
          type: boolean
      - description: Number of preceding records for browsing around and around-including queries
        in: query
        name: precedingRecordsCount
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
      - description: Limit the number of elements returned in the response.
        in: query
        name: limit
        schema:
          default: 100
          maximum: 500
          minimum: 0
          type: integer
      - description: X-Okapi-Tenant header value
        in: header
        name: x-okapi-tenant
        required: true
        schema:
          type: string
      - description: Retrieves the fields listed in the specified parameter.
        in: query
        name: include
        required: false
        schema:
          example: notes,subjects
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                browseResult:
                  $ref: '#/components/examples/browseAuthorityResponse'
                browseEmptyResult:
                  $ref: '#/components/examples/browseAuthorityEmptyResponse'
                browseExpandedResult:
                  $ref: '#/components/examples/browseAuthorityExpandedResponse'
              schema:
                $ref: '#/components/schemas/authorityBrowseResult'
          description: Search result for browsing by authorities
        '400':
          content:
            application/json:
              examples:
                validationErrorResponse:
                  $ref: '#/components/examples/validationErrorResponse'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: Validation errors
        '500':
          content:
            application/json:
              examples:
                unknownError:
                  $ref: '#/components/examples/unknownError'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: When unhandled exception occurred during code execution, e.g. NullPointerException.
      summary: Browse Authorities
      tags:
      - Browse
components:
  schemas:
    contributorBrowseResult:
      description: Instance contributor browse search response
      example:
        totalRecords: 0
        prev: prev
        next: next
        items:
        - name: name
          contributorTypeId:
          - contributorTypeId
          - contributorTypeId
          contributorNameTypeId: contributorNameTypeId
          authorityId: authorityId
          isAnchor: true
          totalRecords: 6
        - name: name
          contributorTypeId:
          - contributorTypeId
          - contributorTypeId
          contributorNameTypeId: contributorNameTypeId
          authorityId: authorityId
          isAnchor: true
          totalRecords: 6
      properties:
        totalRecords:
          description: Amount of items to display
          type: integer
        prev:
          description: Previous value for browsing backward
          type: string
        next:
          description: Next value for browsing forward
          type: string
        items:
          description: List of instance contributor browse items
          items:
            $ref: '#/components/schemas/instanceContributorBrowseItem'
          type: array
      type: object
    authorityNote:
      example:
        noteTypeId: '{}'
        note: note
      properties:
        noteTypeId:
          description: ID of the type of note
          type: object
        note:
          description: Text content of the note
          type: string
      type: object
    subjectBrowseItem:
      description: Subject browse search result item
      example:
        value: value
        isAnchor: true
        totalRecords: 6
        authorityId: authorityId
        sourceId: sourceId
        typeId: typeId
      properties:
        value:
          description: Subject value to be used for browsing
          type: string
        isAnchor:
          description: Marks if current value is anchor or not
          type: boolean
        totalRecords:
          description: Amount of records for the subject browse item
          type: integer
        authorityId:
          description: ID of authority record that controls the subject
          type: string
        sourceId:
          description: ID of subject source
          type: string
        typeId:
          description: ID of subject type
          type: string
      type: object
    instanceContributorBrowseItem:
      description: Instance contributor browse search result item
      example:
        name: name
        contributorTypeId:
        - contributorTypeId
        - contributorTypeId
        contributorNameTypeId: contributorNameTypeId
        authorityId: authorityId
        isAnchor: true
        totalRecords: 6
      properties:
        name:
          description: Personal name, corporate name, meeting name
          type: string
        contributorTypeId:
          description: IDs for the contributor type term
          items:
            description: ID for the contributor type term
            type: string
          type: array
        contributorNameTypeId:
          description: Contributor type terms defined by the MARC code list for relators
          type: string
        authorityId:
          description: ID of authority record that controls the contributor
          type: string
        isAnchor:
          description: Marks if current value is anchor or not
          type: boolean
        totalRecords:
          description: Amount of records for the subject browse item
          type: integer
      type: object
    parameter:
      description: List of key/value parameters of an error
      example:
        key: source
        value: 'null'
      properties:
        key:
          description: Parameter key
          type: string
        value:
          description: Parameter value
          type: string
      type: object
    authorityBrowseResult:
      description: Authority browse search response
      example:
        totalRecords: 0
        prev: prev
        next: next
        items:
        - authority:
            id: id
            tenantId: tenantId
            shared: true
            source: source
            sourceFileId: sourceFileId
            naturalId: naturalId
            personalName: personalName
            sftPersonalName:
            - sftPersonalName
            - sftPersonalName
            saftPersonalName:
            - saftPersonalName
            - saftPersonalName
            personalNameTitle: personalNameTitle
            sftPersonalNameTitle:
            - sftPersonalNameTitle
            - sftPersonalNameTitle
            saftPersonalNameTitle:
            - saftPersonalNameTitle
            - saftPersonalNameTitle
            corporateName: corporateName
            sftCorporateName:
            - sftCorporateName
            - sftCorporateName
            saftCorporateName:
            - saftCorporateName
            - saftCorporateName
            corporateNameTitle: corporateNameTitle
            sftCorporateNameTitle:
            - sftCorporateNameTitle
            - sftCorporateNameTitle
            saftCorporateNameTitle:
            - saftCorporateNameTitle
            - saftCorporateNameTitle
            meetingName: meetingName
            sftMeetingName:
            - sftMeetingName
            - sftMeetingName
            saftMeetingName:
            - saftMeetingName
