openapi: 3.2.0
info:
  title: Folio Capability Set API
  version: v1
  description: 'Operations tagged capability-set across 2 of this provider''s published API definitions: folio-mod-roles-keycloak-openapi.json, folio-mod-roles-keycloak-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:8081
  description: Locally deployed server
tags:
- name: capability-set
paths:
  /capability-sets:
    get:
      description: Get capabilities by query
      operationId: findCapabilitySets
      tags:
      - capability-set
      parameters:
      - $ref: '#/components/parameters/query'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: A collection of capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capabilitySets'
              example:
                $ref: '#/components/examples/capabilitySetsResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Find capability sets
      x-summary-source: derived
    servers:
    - url: http://localhost:8081
      description: Locally deployed server
  /capability-sets/{id}:
    get:
      description: Get capability set by ID
      operationId: getCapabilitySetById
      tags:
      - capability-set
      parameters:
      - $ref: '#/components/parameters/pathEntityId'
      responses:
        '200':
          description: Retrieve a capability set by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capabilitySet'
              example:
                $ref: '#/components/examples/capabilitySetResponse'
        '404':
          $ref: '#/components/responses/notFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Get capability set by id
      x-summary-source: derived
    servers:
    - url: http://localhost:8081
      description: Locally deployed server
components:
  parameters:
    offset:
      in: query
      name: offset
      description: Skip over a number of elements by specifying an offset value for the query.
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
      example: 2
    pathEntityId:
      in: path
      required: true
      name: id
      description: Entity id
      schema:
        type: string
        format: uuid
    query:
      in: query
      name: query
      description: A query string to filter users based on matching criteria in fields.
      required: false
      schema:
        type: string
      example: role
    limit:
      in: query
      name: limit
      description: Limit the number of elements returned in the response.
      required: false
      schema:
        type: integer
        default: 10
        minimum: 0
      example: 20
  schemas:
    capabilitySet:
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      title: Capability Set Object Schema
      description: Object containing details of a capability set
      properties:
        id:
          description: A unique identifier for this capability
          type: string
          format: uuid
        name:
          description: a human-readable name/label for this capability.  Takes the form of {resourceName}.{scope}, e.g. item.create
          type: string
          readOnly: true
        description:
          description: Free form description of the capability
          type: string
        resource:
          description: The resource this capability is associated with, e.g. item
          type: string
          pattern: ^[A-Za-z\s]+$
        action:
          description: The action this capability is associated with, e.g. create
          $ref: '#/components/schemas/capabilityAction'
        applicationId:
          description: The id of the application which defines the capability
          type: string
        moduleId:
          description: The id of the module which defines the capability
          type: string
        type:
          description: The type of capability
          $ref: '#/components/schemas/capabilityType'
        permission:
          description: Folio permission name
          type: string
        capabilities:
          description: List with assigned capability ids
          type: array
          minItems: 1
          items:
            type: string
            description: Capability identifier
            format: uuid
        metadata:
          $ref: '#/components/schemas/metadata'
          readOnly: true
        visible:
          description: Is visible in UI
          type: boolean
      required:
      - resource
      - action
      - permissions
      - type
      - applicationId
    capabilityAction:
      $schema: http://json-schema.org/draft-04/schema#
      description: The action this capability is associated with, e.g. create
      type: string
      enum:
      - view
      - create
      - edit
      - delete
      - manage
      - execute
    errors:
      description: A set of errors
      $schema: http://json-schema.org/draft-04/schema#
      type: object
    capabilitySets:
      $schema: http://json-schema.org/draft-04/schema#
      title: Capability Sets Object Schema
      description: Response body containing capability set records
      type: object
      properties:
        capabilitySets:
          description: A collection of capability sets
          type: array
          items:
            $ref: '#/components/schemas/capabilitySet'
          minItems: 1
        totalRecords:
          readOnly: true
          description: The total number of records matching the provided criteria
          type: integer
          format: int64
      required:
      - capabilities
    capabilityType:
      $schema: http://json-schema.org/draft-04/schema#
      description: The type of capability
      type: string
      enum:
      - settings
      - data
      - procedural
    metadata:
      $schema: http://json-schema.org/draft-04/schema#
      title: Metadata Schema
      description: Metadata about creation and changes to records, provided by the server (client should not provide)
      type: object
      properties:
        createdDate:
          description: Date and time when the record was created
          type: string
          format: date-time
        createdByUserId:
          description: ID of the user who created the record (when available)
          type: string
          format: uuid
        updatedDate:
          description: Date and time when the record was last updated
          type: string
          format: date-time
        updatedByUserId:
          description: ID of the user who last updated the record (when available)
          type: string
          format: uuid
      additionalProperties: false
  responses:
    internalServerErrorResponse:
      description: Error response for unhandled or critical server exceptions, e.g. NullPointerException.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errors'
          example:
            $ref: '#/components/examples/internalServerErrorResponse'
    notFoundResponse:
      description: Not found error response in JSON format for validation errors.
      content:
