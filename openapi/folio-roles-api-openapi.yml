openapi: 3.2.0
info:
  title: Folio Roles API
  version: '1.0'
  description: 'Operations tagged roles across 4 of this provider''s published API definitions: folio-mod-consortia-keycloak-sharing-roles-openapi.json, folio-mod-roles-keycloak-openapi.json, folio-mod-consortia-keycloak-sharing-roles-openapi.yml, folio-mod-roles-keycloak-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /consortia/{consortiumId}/sharing
- url: http://localhost:8081
  description: Locally deployed server
tags:
- name: Roles
paths:
  /roles:
    post:
      summary: start sharing role
      operationId: startSharingRole
      tags:
      - Roles
      parameters:
      - $ref: '#/components/parameters/consortiumId'
      requestBody:
        $ref: '#/components/requestBodies/SharingRoleBody'
      responses:
        '201':
          $ref: '#/components/responses/SharingRoleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      description: Get roles by query
      operationId: findRoles
      tags:
      - Roles
      parameters:
      - $ref: '#/components/parameters/query'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '201':
          description: Array of roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/roles'
              example:
                $ref: '#/components/examples/roleResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Find roles
      x-summary-source: derived
    servers:
    - url: /consortia/{consortiumId}/sharing
  /roles/{roleId}:
    delete:
      summary: delete sharing role
      operationId: deleteSharingRole
      tags:
      - Roles
      parameters:
      - $ref: '#/components/parameters/consortiumId'
      - $ref: '#/components/parameters/roleId'
      requestBody:
        $ref: '#/components/requestBodies/SharingRoleBody'
      responses:
        '200':
          $ref: '#/components/responses/SharingRoleDeleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    servers:
    - url: /consortia/{consortiumId}/sharing
  /roles/{id}:
    get:
      description: Get role by ID
      operationId: getRole
      tags:
      - Roles
      parameters:
      - $ref: '#/components/parameters/pathRoleId'
      responses:
        '200':
          description: Retrieve a role by id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/role'
              example:
                $ref: '#/components/examples/roleResponse'
        '404':
          $ref: '#/components/responses/notFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Get role
      x-summary-source: derived
    put:
      description: Update a role
      operationId: updateRole
      tags:
      - Roles
      parameters:
      - $ref: '#/components/parameters/pathRoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/role'
            example:
              $ref: '#/components/examples/roleRequest'
      responses:
        '204':
          description: Update existing role
        '404':
          $ref: '#/components/responses/notFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Update role
      x-summary-source: derived
    delete:
      description: Delete a role
      operationId: deleteRole
      tags:
      - Roles
      parameters:
      - $ref: '#/components/parameters/pathRoleId'
      responses:
        '204':
          description: Delete a role
      summary: Delete role
      x-summary-source: derived
    servers:
    - url: http://localhost:8081
      description: Locally deployed server
  /roles/batch:
    post:
      description: Create one or more roles
      operationId: createRoles
      tags:
      - Roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/rolesRequest'
            example:
              $ref: '#/components/examples/rolesRequest'
      responses:
        '201':
          description: Array of created role or roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/roles'
              example:
                $ref: '#/components/examples/rolesResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Create roles
      x-summary-source: derived
    servers:
    - url: http://localhost:8081
      description: Locally deployed server
