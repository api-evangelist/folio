      - REGULAR
      - CONSORTIUM
    roles:
      $schema: http://json-schema.org/draft-04/schema#
      id: roles.json
      title: Roles schema
      description: Roles
      type: object
      properties:
        roles:
          description: Role identifier
          type: array
          items:
            $ref: '#/components/schemas/role'
        totalRecords:
