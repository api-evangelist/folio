openapi: 3.2.0
info:
  title: Linked Data Resource API
  version: v1
  description: Linked Data service API
tags:
- name: Resource
paths:
  /linked-data/resource:
    post:
      operationId: createResource
      tags:
      - Resource
      description: Create a Resource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resourceRequestDto'
      responses:
        '200':
          description: Created resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceResponseDto'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Create resource
      x-summary-source: derived
  /linked-data/resource/{id}:
    get:
      operationId: getResourceById
      tags:
      - Resource
      description: Get a resource by id
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Resource as json string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceResponseDto'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          description: No Resource is found by id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Get resource by id
      x-summary-source: derived
    put:
      operationId: updateResource
      tags:
      - Resource
      description: Update a resource by id
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            example: example/resourceRequest.sample
            schema:
              $ref: '#/components/schemas/resourceRequestDto'
      responses:
        '200':
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceResponseDto'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          description: No resource is found by id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Update resource
      x-summary-source: derived
    delete:
      operationId: deleteResource
      tags:
      - Resource
      description: Delete a resource by id
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Resource deleted
        '404':
          description: No resource is found by id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Delete resource
      x-summary-source: derived
  /linked-data/resource/{id}/marc:
    get:
      operationId: getResourceMarcViewById
      tags:
      - Resource
      description: Get a marc view of resource by id
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Marc view of resource as json string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceMarcViewDto'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          description: No Resource is found by id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Get resource marc view by id
      x-summary-source: derived
  /linked-data/resource/{id}/rdf:
    get:
      operationId: exportInstanceToRdf
      tags:
      - Resource
      description: Export Instance resource to RDF by id
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Exported RDF resource as json string
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Resource is found by id but it is not an Instance
        '404':
          description: No Instance is found by id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Export instance to rdf
      x-summary-source: derived
  /linked-data/resource/metadata/{inventoryId}/id:
    get:
      operationId: getResourceIdByResourceInventoryId
      tags:
      - Resource
      description: Get id of a resource by its inventory id
      parameters:
      - $ref: '#/components/parameters/inventoryId'
      responses:
        '200':
          description: Json object with id of a resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceIdDto'
        '404':
          description: No resource id is found by its inventory id
      summary: Get resource id by resource inventory id
      x-summary-source: derived
  /linked-data/inventory-instance/{inventoryId}/import-supported:
    get:
      operationId: checkMarcBibImportableToGraph
      tags:
      - Resource
      description: Check if marc bibliographic record can be imported into linked data graph.
      parameters:
      - $ref: '#/components/parameters/inventoryId'
      responses:
        '200':
          description: true if marc bibliographic record can be imported into linked data graph, false otherwise.
          content:
            text/plain:
              schema:
                type: string
                example: true|false
        '404':
          description: No Record is found by inventory id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Check marc bib importable to graph
      x-summary-source: derived
  /linked-data/inventory-instance/{inventoryId}/preview:
    get:
      operationId: getResourcePreviewByInventoryId
      tags:
      - Resource
      description: Get the preview of a resource
      parameters:
      - $ref: '#/components/parameters/inventoryId'
      responses:
        '200':
          description: Resource as json string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceResponseDto'
        '404':
          description: No Record is found by inventory id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Get resource preview by inventory id
      x-summary-source: derived
  /linked-data/inventory-instance/{inventoryId}/import:
    post:
      operationId: importMarcRecord
      tags:
      - Resource
      description: Create a Resource derived from MARC record
      parameters:
      - $ref: '#/components/parameters/inventoryId'
      - $ref: '#/components/parameters/profileIdQuery'
      responses:
        '201':
          description: Json object with id of a resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceIdDto'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          description: No Record is found by inventory id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Import marc record
      x-summary-source: derived
components:
  schemas:
    ProviderEventResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Provider Event
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/ProviderEventBase'
      - type: object
        properties:
          providerPlace:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/PlaceResponse'
            x-json-property: http://bibfra.me/vocab/lite/providerPlace
    AccessLocationResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: AccessLocation
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/AccessLocation'
    StatusResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Status Info
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/Status'
    resourceRequestDto:
      $schema: http://json-schema.org/draft-04/schema#
      description: Resource request DTO
      x-class-extra-annotation: '@org.folio.linked.data.validation.LccnUniqueConstraint'
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: ID of the resource
        resource:
          type: object
          title: resourceRequestField
          description: Resource request. Contains either an Instance or a Work request.
          oneOf:
          - title: InstanceField
            properties:
              Instance:
                type: object
                $ref: '#/components/schemas/InstanceRequest'
                x-json-property: http://bibfra.me/vocab/lite/Instance
                description: Instance request DTO
          - title: WorkField
            properties:
              Work:
                type: object
                $ref: '#/components/schemas/WorkRequest'
                x-json-property: http://bibfra.me/vocab/lite/Work
                description: Work request DTO
          - title: HubField
            properties:
              Hub:
                type: object
                $ref: '#/components/schemas/HubRequest'
                x-json-property: http://bibfra.me/vocab/lite/Hub
                description: Hub request DTO
          - title: AuthorityField
            properties:
              Authority:
                type: object
                $ref: '#/components/schemas/AuthorityRequest'
                x-json-property: _authority
                description: Authority request DTO
    PublicationFrequency:
      $schema: http://json-schema.org/draft-04/schema#
      description: Publication frequency DTO
      type: object
      properties:
        label:
          type: array
          items:
            type: string
          description: Publication frequency label
          x-json-property: http://bibfra.me/vocab/lite/label
        link:
          type: array
          items:
            type: string
          description: Publication frequency link
          x-json-property: http://bibfra.me/vocab/lite/link
    PrimaryTitleResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Primary Title Info
      allOf:
      - $ref: '#/components/schemas/BaseTitleResponse'
      - $ref: '#/components/schemas/PrimaryTitle'
    SupplementaryContent:
      $schema: http://json-schema.org/draft-04/schema#
      description: SupplementaryContent
      allOf:
      - type: object
        properties:
          link:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/link
          name:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/name
    WorkResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Work Info
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/ProfileIdField'
      - $ref: '#/components/schemas/TitleFieldResponse'
      - type: object
        properties:
          targetAudience:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/CategoryResponse'
            x-json-property: http://bibfra.me/vocab/library/targetAudience
          tableOfContents:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/tableOfContents
          summary:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/summary
          _languages:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/LanguageWithType'
            x-json-property: _languages
          _notes:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/Note'
            x-json-property: _notes
          subjects:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/ReferenceResponse'
            x-json-property: http://bibfra.me/vocab/lite/subject
          classification:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/ClassificationResponse'
            x-json-property: http://bibfra.me/vocab/lite/classification
          _creatorReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/AgentResponse'
          _contributorReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/AgentResponse'
          content:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/CategoryResponse'
            x-json-property: http://bibfra.me/vocab/library/content
          _instanceReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/InstanceResponse'
          _geographicCoverageReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/ReferenceResponse'
          _genreReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/ReferenceResponse'
          dateStart:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/dateStart
          dateEnd:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/dateEnd
          governmentPublication:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/CategoryResponse'
            x-json-property: http://bibfra.me/vocab/library/governmentPublication
          originPlace:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/PlaceResponse'
            x-json-property: http://bibfra.me/vocab/library/originPlace
          dissertation:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/DissertationResponse'
            x-json-property: http://bibfra.me/vocab/scholar/dissertation
          illustrations:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/CategoryResponse'
            x-json-property: http://bibfra.me/vocab/library/illustrations
          supplementaryContent:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/CategoryResponse'
            x-json-property: http://bibfra.me/vocab/library/supplementaryContent
          partOfSeries:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/PartOfSeries'
            x-json-property: http://bibfra.me/vocab/relation/isPartOf
          characteristic:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/CategoryResponse'
            x-json-property: http://bibfra.me/vocab/library/characteristic
          _hubs:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/HubReferenceWithType'
          _analyticalEntry:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/LightWork'
      x-implements:
      - org.folio.linked.data.model.dto.HasTitle
      - org.folio.linked.data.model.dto.HasCreator
    ClassificationResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Dewey decimal classification object
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/ClassificationBase'
      - type: object
        properties:
          status:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/StatusResponse'
            x-json-property: http://bibfra.me/vocab/library/status
          _assigningSourceReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/ReferenceResponse'
    AccessLocation:
      $schema: http://json-schema.org/draft-04/schema#
      description: AccessLocation
      allOf:
      - type: object
        properties:
          link:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/link
          note:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/note
    ProviderEventRequest:
      $schema: http://json-schema.org/draft-04/schema#
      description: Provider Event
      allOf:
      - $ref: '#/components/schemas/ProviderEventBase'
      - type: object
        properties:
          providerPlace:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/Place'
            x-json-property: http://bibfra.me/vocab/lite/providerPlace
    Note:
      $schema: http://json-schema.org/draft-04/schema#
      description: Note DTO
      type: object
      properties:
        value:
          type: array
          items:
            type: string
          description: The note text
        type:
          type: array
          items:
            type: string
          description: The note type
    DissertationResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Dissertation object
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/DissertationBase'
      - type: object
        properties:
          _grantingInstitutionReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/ReferenceResponse'
    PartOfSeries:
      $schema: http://json-schema.org/draft-04/schema#
      description: Schema for a 'part of series' object which indicates if a work is part of a series.
      allOf:
      - type: object
        properties:
          name:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/name
          issn:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/issn
          volume:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/volume
    ProfileIdField:
      $schema: http://json-schema.org/draft-04/schema#
      description: Schema for the profile ID field used in request and response
      type: object
      properties:
        profileId:
          type: integer
          format: int16
          description: ID of the profile
      required:
      - profileId
    errors:
      description: A set of errors
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      properties:
        errors:
          description: List of errors
          id: errors
          type: array
          items:
            type: object
            $ref: '#/components/schemas/error'
        total_records:
          description: Total number of errors
          type: integer
    CopyrightEvent:
      $schema: http://json-schema.org/draft-04/schema#
      description: Copyright event object
      allOf:
      - type: object
        properties:
          date:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/date
    VariantTitle:
      $schema: http://json-schema.org/draft-04/schema#
      description: Variant Title Info
      allOf:
      - $ref: '#/components/schemas/BaseTitle'
      - type: object
        properties:
          note:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/note
          date:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/date
          variantType:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/variantType
    Reference:
      $schema: http://json-schema.org/draft-04/schema#
      description: Schema representing reference to a resource in the FOLIO graph or an external source from where the resource can be imported into FOLIO graph
      allOf:
      - $ref: '#/components/schemas/IdField'
      - type: object
        properties:
          label:
            type: string
          srsId:
            type: string
            description: ID of the MARC record in FOLIO's SRS system
          rdfLink:
            type: string
            description: Hyperlink to an RDF resource in Bibframe 2 ontology (https://id.loc.gov/ontologies/bibframe.html)
    PublicationFrequencyResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Publication frequency DTO
      x-from-string-field: label
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/PublicationFrequency'
      - type: object
        properties:
          code:
            type: array
            items:
              type: string
            description: Publication frequency code
            x-json-property: http://bibfra.me/vocab/library/code
    BaseTitleResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Base Title Fields
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/BaseTitle'
    AgentResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Response schema for an agent, extending the Agent definition with additional properties such as agent types and isPreferred flag.
      allOf:
      - $ref: '#/components/schemas/Agent'
      - type: object
        properties:
          types:
            type: array
            items:
              type: string
          isPreferred:
            type: boolean
            description: Indicates whether resource is controlled or not
    FolioMetadata:
      $schema: http://json-schema.org/draft-04/schema#
      description: Metadata of the instance resource
      properties:
        source:
          type: string
          enum:
          - MARC
          - LINKED_DATA
          description: The source of the instance
        inventoryId:
          type: string
          description: ID of the instance in the Inventory application
        srsId:
          type: string
          description: ID of the MARC bib record in the SRS application
    PlaceResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Place
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/Place'
    resourceIdDto:
      $schema: http://json-schema.org/draft-04/schema#
      description: Resource id DTO
      allOf:
      - $ref: '#/components/schemas/IdField'
    Place:
      $schema: http://json-schema.org/draft-04/schema#
      description: Place
      allOf:
      - type: object
        properties:
          name:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/name
          code:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/code
          label:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/label
          link:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/link
    PrimaryTitle:
      $schema: http://json-schema.org/draft-04/schema#
      description: Primary Title Info
      allOf:
      - $ref: '#/components/schemas/BaseTitle'
      - type: object
        properties:
          nonSortNum:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/bflc/nonSortNum
    parameter:
      description: List of key/value parameters of an error
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      properties:
        key:
          description: Parameter key
          type: string
        value:
          description: Parameter value
          type: string
    ReferenceResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Response schema for a reference, extending the Reference definition with additional properties such as reference types and isPreferred flag.
      allOf:
      - $ref: '#/components/schemas/Reference'
      - type: object
        properties:
          types:
            type: array
            items:
              type: string
          isPreferred:
            type: boolean
            description: Indicates whether resource is controlled or not
    LanguageWithType:
      $schema: http://json-schema.org/draft-04/schema#
      description: Language object with corresponding types
      type: object
      properties:
        types:
          type: array
          items:
            type: string
          x-json-property: _types
          description: The list of language types
        codes:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/Language'
          x-json-property: _codes
          description: List of language objects corresponding to the specified types.
    AuthorityRequest:
      $schema: http://json-schema.org/draft-04/schema#
      description: Authority request DTO
      allOf:
      - $ref: '#/components/schemas/ProfileIdField'
      - $ref: '#/components/schemas/Authority'
      - type: object
        properties:
          map:
            type: array
            items:
              $ref: '#/components/schemas/MapRequest'
            x-json-property: http://library.link/vocab/map
    Dissertation:
      $schema: http://json-schema.org/draft-04/schema#
      description: Dissertation object
      allOf:
      - $ref: '#/components/schemas/DissertationBase'
      - type: object
        properties:
          _grantingInstitutionReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/Reference'
    Classification:
      $schema: http://json-schema.org/draft-04/schema#
      description: Classification object
      allOf:
      - $ref: '#/components/schemas/ClassificationBase'
      - type: object
        properties:
          status:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/Status'
            x-json-property: http://bibfra.me/vocab/library/status
          _assigningSourceReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/Reference'
    AdminMetadata:
      $schema: http://json-schema.org/draft-04/schema#
      description: Administrative metadata for an Instance
      allOf:
      - type: object
        properties:
          transcribingAgency:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/transcribingAgency
          catalogingAgency:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/catalogingAgency
          modifyingAgency:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/modifyingAgency
          createdDate:
            type: array
