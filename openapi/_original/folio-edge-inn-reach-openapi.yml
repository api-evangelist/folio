# x-archived-from: folio-edge-inn-reach-openapi.yml
# x-archived-on: 2026-10-09
openapi: 3.0.0
info:
  title: Edge INN-Reach API
  version: v1
servers:
- url: /innreach/
paths:
  /v2/oauth2/token:
    post:
      description: Authenticate credentials and get a new JWT token
      operationId: getToken
      tags:
      - authentication
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accessTokenResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      parameters:
      - $ref: '#/components/parameters/grant_type'
      - $ref: '#/components/parameters/scope'
      - $ref: '#/components/parameters/authorization'
      - $ref: '#/components/parameters/x-okapi-tenant'
      - $ref: '#/components/parameters/x-okapi-token'
components:
  schemas:
    accessTokenResponse:
      description: Access token response
      type: object
      properties:
        access_token:
          description: Access token
          type: string
        token_type:
          description: Access token type
          type: string
        expires_in:
          description: Access token expiration time
          type: integer
    error:
      description: An error
      type: object
      properties:
        error:
          type: string
          description: Error message
        error_description:
          type: string
          description: Error description
      additionalProperties: false
      required:
      - error
      - error_description
    innReachError:
      description: D2IR error
      type: object
      properties:
        messages:
          type: array
          description: Error messages
          items:
            type: string
        central:
          type: string
          description: Central code
        reason:
          type: string
          description: Reason
        type:
          type: string
          description: Error type
        rejectedValue:
          type: string
          description: Rejected value
        name:
          type: string
          description: Name of the rejected field
      additionalProperties: false
      required:
      - reason
    innReachEdgeResponseDTO:
      $ref: '#/components/schemas/innReachResponseDTO'
    innReachResponseDTO:
      $schema: http://json-schema.org/draft-04/schema#
      description: D2IR response
      type: object
      properties:
        status:
          description: Status
          type: string
        reason:
          description: Reason
          type: string
        errors:
          description: Errors
          type: array
          items:
            $ref: '#/components/schemas/innReachError'
      additionalProperties: false
      required:
      - status
      - reason
      - errors
  parameters:
    grant_type:
      name: grant_type
      in: query
      description: The authorization grant type
      schema:
        type: string
        pattern: client_credentials
      required: true
      allowEmptyValue: false
    scope:
      name: scope
      in: query
      description: Access token scope
      schema:
        type: string
        pattern: innreach_tp
      required: true
      allowEmptyValue: false
    authorization:
      name: authorization
      in: header
      description: Authorization in form <token_type> <access_token> as returned by the authorization request
      schema:
        type: string
    x_from_code:
      name: x-from-code
      in: header
      description: Central/local code of sending system (five-character code).
      schema:
        type: string
      required: true
    x_to_code:
      name: x-to-code
      in: header
      description: Central/local code of destination system (five-character code).
      schema:
        type: string
      required: true
    x-okapi-token:
      name: x-okapi-token
      in: header
      required: true
      schema:
        type: string
    x-okapi-tenant:
      name: x-okapi-tenant
      in: header
      required: true
      schema:
        type: string
