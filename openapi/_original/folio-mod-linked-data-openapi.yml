# x-archived-from: folio-mod-linked-data-openapi.yml
# x-archived-on: 2026-10-09
openapi: 3.0.0
info:
  title: Linked Data API
  version: v1
  description: Linked Data service API
paths:
  /linked-data/reindex/full:
    post:
      operationId: fullReindex
      tags:
      - batchJob
      description: Start the process of full reindexing of all resources in the database. All resources will be reindexed regardless of their current index state.
      parameters:
      - $ref: '#/components/parameters/resourceType'
      responses:
        '200':
          description: ID of Reindex job execution
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/reindex/incremental:
    post:
      operationId: incrementalReindex
      tags:
      - batchJob
      description: Start the process of incremental reindexing of resources in the database. Only resources that have not been indexed yet (indexDate is null) will be reindexed.
      parameters:
      - $ref: '#/components/parameters/resourceType'
      responses:
        '200':
          description: ID of Reindex job execution
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/graphCleaning:
    post:
      operationId: graphCleaning
      tags:
      - batchJob
      description: Start the process of cleaning the graph from orphaned nodes.
      responses:
        '200':
          description: ID of GraphCleaning job execution
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/batch/status:
    get:
      operationId: getBatchJobStatus
      tags:
      - batchJob
      description: Get the status of a batch job by its execution ID.
      parameters:
      - $ref: '#/components/parameters/jobExecutionId'
      responses:
        '200':
          description: Batch job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/batchJobStatusDto'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          description: No batch job found for the given ID
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/resource:
    post:
      operationId: createResource
      tags:
      - resource
      description: Create a Resource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/resourceRequestDto'
      responses:
        '200':
          description: Created resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceResponseDto'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/resource/{id}:
    get:
      operationId: getResourceById
      tags:
      - resource
      description: Get a resource by id
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Resource as json string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceResponseDto'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          description: No Resource is found by id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    put:
      operationId: updateResource
      tags:
      - resource
      description: Update a resource by id
      parameters:
      - $ref: '#/components/parameters/id'
      requestBody:
        content:
          application/json:
            example: example/resourceRequest.sample
            schema:
              $ref: '#/components/schemas/resourceRequestDto'
      responses:
        '200':
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceResponseDto'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          description: No resource is found by id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    delete:
      operationId: deleteResource
      tags:
      - resource
      description: Delete a resource by id
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Resource deleted
        '404':
          description: No resource is found by id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/resource/{id}/marc:
    get:
      operationId: getResourceMarcViewById
      tags:
      - resource
      description: Get a marc view of resource by id
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Marc view of resource as json string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceMarcViewDto'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          description: No Resource is found by id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/resource/{id}/rdf:
    get:
      operationId: exportInstanceToRdf
      tags:
      - resource
      description: Export Instance resource to RDF by id
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Exported RDF resource as json string
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Resource is found by id but it is not an Instance
        '404':
          description: No Instance is found by id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/resource/metadata/{inventoryId}/id:
    get:
      operationId: getResourceIdByResourceInventoryId
      tags:
      - resource
      description: Get id of a resource by its inventory id
      parameters:
      - $ref: '#/components/parameters/inventoryId'
      responses:
        '200':
          description: Json object with id of a resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceIdDto'
        '404':
          description: No resource id is found by its inventory id
  /linked-data/inventory-instance/{inventoryId}/import-supported:
    get:
      operationId: checkMarcBibImportableToGraph
      tags:
      - resource
      description: Check if marc bibliographic record can be imported into linked data graph.
      parameters:
      - $ref: '#/components/parameters/inventoryId'
      responses:
        '200':
          description: true if marc bibliographic record can be imported into linked data graph, false otherwise.
          content:
            text/plain:
              schema:
                type: string
                example: true|false
        '404':
          description: No Record is found by inventory id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/inventory-instance/{inventoryId}/preview:
    get:
      operationId: getResourcePreviewByInventoryId
      tags:
      - resource
      description: Get the preview of a resource
      parameters:
      - $ref: '#/components/parameters/inventoryId'
      responses:
        '200':
          description: Resource as json string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceResponseDto'
        '404':
          description: No Record is found by inventory id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/inventory-instance/{inventoryId}/import:
    post:
      operationId: importMarcRecord
      tags:
      - resource
      description: Create a Resource derived from MARC record
      parameters:
      - $ref: '#/components/parameters/inventoryId'
      - $ref: '#/components/parameters/profileIdQuery'
      responses:
        '201':
          description: Json object with id of a resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceIdDto'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          description: No Record is found by inventory id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/profile/{profileId}:
    get:
      operationId: getProfileById
      tags:
      - profile
      description: Get a profile by profileId
      parameters:
      - $ref: '#/components/parameters/profileId'
      responses:
        '200':
          description: Profile with a given profileId
          content:
            text/plain;charset=utf-8:
              schema:
                type: string
                example: example/profile.sample
        '404':
          description: No profile is found with a given profileId
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/profile/metadata:
    get:
      operationId: getProfileMetadataByResourceType
      tags:
      - profile
      description: Get profiles metadata for a resource type
      parameters:
      - name: resourceType
        in: query
        required: true
        description: The type of resource for which metadata are requested
        schema:
          type: string
      responses:
        '200':
          description: Array of profile metadata for the specified resource type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/profileMetadataArray'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/profile/preferred:
    get:
      operationId: getPreferredProfileByResourceType
      tags:
      - profile
      description: Get the preferred profile for a resource type for the current user
      parameters:
      - name: resourceType
        in: query
        required: false
        description: The type of resource for which preferred profile is requested. If not specified, profiles for all resource types will be returned
        schema:
          type: string
      responses:
        '200':
          description: Preferred profile(s) for the current user and specified resource type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/profileMetadataArray'
    post:
      operationId: setPreferredProfile
      tags:
      - profile
      description: Create or update the preferred profile for a resource type for the current user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/preferredProfileRequest'
      responses:
        '204':
          description: Preferred profile created or updated successfully
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    delete:
      operationId: deletePreferredProfile
      tags:
      - profile
      description: Delete preferred profile for current user
      parameters:
      - name: resourceType
        in: query
        required: true
        description: The type of resource for which preferred profile has to be deleted.
        schema:
          type: string
      responses:
        '204':
          description: Preferred profile deleted successfully
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/profile/{profileId}/settings:
    get:
      operationId: getAllProfileSettings
      tags:
      - profile
      description: Get the workspace profile settings metadata list for a profile for the current user
      parameters:
      - $ref: '#/components/parameters/profileId'
      responses:
        '200':
          description: Workspace profile settings metadata list for the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customProfileSettingsMetadataArray'
        '404':
          description: No profile found with a given profileId
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    post:
      operationId: createProfileSettings
      tags:
      - profile
      description: Create the workspace profile settings for a profile for the current user
      parameters:
      - $ref: '#/components/parameters/profileId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/customProfileSettingsRequestDto'
      responses:
        '201':
          description: Workspace profile settings created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customProfileSettingsMetadata'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          description: No profile found with a given profileId
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/profile/{profileId}/settings/{profileSettingsId}:
    get:
      operationId: getProfileSettings
      tags:
      - profile
      description: Get the workspace profile settings for a profile for the current user
      parameters:
      - $ref: '#/components/parameters/profileId'
      - $ref: '#/components/parameters/profileSettingsId'
      responses:
        '200':
          description: Workspace profile settings for the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customProfileSettingsResponseDto'
        '404':
          description: No profile found with a given profileId
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    put:
      operationId: setProfileSettings
      tags:
      - profile
      description: Update the workspace profile settings for a profile for the current user
      parameters:
      - $ref: '#/components/parameters/profileId'
      - $ref: '#/components/parameters/profileSettingsId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/customProfileSettingsRequestDto'
      responses:
        '204':
          description: Workspace profile settings created or updated successfully
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          description: No profile found with a given profileId
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    delete:
      operationId: deleteProfileSettings
      tags:
      - profile
      description: Delete a saved workspace profile settings for a profile for the current user
      parameters:
      - $ref: '#/components/parameters/profileId'
      - $ref: '#/components/parameters/profileSettingsId'
      responses:
        '204':
          description: Saved workspace profile settings deleted successfully
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/profile/{profileId}/preferred:
    get:
      operationId: getPreferredProfileSettings
      tags:
      - profile
      description: Get the preferred profile settings for the profile
      parameters:
      - $ref: '#/components/parameters/profileId'
      responses:
        '200':
          description: Preferred profile settings for the profile and current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/customProfileSettingsMetadataArray'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    post:
      operationId: setPreferredProfileSettings
      tags:
      - profile
      description: Set the preferred profile settings for the profile
      parameters:
      - $ref: '#/components/parameters/profileId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/preferredProfileSettingsRequest'
      responses:
        '204':
          description: Preferred profile settings created or updated successfully
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    delete:
      operationId: deletePreferredProfileSettings
      tags:
      - profile
      description: Delete the preferred profile settings for the profile
      parameters:
      - $ref: '#/components/parameters/profileId'
      responses:
        '204':
          description: Preferred profile settings deleted successfully
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/resource/{id}/graph:
    get:
      operationId: getResourceGraphById
      tags:
      - graph
      description: Get a resource graph by id
      parameters:
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Resource graph as json string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourcePlaceholder'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          description: No Resource graph is found by id
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/authority-assignment-check:
    post:
      operationId: authority-assignment-check
      tags:
      - authority
      description: Checks if authority can be assigned to work
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/assignmentCheckDto'
      responses:
        '200':
          description: Returns the result of the assignment check, including whether the assignment is valid and, if not, the reason for invalidity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/assignmentCheckResponseDto'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/import/file:
    post:
      operationId: import-file
      tags:
      - import
      description: Imports an uploaded JSON file containing at least one resource
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                fileName:
                  type: string
                  format: binary
      responses:
        '200':
          description: Returns a list of resource IDs and an import activity log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/importResponseDto'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/import/url:
    post:
      operationId: import-url
      tags:
      - import
      description: Imports from a URL containing at least one resource
      parameters:
      - $ref: '#/components/parameters/importUrl'
      - $ref: '#/components/parameters/defaultWorkType'
      responses:
        '200':
          description: Returns a list of resource IDs and an import activity log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/importResponseDto'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/hub:
    get:
      operationId: getHubPreviewByUri
      tags:
      - hub
      description: Get the preview of a remote Hub resource
      parameters:
      - $ref: '#/components/parameters/hubUri'
      responses:
        '200':
          description: Resource as json string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceResponseDto'
        '404':
          description: No Hub resource is found by Hub URI
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    post:
      operationId: saveHubByUri
      tags:
      - hub
      description: Save a remote Hub resource
      parameters:
      - $ref: '#/components/parameters/hubUri'
      responses:
        '200':
          description: Saved resource as json string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceResponseDto'
        '404':
          description: No Hub resource is found by Hub URI
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/vocabularies/{vocabularyName}:
    get:
      operationId: getVocabularyByName
      tags:
      - vocabulary
      description: Get vocabulary JSON by vocabulary name
      parameters:
      - $ref: '#/components/parameters/vocabularyName'
      responses:
        '200':
          description: Vocabulary as json string
          content:
            application/json:
              schema:
                type: string
        '404':
          description: No vocabulary is found by vocabulary name
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /linked-data/admin/caches:
    delete:
      operationId: clearCaches
      tags:
      - admin
      description: Clear all application caches
      responses:
        '204':
          description: Application caches cleared
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
components:
  parameters:
    id:
      name: id
      in: path
      required: true
      description: Linked Data resource id
      schema:
        type: integer
        format: int64
    inventoryId:
      name: inventoryId
      in: path
      required: true
      description: Inventory ID (999 $i) of the MARC record in SRS
      schema:
        type: string
    resourceType:
      name: resourceType
      in: query
      required: false
      description: 'The specified resource type to be re-indexed. Available options: HUB, WORK'
      schema:
        type: string
    profileId:
      name: profileId
      in: path
      required: true
      description: ID of the profile
      schema:
        type: integer
        format: int16
    profileSettingsId:
      name: profileSettingsId
      in: path
      required: true
      description: ID of the profile settings
      schema:
        type: integer
        format: int16
    profileIdQuery:
      name: profileId
      in: query
      required: false
      description: ID of the profile
      schema:
        type: integer
        format: int16
    hubUri:
      name: hubUri
      in: query
      required: true
      description: URI of a remote Hub resource
      schema:
        type: string
    importUrl:
      name: url
      in: query
      required: true
      description: URL of a remote Instance resource
      schema:
        type: string
    defaultWorkType:
      name: defaultWorkType
      in: query
      required: true
      description: URI for the default Work type to use when no further Work typing is available
      schema:
        type: string
    jobExecutionId:
      name: jobExecutionId
      in: query
      required: true
      description: The ID of the job execution
      schema:
        type: integer
        format: int64
    vocabularyName:
      name: vocabularyName
      in: path
      required: true
      description: Vocabulary name
      schema:
        type: string
  schemas:
    errorResponse:
      $ref: '#/components/schemas/errors'
    parameter:
      description: List of key/value parameters of an error
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      properties:
        key:
          description: Parameter key
          type: string
        value:
          description: Parameter value
          type: string
    parameters:
      description: List of key/value parameters of an error
      $schema: http://json-schema.org/draft-04/schema#
      type: array
      items:
        type: object
        $ref: '#/components/schemas/parameter'
    error:
      description: An error
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      properties:
        message:
          type: string
          description: Error message text
        type:
          type: string
          description: Error message type
        code:
          type: string
          description: Error message code
        parameters:
          type: object
          description: Error message parameters
          $ref: '#/components/schemas/parameters'
    errors:
      description: A set of errors
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      properties:
        errors:
          description: List of errors
          id: errors
          type: array
          items:
            type: object
            $ref: '#/components/schemas/error'
        total_records:
          description: Total number of errors
          type: integer
    batchJobStatusDto:
      $schema: http://json-schema.org/draft-04/schema#
      description: Batch job status DTO
      type: object
      properties:
        jobName:
          type: string
          description: Spring Batch Job name - ReindexJob or GraphCleaningJob
        startDate:
          type: string
          format: date-time
          description: Date and time when the batch job was started
        endDate:
          type: string
          format: date-time
          description: Date and time when the batch job finished
        startedBy:
          type: string
          description: ID of the user who started the batch job
        reindexType:
          type: string
          enum:
          - FULL
          - INCREMENTAL
          description: 'Type of reindex: full or incremental'
        executionRound:
          type: integer
          format: int32
          description: Job execution round
        linesRead:
          type: integer
          format: int64
          description: Total number of resources read during job execution
        linesSent:
          type: integer
          format: int64
          description: Total number of resources written during job execution
        status:
          type: string
          description: Current status of the batch job (e.g. STARTED, COMPLETED, FAILED)
    ProfileIdField:
      $schema: http://json-schema.org/draft-04/schema#
      description: Schema for the profile ID field used in request and response
      type: object
      properties:
        profileId:
          type: integer
          format: int16
          description: ID of the profile
      required:
      - profileId
    BaseTitle:
      $schema: http://json-schema.org/draft-04/schema#
      description: Base Title Fields
      allOf:
      - type: object
        properties:
          partName:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/partName
          partNumber:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/partNumber
          mainTitle:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/mainTitle
          subTitle:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/subTitle
    PrimaryTitle:
      $schema: http://json-schema.org/draft-04/schema#
      description: Primary Title Info
      allOf:
      - $ref: '#/components/schemas/BaseTitle'
      - type: object
        properties:
          nonSortNum:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/bflc/nonSortNum
    VariantTitle:
