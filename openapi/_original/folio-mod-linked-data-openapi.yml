        children:
          type: array
          description: Profile block children
          items:
            $ref: '#/components/schemas/customProfileSettingsChild'
      required:
      - active
      - children
    customProfileSettings:
      $schema: http://json-schema.org/draft-04/schema#
      description: Workspace custom profile settings
      type: object
      allOf:
