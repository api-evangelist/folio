      description: Resource placeholder
      type: object
      format: Resource
    assignmentCheckDto:
      $schema: http://json-schema.org/draft-04/schema#
      description: Container for raw marc and target type
      type: object
      properties:
        rawMarc:
          type: string
          description: Raw MARC json
        target:
          type: string
          enum:
          - CREATOR_OF_WORK
          - SUBJECT_OF_WORK
          - DEGREE_GRANTING_INSTITUTION
          description: Target type
      required:
      - rawMarc
      - target
    assignmentCheckResponseDto:
