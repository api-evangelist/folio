    holdShelfExpiryPeriod:
      additionalProperties: false
      description: Expiration period for items on the hold shelf at the service point
      example:
        duration: 6
        intervalId: Days
      properties:
        duration:
          description: Duration interval
          type: integer
        intervalId:
          default: Days
          description: Unit of time for the duration
          enum:
          - Minutes
          - Hours
          - Days
          - Weeks
          - Months
          type: string
      required:
      - duration
      - intervalId
      title: Hold Shelf Expiry Period
      type: object
    servicePointStaffSlip:
      additionalProperties: false
      description: Service point staff slip
      example:
        printByDefault: true
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        id:
          description: The ID of the staff slip
          format: uuid
          type: string
        printByDefault:
          description: Whether or not to print the staff slip by default
          type: boolean
      required:
      - id
      - printByDefault
      title: Service Point Staff Slip
      type: object
    parameter:
      description: List of key/value parameters of an error
      example:
        key: source
        value: invalid
      properties:
        key:
          description: Parameter key
          type: string
        value:
          description: Parameter value
          type: string
      title: Parameter
      type: object
