      summary: Delete all locations
      tags:
      - locations
    get:
      description: Return a list of locations.
      operationId: getLocations
      parameters:
      - description: CQL query expression.
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: Limit the number of elements returned.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          minimum: 0
          type: integer
      - description: Skip over a number of elements.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: Whether to include shadow records in the response or not.
        in: query
        name: includeShadow
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/locationsCollection'
          description: Collection of locations.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: Bad request.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: Internal server error.
      summary: Get locations
      tags:
      - locations
    post:
      description: Create a new location.
      operationId: createLocation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/location'
        required: true
      responses:
