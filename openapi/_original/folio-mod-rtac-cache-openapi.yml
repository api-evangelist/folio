          description: Additional information about the borrower of the item, taken from the user referred to by the userId
          readonly: true
          type: object
          properties:
            firstName:
              description: first name of the borrower (read only, defined by the server)
              type: string
              readonly: true
            lastName:
              description: last name of the borrower (read only, defined by the server)
              type: string
              readonly: true
            middleName:
              description: middle name of the borrower (read only, defined by the server)
              type: string
              readonly: true
            barcode:
              description: barcode used to identify the borrower (read only, defined by the server)
              type: string
              readonly: true
            preferredFirstName:
              description: preferred first name of the borrower (read only, defined by the server)
              type: string
              readonly: true
            patronGroup:
              description: current patron group of the borrower (read only, defined by the server)
              type: string
              readonly: true
          additionalProperties: false
        proxyUserId:
          description: UUID of the proxy user acting on behalf of the patron
          $ref: '#/components/schemas/uuid'
        itemId:
          description: UUID of the item associated with this loan
          $ref: '#/components/schemas/uuid'
        loanPolicyId:
          description: UUID of the loan policy applied to this loan
          $ref: '#/components/schemas/uuid'
        loanPolicy:
          description: Additional information about the loan policy of the item, taken from the loan loanPolicyId
          readonly: true
          type: object
          properties:
            name:
              readonly: true
              description: Name of last policy used in relation to this loan (read only, defined by the server)
              type: string
        overdueFinePolicyId:
          description: UUID of the overdue fine policy applied to this loan
          $ref: '#/components/schemas/uuid'
        overdueFinePolicy:
          description: Additional information about the overdue fine policy of the item, taken from the loan overdueFinePolicyId
          readonly: true
          type: object
          properties:
            name:
              readonly: true
              description: Name of last overdue fine policy used in relation to this loan (read only, defined by the server)
              type: string
        lostItemPolicyId:
          description: UUID of the lost item policy applied to this loan
          $ref: '#/components/schemas/uuid'
        lostItemPolicy:
          description: Additional information about the lost item policy of the item, taken from the loan lostItemPolicyId
          readonly: true
          type: object
          properties:
            name:
              readonly: true
              description: Name of last lost item policy used in relation to this loan (read only, defined by the server)
              type: string
        itemEffectiveLocationIdAtCheckOut:
          description: UUID of the item's effective location at the time of checkout
          $ref: '#/components/schemas/uuid'
        status:
          description: Overall status of the loan
          type: object
          properties:
            name:
              description: Name of the status (currently can be any value, values commonly used are Open and Closed)
              type: string
        loanDate:
          description: Date and time when the loan began
          type: string
          format: date-time
        dueDate:
          description: Date and time when the item is due to be returned
          type: string
          format: date-time
        returnDate:
          description: Date and time when the item was returned
          type: string
          format: date-time
        systemReturnDate:
          description: Date and time when return was processed
          type: string
          format: date-time
        action:
          description: Last action performed on a loan (currently can be any value, values commonly used are checkedout and checkedin)
          type: string
        actionComment:
          description: Last action performed on a loan comments
          type: string
        renewalCount:
          description: Count of how many times a loan has been renewed (incremented by the client)
          type: integer
          minimum: 0
        dueDateChangedByRecall:
          description: Is due date changed by recall request
          type: boolean
          readonly: true
        dueDateChangedByNearExpireUser:
          description: Indicates whether or not this loan had its due date modified by a expired user
          type: boolean
        dueDateChangedByHold:
          description: Is due date changed by hold request
          type: boolean
          readonly: true
        checkoutServicePointId:
          description: UUID of the checkout service point
          $ref: '#/components/schemas/uuid'
        checkinServicePointId:
          description: UUID of the check-in service point
          $ref: '#/components/schemas/uuid'
        checkoutServicePoint:
          description: Checkout service point information
          $ref: '#/components/schemas/servicePoint'
        checkinServicePoint:
          description: Check-in service point information
          $ref: '#/components/schemas/servicePoint'
        patronGroupAtCheckout:
          description: Patron Group at checkout
          type: object
          properties:
            id:
              $ref: '#/components/schemas/uuid'
            name:
              description: Patron group name
              type: string
              readonly: true
          additionalProperties: false
        feesAndFines:
          description: Fees and fines associated with loans
          type: object
          properties:
            amountRemainingToPay:
              type: number
              description: Total remaining amount due on fees and fines for the loan (read only, defined by the server)
              readonly: true
          additionalProperties: false
        declaredLostDate:
          description: Date and time the item was declared lost during this loan
          type: string
          format: date-time
        isDcb:
          description: Indicates whether or not this loan is associated for DCB use case
          type: boolean
        metadata:
          $ref: '#/components/schemas/metadata'
      required:
      - itemId
      - loanDate
      - action
    loans:
      $schema: http://json-schema.org/draft-04/schema#
      title: Collection of loans
      description: Collection of loans
      type: object
      properties:
        loans:
          description: Paged collection of loans
          id: loans
          type: array
          items:
            $ref: '#/components/schemas/loan'
        totalRecords:
          description: Total number of loan records
          type: integer
      required:
      - loans
      - totalRecords
    request:
      $schema: http://json-schema.org/draft-04/schema#
      title: A request for an item
      description: Request for an item that might be at a different location or already checked out to another patron
      type: object
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        requestType:
          description: Whether the item should be held upon return, recalled or paged for
          type: string
          enum:
          - Hold
          - Recall
          - Page
        requestLevel:
          description: Level of the request - Item or Title
          type: string
          enum:
          - Item
          - Title
        requestDate:
          description: Date the request was made
          type: string
          format: date-time
        patronComments:
          description: Comments made by the patron
          type: string
        requesterId:
          description: UUID of the patron who placed the request
          $ref: '#/components/schemas/uuid'
        proxyUserId:
          description: UUID of the proxy user acting on behalf of the requester
          $ref: '#/components/schemas/uuid'
        instanceId:
          description: UUID of the instance associated with this request
          $ref: '#/components/schemas/uuid'
        holdingsRecordId:
          description: UUID of the holdings record associated with this request
          $ref: '#/components/schemas/uuid'
        itemId:
          description: UUID of the item associated with this request
          $ref: '#/components/schemas/uuid'
        status:
          description: Status of the request
          type: string
          enum:
          - Open - Not yet filled
          - Open - Awaiting pickup
          - Open - In transit
          - Open - Awaiting delivery
          - Closed - Filled
          - Closed - Cancelled
          - Closed - Unfilled
          - Closed - Pickup expired
        cancellationReasonId:
          description: UUID of the cancellation reason
          $ref: '#/components/schemas/uuid'
        cancelledByUserId:
          description: UUID of the user who cancelled the request
          $ref: '#/components/schemas/uuid'
        cancellationAdditionalInformation:
          description: Additional information about a cancellation
          type: string
        cancelledDate:
          description: Date the request was cancelled
          type: string
          format: date-time
        position:
          description: position of the request in a per-item request queue
          type: integer
          minimum: 1
        instance:
          description: Copy of some instance metadata (used for searching and sorting)
          type: object
          properties:
            title:
              description: title of the item
              type: string
            identifiers:
              type: array
              description: An extensible set of name-value pairs of identifiers associated with the resource
              minItems: 0
              items:
                type: object
                properties:
                  value:
                    type: string
                    description: Resource identifier value
                  identifierTypeId:
                    description: UUID of the identifier type
                    $ref: '#/components/schemas/uuid'
                additionalProperties: false
                required:
                - value
                - identifierTypeId
        item:
          description: Copy of some item metadata (used for searching and sorting)
          type: object
          properties:
            barcode:
              description: barcode of the item
              type: string
          additionalProperties: false
        requester:
          description: Copy of some requesting patron metadata (used for searching and sorting), will be taken from the user referred to by the requesterId
          readonly: true
          type: object
          properties:
            firstName:
              description: first name of the patron (read only, defined by the server)
              type: string
              readonly: true
            lastName:
              description: last name of the patron (read only, defined by the server)
              type: string
              readonly: true
            middleName:
              description: middle name of the patron (read only, defined by the server)
              type: string
              readonly: true
            barcode:
              description: barcode of the patron (read only, defined by the server)
              type: string
              readonly: true
            patronGroupId:
              description: UUID of the patron group
              $ref: '#/components/schemas/uuid'
            patronGroup:
              description: record for the user's patron group
              type: object
              additionalProperties: false
              readonly: true
              properties:
                id:
                  description: UUID of the patron group record
                  $ref: '#/components/schemas/uuid'
                group:
                  description: The unique name of the patron group
                  type: string
                  readonly: true
                desc:
                  description: A description of the patron group
                  type: string
                  readonly: true
          additionalProperties: false
        proxy:
          description: Copy of some proxy patron metadata (used for searching and sorting), will be taken from the user referred to by the proxyUserId
          readonly: true
          type: object
          properties:
            firstName:
              description: first name of the proxy patron (read only, defined by the server)
              type: string
              readonly: true
            lastName:
              description: last name of the proxy patron (read only, defined by the server)
              type: string
              readonly: true
            middleName:
              description: middle name of the proxy patron (read only, defined by the server)
              type: string
              readonly: true
            barcode:
              description: barcode of the proxy patron (read only, defined by the server)
              type: string
              readonly: true
            patronGroupId:
              description: UUID of the patron group
              $ref: '#/components/schemas/uuid'
            patronGroup:
              description: record for the user's patrongroup
              type: object
              readonly: true
              additionalProperties: false
              properties:
                id:
                  description: UUID of the patron group record
                  $ref: '#/components/schemas/uuid'
                group:
                  description: The unique name of the patrongroup
                  type: string
                  readonly: true
                desc:
                  description: A description of the patrongroup
                  type: string
                  readonly: true
          additionalProperties: false
        fulfillmentPreference:
          description: How should the request be fulfilled (whether the item should be kept on the hold shelf for collection or delivered to the requester)
          type: string
          enum:
          - Hold Shelf
          - Delivery
        deliveryAddressTypeId:
          description: UUID of the delivery address type
          $ref: '#/components/schemas/uuid'
        deliveryAddress:
          description: Address the item is to be delivered to (derived from requester information)
          type: object
          readonly: true
          properties:
            addressLine1:
              description: Address line 1
              type: string
              readonly: true
            addressLine2:
              description: Address line 2
              type: string
              readonly: true
            city:
              description: City name
              type: string
              readonly: true
            region:
              description: Region
              type: string
              readonly: true
            postalCode:
              description: Postal code
              type: string
              readonly: true
            countryId:
              description: Country code
              type: string
              readonly: true
            addressTypeId:
              description: UUID of the delivery address type
              $ref: '#/components/schemas/uuid'
          additionalProperties: false
        requestExpirationDate:
          description: Date when the request expires
          type: string
          format: date-time
        holdShelfExpirationDate:
          description: Date when an item returned to the hold shelf expires
          type: string
          format: date-time
        pickupServicePointId:
          description: UUID of the pickup service point
          $ref: '#/components/schemas/uuid'
        pickupServicePoint:
          description: The full object of the Service Point record from pickupServicePointId
          additionalProperties: false
          readonly: true
          properties:
            name:
              description: Unique name for the service point
              type: string
              readonly: true
            code:
              description: Unique code for the service point
              type: string
              readonly: true
            discoveryDisplayName:
              description: Human-readable name for the service point
              type: string
              readonly: true
            description:
              description: Description of the service point
              type: string
              readonly: true
            shelvingLagTime:
              description: Shelving lag time
              type: integer
              readonly: true
            pickupLocation:
              description: Is this service point a pickup location?
              type: boolean
              readonly: true
        printDetails:
          description: The print details of the request
          type: object
          readonly: true
          properties:
            printCount:
              description: Total no of times the request is printed
              type: integer
              readOnly: true
            requesterId:
              description: User uuid of last print requester
              type: string
              readOnly: true
            isPrinted:
              description: Whether the request is ever printed
              type: boolean
              readOnly: true
            printEventDate:
              description: Recent printed time of the request
              type: string
              format: date-time
              readOnly: true
            lastPrintRequester:
              description: Details of the User who printed the request recently
              readonly: true
              type: object
              properties:
                firstName:
                  description: first name of the user
                  type: string
                  readonly: true
                lastName:
                  description: last name of the user
                  type: string
                  readonly: true
                middleName:
                  description: middle name of the user
                  type: string
                  readonly: true
        tags:
          $ref: '#/components/schemas/tags'
        metadata:
          $ref: '#/components/schemas/metadata'
        itemLocationCode:
          description: Allow specifying item location when creating title-level requests
          type: string
        isDcbReRequestCancellation:
          description: Indicates whether the request was cancelled during a DCB transaction update
          type: boolean
      required:
      - requesterId
      - requestType
      - requestDate
      - fulfillmentPreference
    requests:
      $schema: http://json-schema.org/draft-04/schema#
      title: Collection of item requests
      description: Collection of item requests
      type: object
      properties:
        requests:
          description: Paged collection of item requests
          id: requests
          type: array
          items:
            $ref: '#/components/schemas/request'
        totalRecords:
          description: Total number of item requests
          type: integer
      required:
      - requests
      - totalRecords
    pieceCollection:
      $schema: http://json-schema.org/draft-04/schema#
      description: collection of piece records
      type: object
      properties:
        pieces:
          description: collection of piece records
          type: array
          id: pieces
          items:
            $ref: '#/components/schemas/piece'
        totalRecords:
          description: The number of objects contained in this collection
          type: integer
      additionalProperties: false
    holdingsFacet:
      $schema: http://json-schema.org/draft-04/schema#
      description: Response schema for search holdings tenants
      type: object
      properties:
        facets:
          description: Requested facets
          type: object
          properties:
            holdings.tenantId:
              description: Facet name
              type: object
              properties:
                values:
                  description: Facet result values
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        description: Facet value
                        type: string
                      totalRecords:
                        type: integer
                totalRecords:
                  type: integer
        totalRecords:
          type: integer
      required:
      - facets
      - totalRecords
      additionalProperties: false
    userTenants:
      $schema: http://json-schema.org/draft-04/schema#
      description: Response schema for user tenants
      type: object
      properties:
        userTenants:
          description: User tenant affiliations
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              userId:
                description: user UUID
                type: string
              username:
                description: username
                type: string
              tenantId:
                description: tenant id of user tenant affiliation
                type: string
              centralTenantId:
                description: central tenant id
                type: string
              consortiumId:
                description: id of consortium from mod-consortia
                type: string
        totalRecords:
          type: integer
      required:
      - userTenants
      - totalRecords
      additionalProperties: false
    settings:
      description: Setting entries response
      type: object
      properties:
        items:
          description: List of settings
          type: array
          items:
            type: object
            properties:
              id:
                description: Identifier
                type: string
                format: uuid
              scope:
                type: string
                description: Scope for this entry (normally a module)
              key:
                type: string
                description: Key within scope for this setting
              value:
                description: Settings value (any type)
              userId:
                type: string
                format: uuid
                description: Owner of this setting (optional)
        resultInfo:
          $ref: '#/components/schemas/resultInfo'
      additionalProperties: false
      required:
      - items
    materialType:
      $schema: http://json-schema.org/draft-04/schema#
      description: A material type
      type: object
      properties:
        id:
          type: string
        name:
          description: label for the material type
          type: string
        source:
          description: origin of the material type record
          type: string
        metadata:
          $ref: '#/components/schemas/metadata'
      required:
      - name
    materialTypes:
      $schema: http://json-schema.org/draft-04/schema#
      description: A collection of material types
      type: object
      properties:
        mtypes:
          description: List of material types
          id: mtype
          type: array
          items:
            $ref: '#/components/schemas/materialType'
        totalRecords:
          description: Estimated or exact total number of records
          type: integer
      required:
      - mtypes
      - totalRecords
    loanType:
      $schema: http://json-schema.org/draft-04/schema#
      description: A loan type
      type: object
      properties:
        id:
          type: string
        name:
          description: label for the loan type
          type: string
        source:
          description: Origin of the loan type record, e.g. 'System', 'User', 'Consortium' etc.
          type: string
        metadata:
          $ref: '#/components/schemas/metadata'
      required:
      - name
    loanTypes:
      $schema: http://json-schema.org/draft-04/schema#
      description: A collection of loan types
      type: object
      properties:
        loantypes:
          description: List of loan types
          id: loantype
          type: array
          items:
            $ref: '#/components/schemas/loanType'
        totalRecords:
          description: Estimated or exact total number of records
          type: integer
      required:
      - loantypes
      - totalRecords
    instance:
      $schema: http://json-schema.org/draft-04/schema#
      description: An instances records
      type: object
      properties:
        id:
          $ref: '#/components/schemas/uuid'
        title:
          type: string
          description: The primary title (or label) associated with the resource
        source:
          type: string
          description: The metadata source and its format of the underlying record to the instance record. (e.g. FOLIO if it's a record created in Inventory; MARC if it's a MARC record created in MARCcat or EPKB if it's a record coming from eHoldings; CONSORTIUM-MARC or CONSORTIUM-FOLIO for sharing Instances).
        instanceFormatIds:
          type: array
          description: UUIDs for the unique terms for the format whether it's from the RDA carrier term list of locally defined
          items:
            $ref: '#/components/schemas/uuid'
    instances:
      $schema: http://json-schema.org/draft-04/schema#
      description: An instances records
      type: object
      properties:
        instances:
          type: array
          description: Paged collection of instance records
          items:
            $ref: '#/components/schemas/instance'
        totalRecords:
          type: integer
          description: Total number of instance records
      required:
      - instances
      - totalRecords
    consortiaTenants:
      $schema: http://json-schema.org/draft-04/schema#
      title: Consortia Tenants
      type: object
      description: List of tenants in a consortia
      properties:
        tenants:
          type: array
          description: Tenants
          items:
            type: object
            properties:
              id:
                type: string
                description: Tenant identifier
              code:
                description: Short tenant code
                type: string
                minLength: 2
                maxLength: 5
                pattern: ^[a-zA-Z0-9]*$
              name:
                description: Tenant name
                type: string
                minLength: 2
                maxLength: 150
              isCentral:
                type: boolean
                description: Whether the tenant is the central tenant
              isDeleted:
                type: boolean
                description: Whether the tenant is marked as deleted
            required:
            - id
            - code
            - name
            - isCentral
        totalRecords:
          type: integer
          description: Total number of tenant records
      required:
      - tenants
      - totalRecords
    batchIdsDto:
      description: Batch IDs DTO
      type: object
      properties:
        identifierType:
          description: Type of entity identifier
          type: string
          enum:
          - id
          - hrid
          - accessionNumber
          - formerIds
          - barcode
          - holdingsRecordId
          - instanceId
          - instanceHrid
          - itemBarcode
        identifierValues:
          description: Entity identifier values
          type: array
          items:
            type: string
      required:
      - identifierType
      - identifierValues
    consortiumHolding:
      type: object
      description: A holdings record returned from a consortium holdings search
      properties:
        id:
          description: Holdings ID
          type: string
        hrid:
          description: Holdings HRID
          type: string
        tenantId:
          description: Tenant ID of the Holding
          type: string
        instanceId:
          description: Related Instance Id
          type: string
          format: uuid
        discoverySuppress:
          description: Discovery suppress flag
          type: boolean
        callNumberPrefix:
          description: Call number prefix
          type: string
        callNumber:
          description: Call number
          type: string
        callNumberSuffix:
          description: Call number suffix
          type: string
        copyNumber:
          description: Copy number
          type: string
        permanentLocationId:
          description: Permanent Location ID
          type: string
    consortiumHoldings:
      $schema: http://json-schema.org/draft-04/schema#
      description: Response schema for consortium holdings search
      type: object
      properties:
        holdings:
          description: Holdings search results
          type: array
          items:
            $ref: '#/components/schemas/consortiumHolding'
        totalRecords:
          description: Total number of records available
          type: integer
      additionalProperties: false
  parameters:
    query-param:
      name: query
      in: query
      description: A search query to find holdings by volume, location name, or call number
      required: true
      schema:
        type: string
    available-param:
      name: available
      in: query
      description: Filter by holdings that are available
      required: false
      schema:
        type: boolean
    sort-param:
      name: sort
      in: query
      description: 'A list of sort criteria in the format: `property,(asc|desc)`.

        Supported properties are: effectiveShelvingOrder, libraryName, locationName, status.

        If the direction is omitted for a property, the default direction is `desc` for effectiveShelvingOrder and `asc` for other properties.

        The default sort order is effectiveShelvingOrder (descending), status (ascending), libraryName (ascending), locationName (ascending).

        '
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
    offset-param:
      in: query
      name: offset
      description: Skip over a number of elements by specifying an offset value for the query.
      schema:
        type: integer
        minimum: 0
        maximum: 100000
        default: 0
    limit-param:
      in: query
      name: limit
      description: Limit the number of elements returned in the response.
      schema:
        type: integer
        minimum: 0
        maximum: 500
        default: 100
