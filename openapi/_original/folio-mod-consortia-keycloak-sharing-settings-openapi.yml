    SharingSettingBody:
      description: Sharing settings object
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharingSettingRequest'
          example:
            settingId: 1844767a-8367-4926-9999-514c35840399
            url: /organizations-storage/organizations
            payload:
              id: 1844767a-8367-4926-9999-514c35840399
              name: ORG-NAME
              source: local
  responses:
    SharingSettingResponse:
      description: Returns a sharing setting object response for post operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharingSettingResponse'
          example:
            createSettingsPCId: c734a41e-16ba-4a02-beb0-2d45081e39b1
            updateSettingsPCId: 53e0f091-ffee-448c-a0f8-562d9ad6bf3f
    SharingSettingDeleteResponse:
      description: Returns a sharing setting response for delete operation
      content:
