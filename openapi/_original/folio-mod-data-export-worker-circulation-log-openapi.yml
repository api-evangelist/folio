# x-archived-from: folio-mod-data-export-worker-circulation-log-openapi.yml
# x-archived-on: 2026-10-09
openapi: 3.0.0
info:
  title: Circulation log export schemas
  version: v1
servers:
- url: https://stub.com/
paths:
  /stub:
    get:
      responses:
        '200':
          description: stub
components:
  schemas:
    logRecord:
      $ref: '#/components/schemas/LogRecord'
    logRecordCollection:
      $ref: '#/components/schemas/LogRecordCollection'
    configuration:
      $ref: '#/components/schemas/Configuration'
    configurationCollection:
      $ref: '#/components/schemas/ConfigurationCollection'
    job:
      $ref: '#/components/schemas/Job'
    exportType:
      $ref: '#/components/schemas/ExportType'
    entityType:
      $ref: '#/components/schemas/EntityType'
    progress:
      $ref: '#/components/schemas/Progress'
    identifierType:
      $ref: '#/components/schemas/IdentifierType'
    jobStatus:
      $ref: '#/components/schemas/JobStatus'
    exportTypeSpecificParameters:
      $ref: '#/components/schemas/ExportTypeSpecificParameters'
    LoggedObjectType:
      type: string
      enum:
      - N/A
      - Fee/Fine
      - Item Block
      - Loan
      - Manual Block
      - Notice
      - Patron Block
      - Request
      - CheckIn/CheckOut
    ActionType:
      type: string
      enum:
      - Age to lost
      - Anonymize
      - Billed
      - Cancelled
      - Cancelled as error
      - Changed due date
      - Check in
      - Check out
      - Checked in
      - Checked out
      - Checked out through override
      - Claimed returned
      - Closed loan
      - Created
      - Created through override
      - Credited fully
      - Declared lost
      - Deleted
      - Edited
      - Expired
      - Marked as missing
      - Modified
      - Moved
      - Paid fully
      - Paid partially
      - Patron blocked from requesting
      - Pickup expired
      - Queue position reordered
      - Recall requested
      - Refunded fully
      - Refunded partially
      - Renewed
      - Renewed through override
      - Request status changed
      - Send
      - Send error
      - Staff information only added
      - Patron info added
      - Staff info added
      - Transferred fully
      - Transferred partially
      - Waived fully
      - Waived partially
    LogRecord:
      type: object
      properties:
        id:
          description: Log record id
          type: string
        eventId:
          description: Event id
          type: string
        userBarcode:
          description: User barcode
          type: string
        items:
          description: Notice items
          type: array
          items:
            type: object
            description: Item related data
            properties:
              itemBarcode:
                description: Item barcode
                type: string
              itemId:
                description: Item id
                type: string
              instanceId:
                description: Instance id
                type: string
              holdingId:
                description: Holding id
                type: string
              loanId:
                description: Loan id
                type: string
            additionalProperties: false
            required:
            - itemBarcode
        object:
          description: The logged object type
          $ref: '#/components/schemas/LoggedObjectType'
        action:
          description: Action type
          $ref: '#/components/schemas/ActionType'
        date:
          description: Event date
          type: string
          format: date-time
        servicePointId:
          description: Service point id
          type: string
        source:
          description: Source
          type: string
        description:
          description: Description
          type: string
        linkToIds:
          description: Additional data for details
          type: object
          properties:
            userId:
              description: User id
              type: string
            requestId:
              description: Request id
              type: string
            feeFineId:
              description: Fee/Fine id
              type: string
            templateId:
              description: Template id
              type: string
            noticePolicyId:
              description: Notice Policy id
              type: string
      additionalProperties: false
      required:
      - eventId
    LogRecordCollection:
      type: object
      properties:
        logRecords:
          type: array
          description: Circulation audit log records
          items:
            $ref: '#/components/schemas/LogRecord'
        totalRecords:
          type: integer
      required:
      - logRecords
      - totalRecords
    Metadata:
      type: object
      title: Metadata Schema
      properties:
        createdDate:
          description: Date and time when the record was created
          type: string
          format: date-time
        createdByUserId:
          description: ID of the user who created the record (when available)
          type: string
          format: uuid
        createdByUsername:
          description: Username of the user who created the record (when available)
          type: string
          maxLength: 50
        updatedDate:
          description: Date and time when the record was last updated
          type: string
          format: date-time
        updatedByUserId:
          description: ID of the user who last updated the record (when available)
          type: string
          format: uuid
        updatedByUsername:
          description: Username of the user who last updated the record (when available)
          type: string
          maxLength: 50
      additionalProperties: false
    Configuration:
      type: object
      title: Configuration Schema
      properties:
        id:
          description: A globally unique (UUID) identifier
          type: string
        module:
          description: The name of module the config belongs to
          type: string
        configName:
          description: Name of config
          type: string
        code:
          description: ' globally unique (UUID) identifier'
          type: string
        description:
          description: Configuration description
          type: string
        default:
          description: A flag to determine if a config is default
          type: boolean
        enabled:
          description: A flag is config active
          type: boolean
        value:
          description: JSON object
          type: string
        userId:
          description: A UUID corresponding to User who created
          type: string
        metadata:
          $ref: '#/components/schemas/Metadata'
      additionalProperties: false
      required:
      - module
      - configName
    FacetValue:
      type: object
      properties:
        count:
          type: integer
          description: Count of facet values
        value:
          type: object
          description: Value Object
    Facet:
      type: object
      properties:
        facetValues:
          type: array
          description: Array of facet values
          items:
            $ref: '#/components/schemas/FacetValue'
          additionalProperties: false
        type:
          type: string
          description: Type of facet
      additionalProperties: false
    Diagnostic:
      type: object
      properties:
        source:
          type: string
          description: Source reporting the diagnostic information
        code:
          type: string
          description: Diagnostic Code
        message:
          type: string
          description: Diagnostic Message
        module:
          type: string
          description: Module reporting diagnostic information
        recordCount:
          type: integer
          description: Record Count for diagnostics
        query:
          type: string
          description: CQL Query associated with results
    ResultInfo:
      type: object
      properties:
        totalRecords:
          type: integer
          description: Total number of records
        responseTime:
          type: number
          description: Response time
        facets:
          type: array
          description: Array of facets
          items:
            $ref: '#/components/schemas/Facet'
        diagnostics:
          type: array
          description: Array of diagnostic information
          items:
            $ref: '#/components/schemas/Diagnostic'
      additionalProperties: false
    ConfigurationCollection:
      type: object
      properties:
        configs:
          description: List of configurations items
          type: array
          items:
            $ref: '#/components/schemas/Configuration'
        totalRecords:
          type: integer
        resultInfo:
          $ref: '#/components/schemas/ResultInfo'
          readonly: true
      additionalProperties: false
      required:
      - configs
      - totalRecords
    ExportType:
      type: string
      enum:
      - CIRCULATION_LOG
      - BURSAR_FEES_FINES
      - BATCH_VOUCHER_EXPORT
      - EDIFACT_ORDERS_EXPORT
      - CLAIMS
      - ORDERS_EXPORT
      - INVOICE_EXPORT
      - E_HOLDINGS
      - AUTH_HEADINGS_UPDATES
      - FAILED_LINKED_BIB_UPDATES
      default: BURSAR_FEES_FINES
    bursarExportFilterAge:
      description: Filter by fees within certain days range
      type: object
      properties:
        type:
          description: Type of filter
          type: string
          default: Age
        numDays:
          description: Number of days
          type: integer
          minimum: 1
        condition:
          description: Condition to get days range
          type: string
          enum:
          - LESS_THAN_EQUAL
          - LESS_THAN
          - GREATER_THAN
          - GREATER_THAN_EQUAL
      additionalProperties: false
      required:
      - type
      - numDays
      - condition
    bursarExportFilterAmount:
      description: Filter by fee amount
      type: object
      properties:
        type:
          description: Type of filter
          type: string
          default: Amount
        amount:
          description: Amount to filter by
          type: integer
        condition:
          description: Condition to filter by
          type: string
          enum:
          - LESS_THAN_EQUAL
          - LESS_THAN
          - GREATER_THAN
          - GREATER_THAN_EQUAL
      additionalProperties: false
      required:
      - type
      - amount
      - condition
    bursarExportFilterFeeType:
      description: Filter by fee type
      type: object
      properties:
        type:
          description: Type of filter
          type: string
          default: FeeType
        feeFineTypeId:
          description: Id of fee/fine type to filter by
          type: string
          format: uuid
      additionalProperties: false
      required:
      - type
      - feeFineTypeId
    bursarExportFilterFeeFineOwner:
      description: Filter by fee fine owner
      type: object
      properties:
        type:
          description: Type of filter
          type: string
          default: FeeFineOwner
        feeFineOwner:
          description: Id of fee/fine owner to filter by
          type: string
          format: uuid
      additionalProperties: false
      required:
      - type
      - feeFineOwner
    bursarExportFilterLocation:
      description: Filter by location
      type: object
      properties:
        type:
          description: Type of filter
          type: string
          default: Location
        locationId:
          description: Id of location to filter by
          type: string
          format: uuid
      additionalProperties: false
      required:
      - type
      - locationId
    bursarExportFilterPatronGroup:
      description: Filter by patron group
      type: object
      properties:
        type:
          description: Type of filter
          type: string
          default: PatronGroup
        patronGroupId:
          description: Id of patron group to filter by
          type: string
          format: uuid
      additionalProperties: false
      required:
      - type
      - patronGroupId
    bursarExportFilterServicePoint:
      description: Filter by service point
      type: object
      properties:
        type:
          description: Type of filter
          type: string
          default: ServicePoint
        servicePointId:
          description: Id of service point to filter by
          type: string
          format: uuid
      additionalProperties: false
      required:
      - type
      - servicePointId
    bursarExportFilterCondition:
      description: Filter conditional operations
      type: object
      properties:
        type:
          description: Type of filter
          type: string
          default: Condition
        operation:
          description: Conditional operation of the filter
          type: string
          enum:
          - AND
          - OR
        criteria:
          description: Criteria to apply of the filter
          type: array
          items:
            $ref: '#/components/schemas/bursarExportFilter'
      additionalProperties: false
      required:
      - type
      - operation
      - criteria
    bursarExportFilterNegation:
      description: Negation of filter for bursar export
      type: object
      properties:
        type:
          description: Type of filter
          type: string
          default: Negation
        criteria:
          description: Filter to negate
          $ref: '#/components/schemas/bursarExportFilter'
      additionalProperties: false
      required:
      - type
      - criteria
    bursarExportFilterPass:
      description: Filter that is always true
      type: object
      properties:
        type:
          description: Type of filter
          type: string
          default: Pass
      additionalProperties: false
      required:
      - type
    bursarExportFilter:
      description: Filter for bursar export job
      oneOf:
      - $ref: '#/components/schemas/bursarExportFilterAge'
      - $ref: '#/components/schemas/bursarExportFilterAmount'
      - $ref: '#/components/schemas/bursarExportFilterFeeType'
      - $ref: '#/components/schemas/bursarExportFilterLocation'
      - $ref: '#/components/schemas/bursarExportFilterPatronGroup'
      - $ref: '#/components/schemas/bursarExportFilterServicePoint'
      - $ref: '#/components/schemas/bursarExportFilterCondition'
      - $ref: '#/components/schemas/bursarExportFilterNegation'
      - $ref: '#/components/schemas/bursarExportFilterPass'
      - $ref: '#/components/schemas/bursarExportFilterFeeFineOwner'
      discriminator:
        propertyName: type
        mapping:
          Age: '#/components/schemas/bursarExportFilterAge'
          Amount: '#/components/schemas/bursarExportFilterAmount'
          FeeType: '#/components/schemas/bursarExportFilterFeeType'
          FeeFineOwner: '#/components/schemas/bursarExportFilterFeeFineOwner'
          Location: '#/components/schemas/bursarExportFilterLocation'
          PatronGroup: '#/components/schemas/bursarExportFilterPatronGroup'
          ServicePoint: '#/components/schemas/bursarExportFilterServicePoint'
          Condition: '#/components/schemas/bursarExportFilterCondition'
          Negation: '#/components/schemas/bursarExportFilterNegation'
          Pass: '#/components/schemas/bursarExportFilterPass'
    bursarExportFilterAggregate:
      description: Filter by aggregate data
      type: object
      properties:
        type:
          description: Type of filter
          type: string
          default: Aggregate
        property:
          description: Property to filter on
          type: string
          enum:
          - NUM_ROWS
          - TOTAL_AMOUNT
        amount:
          description: Amount to filter on
          type: integer
        condition:
          description: Condition to filter on
          type: string
          enum:
          - LESS_THAN_EQUAL
          - LESS_THAN
          - GREATER_THAN
          - GREATER_THAN_EQUAL
      additionalProperties: false
      required:
      - type
      - property
      - amount
      - condition
    bursarExportTokenAggregate:
      description: Token to represent aggregated result of multiple fees
      type: object
      properties:
        type:
          description: Type of data token
          type: string
          default: Aggregate
        value:
          description: Data to represent
          type: string
          enum:
          - NUM_ROWS
          - TOTAL_AMOUNT
        decimal:
          type: boolean
          description: Whether to return value with decimal. Only applicable for total amount
        lengthControl:
          description: Control length of the token
          $ref: '#/components/schemas/bursarExportTokenLengthControl'
      additionalProperties: false
      required:
      - type
      - value
      - decimal
    bursarExportTokenConstant:
      description: Token to represent a constant used as an arbitrary string
      type: object
      properties:
        type:
          description: Type of data token
          type: string
          default: Constant
        value:
          description: Value of the constant
          type: string
      additionalProperties: false
      required:
      - type
      - value
    bursarExportTokenCurrentDate:
      description: Token to represent part of date
      type: object
      properties:
        type:
          description: Type of data token
          type: string
          default: Date
        value:
          description: Type of date value to represent
          $ref: '#/components/schemas/bursarExportTokenDateType'
        timezone:
          description: Timezone to use for date
          type: string
        lengthControl:
          description: Control length of the token
          $ref: '#/components/schemas/bursarExportTokenLengthControl'
      additionalProperties: false
      required:
      - type
      - value
      - timezone
    bursarExportTokenLengthControl:
      description: Token to fill in or truncate the length of another token
      type: object
      properties:
        character:
          description: Character to fill in with
          type: string
          maxLength: 1
        length:
          description: Desired length for the token
          type: integer
        direction:
          description: Direction to fill in or truncate from
          type: string
          enum:
          - FRONT
          - BACK
        truncate:
          description: Whether to truncate the token if it is longer than the desired length
          type: boolean
      additionalProperties: false
      required:
      - character
      - length
      - direction
      - truncate
    bursarExportTokenDateType:
      description: Schema to represent the type of date information
      type: string
      enum:
      - YEAR_LONG
      - YEAR_SHORT
      - MONTH
      - DATE
      - HOUR
      - MINUTE
      - SECOND
      - QUARTER
      - WEEK_OF_YEAR_ISO
      - WEEK_YEAR_ISO
      - DAY_OF_YEAR
      - YYYYMMDD
      - YYYY-MM-DD
      - MMDDYYYY
      - DDMMYYYY
    bursarExportHeaderFooterToken:
      description: Token permitted in header/footer
      oneOf:
      - $ref: '#/components/schemas/bursarExportTokenAggregate'
      - $ref: '#/components/schemas/bursarExportTokenConstant'
      - $ref: '#/components/schemas/bursarExportTokenCurrentDate'
      discriminator:
        propertyName: type
        mapping:
          Aggregate: '#/components/schemas/bursarExportTokenAggregate'
          Constant: '#/components/schemas/bursarExportTokenConstant'
          CurrentDate: '#/components/schemas/bursarExportTokenCurrentDate'
    bursarExportTokenFeeDate:
      description: Token to represent part of date about a fee
      type: object
      properties:
        type:
          description: Type of data token
          type: string
          default: FeeDate
        property:
          description: Property of fee to be represented by token
          type: string
          enum:
          - CREATED
          - UPDATED
          - DUE
          - RETURNED
        value:
          description: Type of date value to represent
          $ref: '#/components/schemas/bursarExportTokenDateType'
        placeholder:
          description: Placeholder value to use if date is not available
          type: string
        timezone:
          description: Timezone to use for date
          type: string
        lengthControl:
          description: Control length of token
          $ref: '#/components/schemas/bursarExportTokenLengthControl'
      additionalProperties: false
      required:
      - type
      - property
      - value
      - placeholder
      - timezone
    bursarExportTokenFeeAmount:
      description: Token to represent fee amount
      type: object
      properties:
        type:
          description: Type of data token
          type: string
          default: FeeAmount
        decimal:
          description: Whether to return value with decimal
          type: boolean
        lengthControl:
          description: Control length of the token
          $ref: '#/components/schemas/bursarExportTokenLengthControl'
      additionalProperties: false
      required:
      - type
      - decimal
    bursarExportTokenFeeMetadata:
      description: Token to represent fee metadata
      type: object
      properties:
        type:
          description: Type of data token
          type: string
          default: FeeMetadata
        value:
          description: Metadata to represent
          type: string
          enum:
          - FEE_FINE_TYPE_ID
          - FEE_FINE_TYPE_NAME
        lengthControl:
          description: Control length of token
          $ref: '#/components/schemas/bursarExportTokenLengthControl'
      additionalProperties: false
      required:
      - type
      - value
    bursarExportTokenItemData:
      description: Token to represent item data
      type: object
      properties:
        type:
          description: Type of token
          type: string
          default: ItemData
        value:
          description: Item data to represent
          type: string
          enum:
          - BARCODE
          - NAME
          - MATERIAL_TYPE
          - INSTITUTION_ID
          - CAMPUS_ID
          - LIBRARY_ID
          - LOCATION_ID
        placeholder:
          description: Placeholder text to display when no value is available
          type: string
        lengthControl:
          description: Control length of token
          $ref: '#/components/schemas/bursarExportTokenLengthControl'
      additionalProperties: false
      required:
      - type
      - value
      - placeholder
    bursarExportTokenUserData:
      description: Token to represent user data
      type: object
      properties:
        type:
          description: Type of data token
          type: string
          default: UserData
        value:
          description: User data to represent
          type: string
          enum:
          - FOLIO_ID
        lengthControl:
          description: Control length of token
          $ref: '#/components/schemas/bursarExportTokenLengthControl'
      additionalProperties: false
      required:
      - type
      - value
    bursarExportTokenUserDataOptional:
      description: Token to represent optional user data
      type: object
      properties:
        type:
          description: Type of data token
          type: string
          default: UserDataOptional
        value:
          description: Optional user data to represent
          type: string
          enum:
          - BARCODE
          - USERNAME
          - FIRST_NAME
          - MIDDLE_NAME
          - LAST_NAME
          - PATRON_GROUP_ID
          - EXTERNAL_SYSTEM_ID
        placeholder:
          description: Placeholder text to display when no value is present
          type: string
        lengthControl:
          description: Control length of token
          $ref: '#/components/schemas/bursarExportTokenLengthControl'
      additionalProperties: false
      required:
      - type
      - value
      - placeholder
    bursarExportTokenConditional:
      description: Token to represent other data tokens depending on certain conditions
      type: object
      properties:
        type:
          description: Type of the data token
          type: string
          default: Conditional
        conditions:
          description: Conditions to apply to the token
          type: array
          items:
            type: object
            properties:
              condition:
                description: Condition to apply to the item
                $ref: '#/components/schemas/bursarExportFilter'
              value:
                description: Data to represent if the condition is true
                $ref: '#/components/schemas/bursarExportDataToken'
            additionalProperties: false
            required:
            - condition
            - value
        else:
          description: Data to represent if no condition is true
          $ref: '#/components/schemas/bursarExportDataToken'
      additionalProperties: false
      required:
      - type
      - conditions
      - else
    bursarExportDataToken:
      description: Usable token for bursar export
      oneOf:
      - $ref: '#/components/schemas/bursarExportTokenAggregate'
      - $ref: '#/components/schemas/bursarExportTokenConstant'
      - $ref: '#/components/schemas/bursarExportTokenCurrentDate'
      - $ref: '#/components/schemas/bursarExportTokenFeeDate'
      - $ref: '#/components/schemas/bursarExportTokenFeeAmount'
      - $ref: '#/components/schemas/bursarExportTokenFeeMetadata'
      - $ref: '#/components/schemas/bursarExportTokenItemData'
      - $ref: '#/components/schemas/bursarExportTokenUserData'
      - $ref: '#/components/schemas/bursarExportTokenUserDataOptional'
      - $ref: '#/components/schemas/bursarExportTokenConditional'
      discriminator:
        propertyName: type
        mapping:
          Aggregate: '#/components/schemas/bursarExportTokenAggregate'
          Constant: '#/components/schemas/bursarExportTokenConstant'
          CurrentDate: '#/components/schemas/bursarExportTokenCurrentDate'
          FeeDate: '#/components/schemas/bursarExportTokenFeeDate'
          FeeAmount: '#/components/schemas/bursarExportTokenFeeAmount'
          FeeMetadata: '#/components/schemas/bursarExportTokenFeeMetadata'
          ItemData: '#/components/schemas/bursarExportTokenItemData'
          UserData: '#/components/schemas/bursarExportTokenUserData'
          UserDataOptional: '#/components/schemas/bursarExportTokenUserDataOptional'
          Conditional: '#/components/schemas/bursarExportTokenConditional'
    bursarExportTransferCriteria:
      description: Transfer criteria
      type: object
      properties:
        conditions:
          description: Conditions to apply to the transfer of fees/fines
          type: array
          items:
            type: object
            properties:
              condition:
                description: Condition to apply tp this item
                $ref: '#/components/schemas/bursarExportFilter'
              account:
                description: Account to transfer fees/fines that meet this condition to
                type: string
                format: uuid
            additionalProperties: false
            required:
            - condition
            - account
        else:
          type: object
          description: If none of the specified conditions is met
          properties:
            account:
              description: Account to transfer fees/fines that do not meet any specified conditions to
              type: string
              format: uuid
          additionalProperties: false
          required: []
      additionalProperties: false
      required:
      - conditions
      - else
    bursarExportJob:
      description: Bursar export job schema
      type: object
      properties:
        filter:
          description: Filter to use for the regular export
          $ref: '#/components/schemas/bursarExportFilter'
        groupByPatron:
          description: Choose whether to group fee/fines by patron
          type: boolean
        groupByPatronFilter:
          description: Filter to use for the export when grouping by patron
          $ref: '#/components/schemas/bursarExportFilterAggregate'
        header:
          description: Header format for the export file
          type: array
          items:
            $ref: '#/components/schemas/bursarExportHeaderFooterToken'
        data:
          description: Data format for the export file
          type: array
          items:
            $ref: '#/components/schemas/bursarExportDataToken'
        footer:
          description: Footer format for the export file
          type: array
          items:
            $ref: '#/components/schemas/bursarExportHeaderFooterToken'
        transferInfo:
          description: Transfer information for the export
          $ref: '#/components/schemas/bursarExportTransferCriteria'
        dryRun:
          description: Whether this export is a dry run (i.e. no actual transfer will be performed)
          type: boolean
      additionalProperties: false
      required:
      - filter
      - groupByPatron
      - header
      - data
      - footer
      - transferInfo
    EdiConfig:
      type: object
      properties:
        accountNoList:
          description: The list of account numbers of the vendor
          type: array
          items:
            type: string
