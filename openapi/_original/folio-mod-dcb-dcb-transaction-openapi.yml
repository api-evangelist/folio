        numberAllowed:
          description: numberAllowed
          type: integer
    LoanPolicy:
      type: object
      title: LoanPolicy
      properties:
        id:
          description: A globally unique (UUID) identifier for the LoanPolicy
          type: string
        name:
          description: Policy Name
          type: string
        renewable:
          description: renewable
          type: boolean
        renewalsPolicy:
          $ref: '#/components/schemas/renewalsPolicy'
    item:
      type: object
      properties:
        barcode:
          description: barcode of the item
          type: string
    requester:
      type: object
      properties:
        barcode:
          description: barcode of the item
          type: string
        personal:
          $ref: '#/components/schemas/Personal'
    IntervalIdEnum:
      type: string
      enum:
      - Minutes
      - Hours
      - Days
      - Weeks
      - Months
    HoldShelfExpiryPeriod:
      description: Hold Shelf Expiry Period
      type: object
      properties:
        duration:
          description: Duration Hold Shelf Expiry Period
          type: integer
        intervalId:
          description: Interval Hold Shelf Expiry Period
          $ref: '#/components/schemas/IntervalIdEnum'
    CirculationItem:
      type: object
      description: CirculationItem
      properties:
        id:
          description: the system assigned unique ID of the circulation item record
          $ref: '#/components/schemas/uuid'
        holdingsRecordId:
          description: the system assigned unique ID of the holdings record
          $ref: '#/components/schemas/uuid'
        status:
          $ref: '#/components/schemas/ItemStatus'
        materialTypeId:
          type: string
        permanentLoanTypeId:
          type: string
        instanceTitle:
          type: string
        barcode:
          type: string
        pickupLocation:
          type: string
        lendingLibraryCode:
          description: 5 digit agency code which identifies the lending library
          type: string
        effectiveLocationId:
          description: the effective location of the item
          type: string
      additionalProperties: false
    MaterialType:
      type: object
      properties:
        id:
          description: Item id
          $ref: '#/components/schemas/uuid'
        name:
          description: label for the material type
          type: string
        source:
          description: origin of the material type record
          type: string
    Weekday:
      description: A day of the week.  Either SUNDAY, MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, or SATURDAY
      type: string
      format: Weekday
    NormalHours:
      description: A range of hours when a calendar is open
      type: object
      properties:
        calendarId:
          description: The UUID of the calendar which these hours are for
          type: string
          format: uuid
        startDay:
          description: The first weekday (inclusive) of this range
          $ref: '#/components/schemas/Weekday'
        startTime:
          description: The time when this opening starts, inclusive
          type: string
          format: time
        endDay:
          description: The last weekday (inclusive) of this range
          $ref: '#/components/schemas/Weekday'
        endTime:
          description: The last minute of this opening, inclusive (11:59 if it should be open at 11:59 and closed at 12:00)
          type: string
          format: time
    ExceptionalOpening:
      description: An opening as part of an exception
      type: object
      properties:
        exceptionId:
          description: The UUID of the exception which this opening is for
          type: string
          format: uuid
        startDate:
          description: The first effective date (inclusive, YYYY-MM-DD) of this opening
          type: string
          format: date
        startTime:
          description: The first opening time (inclusive) of this opening
          type: string
          format: time
        endDate:
          description: The first effective date (inclusive, YYYY-MM-DD) of this opening
          type: string
          format: date
        endTime:
          description: The last open time (inclusive) of this opening
          type: string
          format: time
    ExceptionRange:
      description: An exception to a calendar, consisting of a set of openings (or none if a closure)
      type: object
      properties:
        calendarId:
          description: The UUID of the calendar which this exception is for
          type: string
          format: uuid
        name:
          description: A user-provided label for this exception
          type: string
        startDate:
          description: The first effective date (inclusive, YYYY-MM-DD) of this exception range
          type: string
          format: date
        endDate:
          description: The first effective date (inclusive, YYYY-MM-DD) of this exception range
          type: string
          format: date
        openings:
          description: The openings during this exception
          type: array
          items:
            $ref: '#/components/schemas/ExceptionalOpening'
    Calendar:
      description: A single calendar
      type: object
      properties:
        id:
          description: A unique UUID identifying this calendar
          type: string
          format: uuid
        name:
          description: A user-provided name used to label this calendar
          type: string
        startDate:
          type: string
          description: The first effective date (inclusive, YYYY-MM-DD) of this calendar
        endDate:
          type: string
          description: The first effective date (inclusive, YYYY-MM-DD) of this calendar
        assignments:
          description: A list of all service points that this calendar is assigned to
          type: array
          items:
            type: string
            format: uuid
            description: A UUID uniquely identifying a service point
        normalHours:
          description: A list of objects describing when the calendar is normally open
          type: array
          items:
            $ref: '#/components/schemas/NormalHours'
        exceptions:
          description: A list of objects describing exceptions to the normal hours
          type: array
          items:
            $ref: '#/components/schemas/ExceptionRange'
