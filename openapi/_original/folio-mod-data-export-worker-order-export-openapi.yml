        type: object
        properties:
          productId:
            description: The actual product identifier
            type: string
          productIdType:
            description: The type of product identifier
            type: string
            pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$
          qualifier:
