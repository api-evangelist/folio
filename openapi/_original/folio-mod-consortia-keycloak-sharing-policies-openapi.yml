          type: string
        payload:
          description: Http request body
          type: object
      additionalProperties: false
      required:
      - policyId
      - url
    SharingPolicyResponse:
      description: A JSON schema for the Sharing policies object response for post request
      type: object
      properties:
        createPCId:
          type: string
          format: uuid
        updatePCId:
          type: string
          format: uuid
      additionalProperties: false
      required:
