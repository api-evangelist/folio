openapi: 3.0.0
info:
  title: Sharing policy integration API
  description: Sharing policy integration API
  version: 0.0.1
servers:
- url: /consortia/{consortiumId}/sharing
paths:
  /policies:
    post:
      summary: start sharing policy
      operationId: startSharingPolicy
      parameters:
      - $ref: '#/components/parameters/consortiumId'
      requestBody:
        $ref: '#/components/requestBodies/SharingPolicyBody'
      responses:
        '201':
          $ref: '#/components/responses/SharingPolicyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /policies/{policyId}:
    delete:
      summary: delete sharing policy
      operationId: deleteSharingPolicy
      parameters:
      - $ref: '#/components/parameters/consortiumId'
      - $ref: '#/components/parameters/policyId'
      requestBody:
        $ref: '#/components/requestBodies/SharingPolicyBody'
      responses:
        '200':
          $ref: '#/components/responses/SharingPolicyDeleteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  requestBodies:
    SharingPolicyBody:
      description: Sharing policies object
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharingPolicyRequest'
          example:
            policyId: 2844767a-8367-4926-9999-514c35840399
            url: /policy
            payload:
              id: 2844767a-8367-4926-9999-514c35840399
              name: 'Policy for role: 004d7a66-c51d-402a-9c9f-3bdcdbbcdbe7'
              source: local
  responses:
    SharingPolicyResponse:
      description: Returns a sharing policy object response for post operation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SharingPolicyResponse'
          example:
            createPCId: c734a41e-16ba-4a02-beb0-2d45081e39b1
            updatePCId: 53e0f091-ffee-448c-a0f8-562d9ad6bf3f
    SharingPolicyDeleteResponse:
      description: Returns a sharing policy response for delete operation
      content:
