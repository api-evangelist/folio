      $schema: http://json-schema.org/draft-04/schema#
      type: object
      description: Object containing the details of the time-based policy.
      required: []
      properties:
        repeat:
          description: Whether or not to repeat the policy.
          type: boolean
          default: false
        start:
          description: Defines the time before which access must not be granted. Permission is granted only if the current date/time is later
            than or equal to this value. Ignored if repeat is true.
          type: string
          format: date-time
        expires:
          description: Defines the time after which access must not be granted. Permission is granted only if the current date/time is earlier
            than or equal to this value. Must be greater than the start time. Ignored if repeat is true.
          type: string
          format: date-time
        dayOfMonthStart:
          description: Defines the day of the month that access must be granted. You can also specify a range of dates. In this case, permission
            is granted only if the current day of the month is between or equal to the two values specified. Ignored if repeat is false.
          type: integer
          minimum: 1
          maximum: 31
        dayOfMonthEnd:
          description: Defines the end of the day of the month range. Must be greater than dayOfMonthStart. Ignored if repeat is false.
          type: integer
          minimum: 1
          maximum: 31
        monthStart:
          description: Defines the month that access must be granted. You can also specify a range of months. In this case, permission is granted
            only if the current month is between or equal to the two values specified. Ignored if repeat is false.
          type: integer
          minimum: 1
          maximum: 12
        monthEnd:
          description: Defines the end of the month range. Must be greater than monthStart. Ignored if repeat is false.
          type: integer
          minimum: 1
          maximum: 12
        hourStart:
          description: Defines the hour that access must be granted. You can also specify a range of hours. In this case, permission is granted
            only if the current hour is between or equal to the two values specified. Ignored if repeat is false.
          type: integer
          minimum: 0
          maximum: 23
        hourEnd:
          description: Defines the end of the hour range. Must be greater than hourStart. Ignored if repeat is false.
          type: integer
          minimum: 0
          maximum: 23
        minuteStart:
          description: Defines the minute that access must be granted. You can also specify a range of minutes. In this case, permission is granted
            only if the current minute is between or equal to the two values specified. Ignored if repeat is false.
          type: integer
          minimum: 0
          maximum: 59
        minuteEnd:
          description: Defines the end of the minutes range. Must be greater than minuteStart. Ignored if repeat is false.
          type: integer
          minimum: 0
          maximum: 59
          min: ${minuteStart}
        logic:
          description: Time policy logic
          $ref: '#/components/schemas/policyLogicType'
