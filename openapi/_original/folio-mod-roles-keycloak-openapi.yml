              $ref: '#/components/examples/capabilitiesUpdateRequest'
      responses:
        '204':
          description: No content
        '404':
          $ref: '#/components/responses/notFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    delete:
      description: Removes all capability assignments for the specified user identifier
      operationId: deleteUserCapabilities
      tags:
      - user-capability
      parameters:
      - $ref: '#/components/parameters/pathUserId'
      responses:
        '204':
          description: No content
        '404':
          $ref: '#/components/responses/notFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /users/capability-sets:
    post:
      description: Create a record associating one or more capabilities with a user.
      operationId: createUserCapabilitySets
      tags:
      - user-capability-set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userCapabilitySetsRequest'
            example:
              $ref: '#/components/examples/userCapabilitySetsRequest'
      responses:
        '201':
          description: Capabilities user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userCapabilitySets'
              example:
                $ref: '#/components/examples/userCapabilitySetsResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    get:
      description: Get user capabilities by CQL query and pagination parameters
      operationId: getUserCapabilitySets
      tags:
      - user-capability-set
      parameters:
      - $ref: '#/components/parameters/query'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: A collection of capabilities users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userCapabilitySets'
              example:
                $ref: '#/components/examples/userCapabilitySetsResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /users/capability-sets/query:
    post:
      description: Query effective capability-set names for up to 500 users. Effective capability sets include sets assigned directly to a user
        and sets inherited through the user's assigned roles. More than 500 user IDs is a schema violation and returns 400 Bad Request with a
        validation_error on 'userIds'; split larger user lists across several requests.
      operationId: queryUserCapabilitySets
      tags:
      - user-capability-set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userCapabilitySetsQueryRequest'
      responses:
        '200':
          description: Effective capability-set names for requested users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userCapabilitySetsQueryResult'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /users/{id}/capability-sets:
    get:
      description: Retrieve capability sets assigned to role by role identifier
      operationId: getCapabilitySetsByUserId
      tags:
      - user-capability-set
      parameters:
      - $ref: '#/components/parameters/pathUserId'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '200':
          description: Assigned to a role capabilities in a paginated view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/capabilitySets'
              example:
                $ref: '#/components/examples/capabilitySetsResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    put:
      description: Modifies the set of capability sets assigned to the specified user.
      operationId: updateUserCapabilitySets
      tags:
      - user-capability-set
      parameters:
      - $ref: '#/components/parameters/pathUserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/capabilitySetsUpdateRequest'
            example:
              $ref: '#/components/examples/capabilitySetsUpdateRequest'
      responses:
        '204':
          description: No content
        '404':
          $ref: '#/components/responses/notFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    delete:
      description: Removes all capability set assignments for the specified user identifier
      operationId: deleteUserCapabilitySets
      tags:
      - user-capability-set
      parameters:
      - $ref: '#/components/parameters/pathUserId'
      responses:
        '204':
          description: No content
        '404':
          $ref: '#/components/responses/notFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /permissions/users/{id}:
    get:
      description: Get permissions by user ID. If onlyVisible=true, then desiredPermissions are ignored. entitledOnly=true applies after onlyVisible
        and desiredPermissions filtering and may be combined with either.
      operationId: getPermissionsUser
      tags:
      - permissions-users
      parameters:
      - $ref: '#/components/parameters/pathEntityId'
      - $ref: '#/components/parameters/onlyVisible'
      - $ref: '#/components/parameters/desiredPermissions'
      - $ref: '#/components/parameters/entitledOnly'
      responses:
        '200':
          description: Retrieve permissions by user id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/permissions_user'
              example:
                $ref: '#/components/examples/permissionsUserResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
        '501':
          $ref: '#/components/responses/notImplementedResponse'
  /loadable-roles:
    get:
      description: Get loadable roles by query
      operationId: findLoadableRoles
      tags:
      - loadable-roles
      parameters:
      - $ref: '#/components/parameters/query'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      responses:
        '201':
          description: Array of roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loadableRoles'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    put:
      description: A default role is created or updated, role is populated with the specified permissions (capabilities and capability sets) as
        they become available in the system. Default role cannot be changed via Roles API.
      operationId: upsertLoadableRole
      tags:
      - loadable-roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/loadableRole'
      responses:
        '200':
          description: Default loadable role was created or updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loadableRole'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
components:
  schemas:
    role:
      $schema: http://json-schema.org/draft-04/schema#
      title: Role schema
      description: Role
      type: object
      properties:
        id:
          description: Role identifier
          type: string
          format: uuid
        name:
          description: A human-readable name/label for this role. Must not contain a '/' character
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[^/]+$
        description:
          description: Free form description of the role
          type: string
        type:
          description: Role type
          $ref: '#/components/schemas/roleType'
        metadata:
          readOnly: true
          $ref: '#/components/schemas/metadata'
      required:
      - name
    roles:
      $schema: http://json-schema.org/draft-04/schema#
      id: roles.json
      title: Roles schema
      description: Roles
      type: object
      properties:
        roles:
          description: Role identifier
          type: array
          items:
            $ref: '#/components/schemas/role'
          nullable: false
        totalRecords:
          description: The total number of roles matching the provided criteria
          type: integer
          format: int64
      required:
      - roles
    rolesRequest:
      $schema: http://json-schema.org/draft-04/schema#
      id: roles.json
      title: Roles schema
      description: Roles
      type: object
      properties:
        roles:
          description: Collection of roles
          type: array
          items:
            $ref: '#/components/schemas/role'
          minItems: 1
          maxItems: 255
      required:
      - roles
    userRolesRequest:
      $schema: http://json-schema.org/draft-04/schema#
      id: userRolesRequest.json
      title: User-roles relation Batch Request Schema
      description: User-roles request body
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: User identifier (UUID)
        roleIds:
          type: array
          description: Role identifiers
          items:
            type: string
            format: uuid
            description: Role identifier (UUID)
    userRole:
      $schema: http://json-schema.org/draft-04/schema#
      id: userRole.json
      title: User-Role Relation Model Schema
      description: User-role relation model
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: ID of the user
        roleId:
          type: string
          format: uuid
          description: Role identifier
        metadata:
          $ref: '#/components/schemas/metadata'
      required:
      - userId
      - roleId
    userRoles:
      $schema: http://json-schema.org/draft-04/schema#
      id: userRoles.json
      title: List of User-Role Relation Items Schema
      description: List of user-role relation items
      type: object
      properties:
        userRoles:
          description: List of user-role relation items
          type: array
          items:
            $ref: '#/components/schemas/userRole'
          nullable: false
        totalRecords:
          description: The total number of user-role relation items matching the provided criteria
          type: integer
    loadableRole:
      $schema: http://json-schema.org/draft-04/schema#
      title: Loadable Role schema
      description: Loadable Role
      type: object
      allOf:
      - $ref: '#/components/schemas/role'
      properties:
        permissions:
          description: List of permissions associated with role
          type: array
          items:
            $ref: '#/components/schemas/loadablePermission'
    loadableRoles:
      $schema: http://json-schema.org/draft-04/schema#
      id: loadableRoles.json
      title: List of Loadable Roles Schema
      description: List of loadable roles
      type: object
      properties:
        loadableRoles:
          description: List of loadable roles
          type: array
          items:
            $ref: '#/components/schemas/loadableRole'
          minItems: 1
        totalRecords:
          readOnly: true
          description: The total number of records matching the provided criteria
          type: integer
          format: int64
      required:
      - loadableRoles
    policy:
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      description: Object containing the details of the policy.
      properties:
        id:
          description: A unique identifier for this policy. System-generated if not provided.
          type: string
          format: uuid
        name:
          description: A human-readable name/label for this policy. Required.
          type: string
        description:
          description: Free form description of the policy. Optional.
          type: string
        type:
          description: The type of policy. Required.
          $ref: '#/components/schemas/policyType'
        source:
          description: The source for the policy.
          $ref: '#/components/schemas/sourceType'
        userPolicy:
          description: Object containing the details of the user-based policy
          $ref: '#/components/schemas/userPolicy'
        timePolicy:
          description: Object containing the details of the time-based policy.
          $ref: '#/components/schemas/timePolicy'
        rolePolicy:
          description: Object containing the details of the aggregated policy.
          $ref: '#/components/schemas/rolePolicy'
        metadata:
          $ref: '#/components/schemas/metadata'
      required:
      - name
      - type
    policies:
      type: object
      description: A list of policies with additional meta information.
      properties:
        policies:
          description: A list of policies.
          type: array
          items:
            $ref: '#/components/schemas/policy'
        totalRecords:
          description: The total number of roles matching the provided criteria
          type: integer
    policiesRequest:
      type: object
      description: A list of policies with additional meta information.
      properties:
        policies:
          description: A list of policies.
          type: array
          items:
            $ref: '#/components/schemas/policy'
          minItems: 1
          maxItems: 255
      required:
      - policies
    capability:
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      title: Capability Set Object Schema
      description: Object containing details of a capability
      properties:
        id:
          description: A unique identifier for this capability
          type: string
          format: uuid
        name:
          description: a human-readable name/label for this capability.  Takes the form of {resourceName}.{scope}, e.g. item.create
          type: string
          readOnly: true
        description:
          description: Free form description of the capability
          type: string
        resource:
          description: The resource this capability is associated with, e.g. item
          type: string
          pattern: ^[A-Za-z\s]+$
        action:
          description: The action this capability is associated with, e.g. create
          $ref: '#/components/schemas/capabilityAction'
        applicationId:
          description: The id of the application which defines the capability
          type: string
        moduleId:
          description: The id of the module which defines the capability
          type: string
        permission:
          description: Folio permission name
          type: string
        endpoints:
          type: array
          description: List of assigned endpoints
          items:
            $ref: '#/components/schemas/endpoint'
        dummyCapability:
          description: Is capability dummy
          type: boolean
        type:
          description: The type of capability
          $ref: '#/components/schemas/capabilityType'
        metadata:
          $ref: '#/components/schemas/metadata'
          readOnly: true
        visible:
          description: Is visible in UI
          type: boolean
        direct:
          description: Indicates whether the capability was directly assigned to the role (true) or inherited via a capability set (false). Populated
            only by GET /roles/{id}/capabilities.
          type: boolean
          readOnly: true
      required:
      - resource
      - action
      - permissions
      - type
      - applicationId
    capabilities:
      $schema: http://json-schema.org/draft-04/schema#
      title: Capabilities Object Schema
      description: Response body containing capability records
      type: object
      properties:
        capabilities:
          description: A collection of capability sets
          type: array
          items:
            $ref: '#/components/schemas/capability'
          minItems: 1
        totalRecords:
          readOnly: true
          description: The total number of records matching the provided criteria
          type: integer
          format: int64
      required:
      - capabilities
    capabilitySet:
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      title: Capability Set Object Schema
      description: Object containing details of a capability set
      properties:
        id:
          description: A unique identifier for this capability
          type: string
          format: uuid
        name:
          description: a human-readable name/label for this capability.  Takes the form of {resourceName}.{scope}, e.g. item.create
          type: string
          readOnly: true
        description:
          description: Free form description of the capability
          type: string
        resource:
          description: The resource this capability is associated with, e.g. item
          type: string
          pattern: ^[A-Za-z\s]+$
        action:
          description: The action this capability is associated with, e.g. create
          $ref: '#/components/schemas/capabilityAction'
        applicationId:
          description: The id of the application which defines the capability
          type: string
        moduleId:
          description: The id of the module which defines the capability
          type: string
        type:
          description: The type of capability
          $ref: '#/components/schemas/capabilityType'
        permission:
          description: Folio permission name
          type: string
        capabilities:
          description: List with assigned capability ids
          type: array
          minItems: 1
          items:
            type: string
            description: Capability identifier
            format: uuid
        metadata:
          $ref: '#/components/schemas/metadata'
          readOnly: true
        visible:
          description: Is visible in UI
          type: boolean
      required:
      - resource
      - action
      - permissions
      - type
      - applicationId
    capabilitySets:
      $schema: http://json-schema.org/draft-04/schema#
      title: Capability Sets Object Schema
      description: Response body containing capability set records
      type: object
      properties:
        capabilitySets:
          description: A collection of capability sets
          type: array
          items:
            $ref: '#/components/schemas/capabilitySet'
          minItems: 1
        totalRecords:
          readOnly: true
          description: The total number of records matching the provided criteria
          type: integer
          format: int64
      required:
      - capabilities
    capabilitiesUpdateRequest:
      $schema: http://json-schema.org/draft-04/schema#
      title: Capability Relation Update Request Schema
      description: Request body to update capabilities assigned to entity (role, user, etc.)
      type: object
      properties:
        capabilityIds:
          description: List of capability identifiers
          type: array
          items:
            type: string
            description: Capability identifier
            format: uuid
        capabilityNames:
          description: List of capability names
          type: array
          items:
            type: string
            description: Capability names
    capabilitySetsUpdateRequest:
      $schema: http://json-schema.org/draft-04/schema#
      title: Capability Set Relation Update Request Schema
      description: Request body to update capability sets assigned to entity (role, user, etc.)
      type: object
      properties:
        capabilitySetIds:
          description: List of capability set identifiers
          type: array
          items:
            type: string
            description: Capability identifier
            format: uuid
        capabilitySetNames:
          description: List of capability names
          type: array
          items:
            type: string
            description: Capability names
    userCapabilities:
      $schema: http://json-schema.org/draft-04/schema#
      title: User Capabilities Schema
      description: User capabilities collection
      type: object
      properties:
        totalRecords:
          description: The total number of records matching the provided criteria
          type: integer
          format: int64
        userCapabilities:
          description: List with found/created user-capability relations
          type: array
          items:
            $ref: '#/components/schemas/userCapability'
    userCapabilitySets:
      $schema: http://json-schema.org/draft-04/schema#
      title: User Capability Set Schema
      description: User capability set collection
      type: object
      properties:
        totalRecords:
          readOnly: true
          description: The total number of records matching the provided criteria
          type: integer
          format: int64
        userCapabilitySets:
          description: List with found/created user-capabilitySet relations
          type: array
          items:
            $ref: '#/components/schemas/userCapabilitySet'
    userCapabilitiesRequest:
      $schema: http://json-schema.org/draft-04/schema#
      title: User-Capability Request Schema
      description: Request body to assign existing capabilities to a user
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: User identifier
        capabilityIds:
          description: List of capability identifiers
          type: array
          items:
            type: string
            description: Capability identifier
            format: uuid
          minItems: 1
      required:
      - userId
      - capabilityIds
    userCapabilitySetsRequest:
      $schema: http://json-schema.org/draft-04/schema#
      title: User-CapabilitySet Request Schema
      description: Request body to assign existing capability sets to a user
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: User identifier
        capabilitySetIds:
          description: List of capability identifiers
          type: array
          items:
            type: string
            description: Capability set identifier
            format: uuid
          minItems: 1
      required:
      - roleId
      - capabilitySetIds
    userCapabilitySetsQueryRequest:
      $schema: http://json-schema.org/draft-04/schema#
      title: User Capability Sets Query Request Schema
      description: Request body to query effective capability-set names for users
      type: object
      properties:
        userIds:
          description: User identifiers
          type: array
          items:
            type: string
            format: uuid
            description: User identifier
          minItems: 1
          maxItems: 500
        capabilitySetNames:
          description: Optional exact-name whitelist for capability sets
          type: array
          items:
            type: string
            description: Capability-set name
      required:
      - userIds
    userCapabilitySetNames:
      $schema: http://json-schema.org/draft-04/schema#
      title: User Capability Set Names Schema
      description: Effective capability-set names for a user
      type: object
      properties:
        userId:
          type: string
          format: uuid
          description: User identifier
        capabilitySetNames:
          type: array
          description: Effective capability-set names
          items:
            type: string
            description: Capability-set name
      required:
      - userId
      - capabilitySetNames
    userCapabilitySetsQueryResult:
      $schema: http://json-schema.org/draft-04/schema#
      title: User Capability Sets Query Result Schema
      description: Effective capability-set names for users
      type: object
      properties:
        userCapabilitySets:
          description: Effective capability-set names grouped by user
          type: array
          items:
            $ref: '#/components/schemas/userCapabilitySetNames'
      required:
      - userCapabilitySets
    roleCapabilities:
      $schema: http://json-schema.org/draft-04/schema#
      title: Role-Capabilities Objects Schema
      description: Response body containing role-capabilities relations for search request
      type: object
      properties:
        totalRecords:
          description: The total number of role-capability objects matching the provided criteria
          type: integer
          format: int64
        roleCapabilities:
          description: List with found/created role-capability relations
          type: array
          items:
            $ref: '#/components/schemas/roleCapability'
    roleCapabilitySets:
      $schema: http://json-schema.org/draft-04/schema#
      title: Role-Capability Set Objects Schema
      description: Response body containing role-capabilitySet relations for search request
      type: object
      properties:
        totalRecords:
          description: The total number of role-capability objects matching the provided criteria
          type: integer
          format: int64
        roleCapabilitySets:
          description: List with found/created role-capabilitySet relations
          type: array
          items:
            $ref: '#/components/schemas/roleCapabilitySet'
    roleCapabilitiesRequest:
      $schema: http://json-schema.org/draft-04/schema#
      title: Role-Capability Request Schema
      description: Request body to assign existing capabilities to a role
      type: object
      properties:
        roleId:
          type: string
          format: uuid
          description: ID of the role
        capabilityIds:
          description: List of capability identifiers
          type: array
          items:
            type: string
            description: Capability identifier
            format: uuid
        capabilityNames:
          description: List of capability names
          type: array
          items:
            type: string
            description: Capability names
      required:
      - roleId
    roleCapabilitySetsRequest:
      $schema: http://json-schema.org/draft-04/schema#
      title: Role-CapabilitySet Request Schema
      description: Request body to assign existing capability sets to a role
      type: object
      properties:
        roleId:
          type: string
          format: uuid
          description: ID of the role
        capabilitySetIds:
          description: List of capability set identifiers
          type: array
          items:
            type: string
            description: Capability set identifier
            format: uuid
        capabilitySetNames:
          description: List of capability set names
          type: array
          items:
            type: string
            description: Capability set names
      required:
      - roleId
    permissionsUser:
      $ref: '#/components/schemas/permissions_user'
    errorResponse:
      $ref: '#/components/schemas/errors'
    permissionMigrationJob:
      $schema: http://json-schema.org/draft-04/schema#
      id: permissionMigrationJob.json
      title: Permission Migration Job Schema
      description: A permission migration job entity for tracking migration's progress
      type: object
      properties:
        id:
          description: An migration job identifier
          type: string
          format: uuid
        totalRecords:
          description: Total number of records to be migrated
          type: integer
        status:
          description: A permission migration job status
          $ref: '#/components/schemas/permissionMigrationJobStatus'
        startedAt:
          description: A permission migration job start timestamp
          type: string
          format: date-time
        finishedAt:
          description: A permission migration job end timestamp
          type: string
          format: date-time
    permissionMigrationJobs:
      $schema: http://json-schema.org/draft-04/schema#
      id: permissionMigrationJobs.json
      title: List of Permission Migration Jobs Schema
      description: A list of permission migration job entities
      type: object
      properties:
        migrations:
          description: List of Migration Jobs
          type: array
          id: migrations
          items:
            $ref: '#/components/schemas/permissionMigrationJob'
        totalRecords:
          type: integer
    permissionMigrationError:
      $schema: http://json-schema.org/draft-04/schema#
      description: Permission migration error details
      type: object
      properties:
        id:
          description: Error log identifier
          type: string
          format: uuid
        migrationJobId:
          description: Migration job identifier
          type: string
          format: uuid
        errorType:
          description: Type of error
          type: string
        errorMessage:
          description: Detailed error message
          type: string
        failedEntityType:
          description: Type of entity that failed (e.g., ROLE, USER_ROLE)
          type: string
        failedEntityId:
          description: Identifier or name of the failed entity
          type: string
        occurredAt:
