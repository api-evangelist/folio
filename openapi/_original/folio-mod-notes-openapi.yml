# x-archived-from: folio-mod-notes-openapi.yml
# x-archived-on: 2026-10-09
openapi: 3.0.0
info:
  title: Notes API
  version: 3.0.0
paths:
  /note-types:
    get:
      description: Return a list of note types
      operationId: getNoteTypeCollection
      tags:
      - note-types
      parameters:
      - $ref: '#/components/parameters/cqlQueryNoteType'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          $ref: '#/components/responses/NoteTypeCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          description: Unexpected error
    post:
      description: Create a new note type.
      operationId: createNoteType
      tags:
      - note-types
      requestBody:
        $ref: '#/components/requestBodies/NoteTypeBody'
      responses:
        '201':
          $ref: '#/components/responses/NoteType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          description: Unexpected error
  /note-types/{id}:
    parameters:
    - $ref: '#/components/parameters/resourceId'
    get:
      description: Retrieve note type with given ID
      operationId: getNoteType
      tags:
      - note-types
      responses:
        '200':
          $ref: '#/components/responses/NoteType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          description: Unexpected error
    put:
      description: Update note type with given ID
      operationId: updateNoteType
      tags:
      - note-types
      requestBody:
        $ref: '#/components/requestBodies/NoteTypeBody'
      responses:
        '204':
          description: Note Type successfully updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Unexpected error
    delete:
      description: Delete note type with given ID
      operationId: deleteNoteType
      tags:
      - note-types
      responses:
        '204':
          description: Note type deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Unexpected error
  /notes:
    get:
      description: Return a list of notes
      operationId: getNoteCollection
      tags:
      - notes
      parameters:
      - $ref: '#/components/parameters/cqlQueryNote'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          $ref: '#/components/responses/NoteCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          description: Unexpected error
    post:
      description: Create a new note.
      operationId: createNote
      tags:
      - notes
      requestBody:
        $ref: '#/components/requestBodies/NoteBody'
      responses:
        '201':
          $ref: '#/components/responses/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          description: Unexpected error
  /notes/{id}:
    parameters:
    - $ref: '#/components/parameters/resourceId'
    get:
      description: Retrieve note with given ID
      operationId: getNote
      tags:
      - notes
      responses:
        '200':
          $ref: '#/components/responses/Note'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          description: Unexpected error
    put:
      description: Update note with given ID
      operationId: updateNote
      tags:
      - notes
      requestBody:
        $ref: '#/components/requestBodies/NoteBody'
      responses:
        '204':
          description: Note successfully updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Unexpected error
    delete:
      description: Delete note with given ID
      operationId: deleteNote
      tags:
      - notes
      responses:
        '204':
          description: Note deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Unexpected error
  /note-links/type/{objectType}/id/{objectId}:
    parameters:
    - $ref: '#/components/parameters/objectType'
    - $ref: '#/components/parameters/objectId'
    put:
      description: Add or delete links to specified list of notes
      operationId: updateLinks
      tags:
      - notes
      requestBody:
        $ref: '#/components/requestBodies/NoteLinksPutBody'
      responses:
        '204':
          description: Links successfully added
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Unexpected error
  /note-links/domain/{domain}/type/{objectType}/id/{objectId}:
    parameters:
    - $ref: '#/components/parameters/domain'
    - $ref: '#/components/parameters/objectType'
    - $ref: '#/components/parameters/objectId'
    get:
      description: Return a list of notes by status. A maximum of 1000 notes can be returned per request.
      operationId: getNoteCollectionByLink
      tags:
      - notes
      parameters:
      - name: search
        in: query
        schema:
          type: string
        required: false
        description: Partial match case-insensitive search term for note title and note content
      - name: noteType
        in: query
        schema:
          type: array
          items:
            type: string
        required: false
        description: Search string for note type. Note(s) is returned only if it equals to specified word or sequence of words in the titleseparated by com type name. Multiple types should be declared with query parameter sequentially as follows "noteType=a&noteType=b".
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/linkStatusFilter'
          default: all
        required: false
        description: Filtering records by status. Possible values are ASSIGNED, UNASSIGNED, ALL.
      - name: orderBy
        in: query
        schema:
          $ref: '#/components/schemas/notesOrderBy'
        required: false
        description: Field by which notes are ordered. Possible values are title, content, noteType, updatedDate. The default ascending sorting is applied for title, content, noteType parameters. For updatedDate is descending.
      - name: order
        in: query
        schema:
          $ref: '#/components/schemas/orderDirection'
        required: false
        description: Indicates order of notes. Possible values asc, desc.
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/limit'
      responses:
        '200':
          $ref: '#/components/responses/NoteCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          description: Unexpected error
components:
  requestBodies:
    NoteTypeBody:
      description: Note type object
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/noteType'
    NoteBody:
      description: Note object
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/note'
    NoteLinksPutBody:
      description: Collection of note links
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/noteLinkUpdateCollection'
  responses:
    NoteType:
      description: Returns a note type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/noteType'
    NoteTypeCollection:
      description: Returns a note types collectiom
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/noteTypeCollection'
    Note:
      description: Returns a note
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/note'
    NoteCollection:
      description: Returns a note collectiom
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/noteCollection'
    Unauthorized:
      description: Not authorized to perform requested action
      content:
        text/plain:
          example: unable to perform action -- unauthorized
    NotFound:
      description: Resource with a given ID not found
      content:
        text/plain:
          example: resource not found
    UnprocessableEntity:
      description: Validation errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errors'
  parameters:
    resourceId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/uuid'
      description: The UUID of a resource
    objectId:
      name: objectId
      in: path
      required: true
      schema:
        type: string
      description: The ID of link's object
    objectType:
      name: objectType
      in: path
      required: true
      schema:
        type: string
      description: The type of link's object
    domain:
      name: domain
      in: path
      required: true
      schema:
        type: string
      description: The domain of note
    cqlQueryNote:
      name: query
      in: query
      schema:
        type: string
        default: cql.allRecords=1
      required: false
      description: A query expressed as a CQL string, for details see [Notes API](https://github.com/folio-org/mod-notes/blob/master/docs/api-guide.md#notes-api)
    cqlQueryNoteType:
      name: query
      in: query
      schema:
        type: string
        default: cql.allRecords=1
      required: false
      description: A query expressed as a CQL string, for details see [Note Types API](https://github.com/folio-org/mod-notes/blob/master/docs/api-guide.md#note-types-api)
    offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
        maximum: 2147483647
      required: false
      description: Skip over a number of elements by specifying an offset value for the query
    limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 1000
        minimum: 1
        maximum: 2147483647
      required: false
      description: Limit the number of elements returned in the response
  schemas:
    uuid:
      type: string
      format: uuid
    userInfo:
      type: object
      description: User Display Information
      properties:
        lastName:
          type: string
          readOnly: true
          description: Last name of the user
        firstName:
          type: string
          readOnly: true
          description: First name of the user
        middleName:
          type: string
          readOnly: true
          description: Middle name or initial of the user
      example:
        lastName: Doe
        firstName: John
        middleName: X.
    metadata:
      type: object
      title: Metadata
      description: Metadata about creation and changes to records
      properties:
        createdDate:
          type: string
          format: date-time
          description: Date and time when the record was created
          x-fqm-value-getter: to_char(${source}.created_date, 'YYYY-MM-DD"T"HH24:MI:SS.MS"Z"')
          x-fqm-visibility: all
          x-fqm-visible-by-default: true
          x-fqm-essential: true
        createdByUserId:
          $ref: '#/components/schemas/uuid'
          description: ID of the user who created the record
          x-fqm-value-getter: ${source}.created_by
          x-fqm-visibility: all
          x-fqm-visible-by-default: false
          x-fqm-essential: true
          x-fqm-joins-to-raw:
          - targetId: bb058933-cd06-4539-bd3a-6f248ff98ee2
            targetField: id
            direction: left
            type: equality-cast-uuid
          - targetId: f2615ea6-450b-425d-804d-6a495afd9308
            targetField: id
            direction: left
            type: equality-cast-uuid
        createdByUsername:
          type: string
          description: Username of the user who created the record (when available)
          x-fqm-ignore: true
        createdBy:
          $ref: '#/components/schemas/userInfo'
          description: Additional information of the user who created the record (when available)
          x-fqm-ignore: true
        updatedDate:
          type: string
          format: date-time
          description: Date and time when the record was last updated
          x-fqm-value-getter: to_char(${source}.updated_date, 'YYYY-MM-DD"T"HH24:MI:SS.MS"Z"')
          x-fqm-visibility: all
          x-fqm-visible-by-default: false
          x-fqm-essential: true
        updatedByUserId:
          $ref: '#/components/schemas/uuid'
          description: ID of the user who last updated the record
          x-fqm-value-getter: ${source}.updated_by
          x-fqm-visibility: all
          x-fqm-visible-by-default: false
          x-fqm-essential: true
          x-fqm-joins-to-raw:
          - targetId: bb058933-cd06-4539-bd3a-6f248ff98ee2
            targetField: id
            direction: left
            type: equality-cast-uuid
          - targetId: f2615ea6-450b-425d-804d-6a495afd9308
            targetField: id
            direction: left
            type: equality-cast-uuid
        updatedByUsername:
          type: string
          description: Username of the user who updated the record (when available)
          x-fqm-ignore: true
        updatedBy:
          $ref: '#/components/schemas/userInfo'
          description: Additional information of the user who updated the record (when available)
          x-fqm-ignore: true
      required:
      - createdDate
    noteType:
      type: object
      title: Note Type
      description: Defines type of note
      properties:
        id:
          $ref: '#/components/schemas/uuid'
          description: A UUID identifying this note type
          x-fqm-value-getter: ${source}.id
          x-fqm-visibility: hidden
          x-fqm-essential: true
        name:
          type: string
          description: The unique name of this type
          maxLength: 255
          x-fqm-value-getter: ${source}.name
          x-fqm-visibility: all
          x-fqm-essential: true
          x-fqm-id-column-name: id
          x-fqm-value-source-api:
            path: note-types
            valueJsonPath: $.noteTypes.*.id
            labelJsonPath: $.noteTypes.*.name
          x-fqm-visible-by-default: true
        usage:
          type: object
          readOnly: true
          description: Type usage statistics
          x-fqm-ignore: true
          properties:
            isAssigned:
              type: boolean
              readOnly: true
              description: Is this note type assigned to any note
          required:
          - noteTotal
        metadata:
          $ref: '#/components/schemas/metadata'
          readOnly: true
          description: The metadata
      required:
      - name
      example:
        id: 118dbd8c-5ba0-47a9-a850-34bbb1dbf3b7
        name: Important Note
    noteTypeCollection:
      type: object
      title: Collection of note types
      description: Collection of note types
      properties:
        noteTypes:
          type: array
          items:
            $ref: '#/components/schemas/noteType'
        totalRecords:
          type: integer
          readOnly: true
          description: Total amount of note types
      required:
      - noteTypes
      example:
        noteTypes:
        - id: 118dbd8c-5ba0-47a9-a850-34bbb1dbf3b7
          name: Important Note
        - id: 46669e09-8b45-4ede-afbd-ca73bb89cdb3
          label: Urgent Note
        totalRecords: 2
    errors:
      type: object
      example:
        Error:
          value:
            errors:
            - message: may not be null
              type: 1
              code: -1
              parameters:
              - key: moduleTo
                value: null
    link:
      type: object
      title: Note link
      description: Link to object associated with a note
      properties:
        id:
          type: string
          description: Id of object linked to note
          x-fqm-value-getter: ${source}.object_id
          x-fqm-is-id-column: false
          x-fqm-visibility: hidden
          x-fqm-essential: true
          x-fqm-joins-to-raw:
          - targetId: bb058933-cd06-4539-bd3a-6f248ff98ee2
            targetField: id
            direction: left
            type: equality-cast-uuid
          - targetId: f2615ea6-450b-425d-804d-6a495afd9308
            targetField: id
            direction: left
            type: equality-cast-uuid
        type:
          type: string
          description: Type of object linked to note
          x-fqm-value-getter: ${source}.object_type
          x-fqm-visibility: hidden
          x-fqm-essential: true
      required:
      - id
      - type
      example:
        id: 1234-5678
        type: package
    note:
      type: object
      description: Notes about all kind of objects
      properties:
        id:
          $ref: '#/components/schemas/uuid'
          description: Unique generated identifier for the note
          x-fqm-value-getter: ${source}.id
          x-fqm-filter-value-getter: ${source}.id
          x-fqm-visibility: all
          x-fqm-visible-by-default: false
          x-fqm-essential: true
        typeId:
          $ref: '#/components/schemas/uuid'
          description: Type id of note
          x-fqm-value-getter: ${source}.type_id
          x-fqm-filter-value-getter: ${source}.type_id
          x-fqm-visibility: hidden
          x-fqm-essential: true
          x-fqm-joins-to:
          - targetModule: mod-notes
            targetEntity: note_type
            targetField: id
            type: equality-cast-uuid
        type:
          type: string
          description: Type of note (configured in settings)
        title:
          type: string
          description: Note title
          x-fqm-value-getter: ${source}.title
          x-fqm-visibility: all
          x-fqm-visible-by-default: true
          x-fqm-essential: true
        domain:
          type: string
          description: Domain associated with this note
          x-fqm-value-getter: ${source}.domain
          x-fqm-visibility: all
          x-fqm-visible-by-default: true
          x-fqm-essential: true
        content:
          type: string
          description: Content of the note
          x-fqm-value-getter: ${source}.content
          x-fqm-visibility: all
          x-fqm-essential: true
        popUpOnCheckOut:
          type: boolean
          description: Flag that specify need of pop-up on check-out app
          x-fqm-value-getter: ${source}.pop_up_on_check_out
          x-fqm-visibility: all
          x-fqm-essential: true
        popUpOnUser:
          type: boolean
          description: Flag that specify need of pop-up on users app
          x-fqm-value-getter: ${source}.pop_up_on_user
          x-fqm-visibility: all
          x-fqm-essential: true
        links:
          type: array
          description: Collection of links to associated objects
          items:
            $ref: '#/components/schemas/link'
        metadata:
          $ref: '#/components/schemas/metadata'
      required:
      - typeId
      - domain
      - title
    noteCollection:
      type: object
      title: Collection of notes
      description: Collection of notes
      properties:
        notes:
          type: array
          items:
            $ref: '#/components/schemas/note'
        totalRecords:
          type: integer
          readOnly: true
          description: Total amount of notes
      required:
      - notes
    linkStatus:
      type: string
      enum:
      - ASSIGNED
      - UNASSIGNED
    noteLinkUpdate:
      type: object
      description: A note link
      properties:
        id:
          description: A UUID identifying a note
          $ref: '#/components/schemas/uuid'
        status:
          description: New status for link to this note
          $ref: '#/components/schemas/linkStatus'
      required:
      - id
      - status
    noteLinkUpdateCollection:
      type: object
      description: Collection of note links
      properties:
        notes:
          type: array
          items:
            $ref: '#/components/schemas/noteLinkUpdate'
      required:
      - notes
    linkStatusFilter:
      type: string
      enum:
      - assigned
      - unassigned
      - all
      default: all
    notesOrderBy:
      type: string
      enum:
      - title
      - content
      - noteType
      - updatedDate
    orderDirection:
      type: string
      enum:
      - asc
      - desc
