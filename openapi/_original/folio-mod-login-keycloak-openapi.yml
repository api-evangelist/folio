# x-archived-from: folio-mod-login-keycloak-openapi.yml
# x-archived-on: 2026-10-09
openapi: 3.0.0
info:
  title: Mod Login Keycloak API
  version: v1
  description: Mod Login Keycloak API
servers:
- url: http://localhost:8081
  description: Locally deployed server
paths:
  /authn/loginAttempts/{userId}:
    get:
      description: Get login attempts for a single user
      operationId: getLoginAttempts
      tags:
      - loginAttempts
      parameters:
      - $ref: '#/components/parameters/pathUserId'
      responses:
        '200':
          description: Number of login attempts for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loginAttempts'
        '404':
          $ref: '#/components/responses/entityNotFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /authn/login:
    post:
      description: Get a new login token
      operationId: login
      tags:
      - login
      parameters:
      - $ref: '#/components/parameters/userAgentHeader'
      - $ref: '#/components/parameters/xForwardedForHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/loginCredentials'
      responses:
        '201':
          description: Login response body with access/refresh tokens
          headers:
            x-okapi-token:
              required: true
              description: An X-Okapi-Token header
              schema:
                type: string
            refreshtoken:
              required: true
              description: A refresh token
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loginResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '422':
          $ref: '#/components/responses/unprocessableEntityResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /authn/login-with-expiry:
    post:
      description: Get an expiring refresh and access token
      operationId: loginWithExpiry
      tags:
      - login
      parameters:
      - $ref: '#/components/parameters/userAgentHeader'
      - $ref: '#/components/parameters/xForwardedForHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/loginCredentials'
      responses:
        '201':
          description: Login response body with access/refresh tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loginResponseWithExpiry'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '422':
          $ref: '#/components/responses/unprocessableEntityResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /authn/refresh:
    post:
      description: Get a new refresh and access token
      operationId: refreshToken
      tags:
      - login
      parameters:
      - $ref: '#/components/parameters/folioRefreshTokenRequired'
      responses:
        '201':
          description: Refresh response body with access/refresh tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loginResponseWithExpiry'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '422':
          $ref: '#/components/responses/unprocessableEntityResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /authn/logout:
    post:
      description: Logs the user out on their current device
      operationId: logout
      tags:
      - login
      parameters:
      - $ref: '#/components/parameters/folioRefreshToken'
      responses:
        '204':
          description: The user has been logged out from their current devices.
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '422':
          $ref: '#/components/responses/unprocessableEntityResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /authn/logout-all:
    post:
      description: Logs the user out on all of their devices
      operationId: logoutAll
      tags:
      - login
      responses:
        '204':
          description: The user has been logged out from all their devices.
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '422':
          $ref: '#/components/responses/unprocessableEntityResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /authn/token:
    get:
      description: Get a new login token from the authorization code
      operationId: token
      tags:
      - login
      parameters:
      - $ref: '#/components/parameters/userAgentHeader'
      - $ref: '#/components/parameters/xForwardedForHeader'
      - $ref: '#/components/parameters/code'
      - $ref: '#/components/parameters/redirect-uri'
      responses:
        '201':
          description: Login response body with access token
          headers:
            x-okapi-token:
              required: true
              description: An X-Okapi-Token header
              schema:
                type: string
            refreshtoken:
              required: true
              description: A refresh token
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loginResponseWithExpiry'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '422':
          $ref: '#/components/responses/unprocessableEntityResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /authn/update:
    post:
      description: Self-update existing credentials.
      operationId: updateCredentials
      tags:
      - credentials
      parameters:
      - $ref: '#/components/parameters/userAgentHeader'
      - $ref: '#/components/parameters/xForwardedForHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateCredentials'
      responses:
        '204':
          description: Self-update existing credentials.
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '401':
          $ref: '#/components/responses/unauthorizedResponse'
        '422':
          $ref: '#/components/responses/unprocessableEntityResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /authn/credentials:
    post:
      description: Add a new login to the system.
      operationId: createCredentials
      tags:
      - credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/loginCredentials'
      responses:
        '201':
          description: Success string message
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '422':
          $ref: '#/components/responses/unprocessableEntityResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    delete:
      description: Delete credentials for user
      operationId: deleteCredentials
      tags:
      - credentials
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '204':
          description: Credentials removed successfully
        '404':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /authn/password/repeatable:
    post:
      description: Validate password for repeatability
      operationId: validatePasswordRepeatability
      tags:
      - password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/password'
      responses:
        '200':
          description: Password validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validPassword'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /authn/reset-password:
    post:
      description: Resets password for user in record and deletes action record
      operationId: resetPassword
      tags:
      - password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/passwordResetAction'
      responses:
        '201':
          description: Login response body with access/refresh tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseResetAction'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /authn/password-reset-action:
    post:
      description: Saves password reset action to storage
      operationId: createResetPasswordAction
      tags:
      - password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/passwordCreateAction'
      responses:
        '201':
          description: Response to create a new password change action
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responseCreateAction'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /authn/password-reset-action/{actionId}:
    get:
      description: Retrieves action record by id
      operationId: getPasswordActionById
      parameters:
      - $ref: '#/components/parameters/actionId'
      tags:
      - password
      responses:
        '200':
          description: Number of login attempts for user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/passwordCreateAction'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          $ref: '#/components/responses/entityNotFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /authn/log/events:
    get:
      description: Returns a list of events retrieved from storage
      operationId: getLogEvents
      tags:
      - logEvents
      parameters:
      - $ref: '#/components/parameters/length'
      - $ref: '#/components/parameters/start'
      - $ref: '#/components/parameters/query'
      responses:
        '200':
          description: Log events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/logEventCollection'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '404':
          $ref: '#/components/responses/entityNotFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    post:
      description: Saves received event into the storage
      operationId: saveLogEvent
      tags:
      - logEvents
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/logEvent'
      responses:
        '201':
          description: Saved Log event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/logResponse'
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /authn/log/events/{eventId}:
    delete:
      description: Saves received event into the storage
      operationId: deleteLogEvent
      tags:
      - logEvents
      parameters:
      - $ref: '#/components/parameters/eventId'
      responses:
        '204':
          description: No content response
        '404':
          $ref: '#/components/responses/entityNotFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /authn/credentials-existence:
    get:
      description: Returns single property 'credentialsExist' with true, if user has local password
      operationId: checkCredentialsExistence
      tags:
      - credentials
      parameters:
      - $ref: '#/components/parameters/userId'
      responses:
        '200':
          description: Credentials existence response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/credentialsExistence'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
  /token:
    post:
      operationId: token-legacy
      description: '***Not Implemented, Deprecated***


        _Will be removed in a future releases_


        Please use `/token/sign` instead. Returns a signed, non-expiring legacy access token.

        '
      parameters:
      - $ref: '#/components/parameters/okapi-token-required'
      - $ref: '#/components/parameters/okapi-url-required'
      tags:
      - authtoken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/signTokenPayload'
      responses:
        '201':
          description: Created and signed token successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenResponseLegacy'
        '501':
          $ref: '#/components/responses/notImplementedEntityResponse'
  /refreshtoken:
    post:
      operationId: token-sign-legacy
      description: '***Not Implemented***


        Returns a signed, expiring refresh token. This is a legacy endpoint and should not be

        called by new code and will soon be fully depreciated.

        '
      parameters:
      - $ref: '#/components/parameters/okapi-token-required'
      - $ref: '#/components/parameters/okapi-url-required'
      tags:
      - authtoken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/signRefreshToken'
        required: true
      responses:
        '201':
          description: Created and signed token successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/token'
        '501':
          $ref: '#/components/responses/notImplementedEntityResponse'
  /token/sign:
    post:
      operationId: token-sign
      description: '***Not Implemented***


        Returns a signed, expiring access token and refresh token. Also returns the expiration

        of each token in the body of the response. The access token time to live is 10 minutes and

        the refresh token is one week.

        '
      tags:
      - authtoken
      parameters:
      - $ref: '#/components/parameters/okapi-token-required'
      - $ref: '#/components/parameters/okapi-url-required'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/signTokenPayload'
        required: true
      responses:
        '201':
          description: Created and signed tokens successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenResponse'
        '501':
          $ref: '#/components/responses/notImplementedEntityResponse'
  /token/refresh:
    post:
      description: '***Not Implemented***


        Returns a new refresh token and a new access token. Also returns the expiration of each token

        in the body of the response. Time to live is 10 minutes for the access token and one week for

        the refresh token.

        '
      tags:
      - authtoken
      parameters:
      - $ref: '#/components/parameters/okapi-token-required'
      - $ref: '#/components/parameters/okapi-url-required'
      operationId: token-refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/refreshToken'
        required: true
      responses:
        '201':
          description: Refreshed tokens successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/tokenResponse'
        '501':
          $ref: '#/components/responses/notImplementedEntityResponse'
  /token/invalidate:
    post:
      operationId: token-invalidate
      description: '***Not Implemented***


        Invalidate a single token

        '
      tags:
      - authtoken
      parameters:
      - $ref: '#/components/parameters/okapi-token-required'
      - $ref: '#/components/parameters/okapi-url-required'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/refreshToken'
        required: true
      responses:
        '204':
          description: Invalidated token successfully
        '501':
          $ref: '#/components/responses/notImplementedEntityResponse'
  /token/invalidate-all:
    post:
      operationId: token-invalidate-all
      description: '***Not Implemented***


        Invalidate all tokens for a user

        '
      tags:
      - authtoken
      parameters:
      - $ref: '#/components/parameters/okapi-token-required'
      - $ref: '#/components/parameters/okapi-url-required'
      responses:
        '204':
          description: Invalidated tokens successfully
        '501':
          $ref: '#/components/responses/notImplementedEntityResponse'
tags:
- name: authtoken
  description: 'Stub implementation for `authtoken` and `authtoken2` interfaces.

    '
components:
  schemas:
    loginAttempts:
      $schema: http://json-schema.org/draft-04/schema#
      id: loginAttempts.json
      title: Login Attempts Schema
      description: An object describing a login attempt
      type: object
      properties:
        id:
          description: Unique id
          type: string
        userId:
          description: Unique user id
          type: string
        lastAttempt:
          description: Last attempt date
          type: string
          format: date-time
        attemptCount:
          description: Number of user login attempts
          type: integer
    loginCredentials:
      $schema: http://json-schema.org/draft-04/schema#
      id: loginCredentials.json
      title: Login Credentials Schema
      description: An entity that describes the basic credentials for a user to log on to the system
      type: object
      properties:
        username:
          description: Username in the system, case insensitive
          type: string
        userId:
          description: Unique user id
          type: string
        password:
          description: User password
          type: string
      required:
      - password
    loginResponse:
      $schema: http://json-schema.org/draft-04/schema#
      id: loginResponse.json
      title: Login Response Schema
      description: 'Successful login response '
      type: object
      properties:
        okapiToken:
          description: session token (X-Okapi-Token format)
          type: string
        refreshToken:
          description: refresh token
          type: string
      required:
      - okapiToken
    loginResponseWithExpiry:
      $schema: http://json-schema.org/draft-04/schema#
      title: Login Response With Expiry Schema
      description: Object returned on successful login or on token refresh
      type: object
      properties:
        accessTokenExpiration:
          description: The time in UTC after which the access token will be considered expired. Time format is ISO 8601.
          type: string
        refreshTokenExpiration:
          description: The time in UTC after which the refresh token will be considered expired. Time format is ISO 8601.
          type: string
      required:
      - accessTokenExpiration
      - refreshTokenExpiration
    updateCredentials:
      $schema: http://json-schema.org/draft-04/schema#
      id: updateCredentials.json
      title: Update Credentials Schema
      description: An entity that describes the necessary data to update a user password
      type: object
      properties:
        username:
          description: username
          type: string
        userId:
          description: Unique user id
          type: string
        password:
          description: The current password of the user who will be replaced by the new one
          type: string
        newPassword:
          description: New user password
          type: string
      required:
      - username
      - password
      - newPassword
    password:
      $schema: http://json-schema.org/draft-04/schema#
      id: password.json
      title: Password Schema
      description: Object with password property
      type: object
      properties:
        password:
          type: string
          description: Password
        userId:
          type: string
          description: User Id
      required:
      - password
      - userId
    passwordCreateAction:
      $schema: http://json-schema.org/draft-04/schema#
      id: passwordCreateAction.json
      title: Password Create Action Schema
      description: A password create action response
      type: object
      properties:
        id:
          description: ID of the password reset action received in the API request
          type: string
        userId:
          description: User ID to register password reset action
          type: string
        expirationTime:
          description: password expiration time
          type: string
          format: date-time
      required:
      - id
      - userId
      - expirationTime
    passwordResetAction:
      $schema: http://json-schema.org/draft-04/schema#
      id: passwordResetAction.json
      title: Password Reset Action Schema
      description: Reset password entity
      type: object
      properties:
        passwordResetActionId:
          description: Action id for reset password
          type: string
        newPassword:
          description: New password for update
          type: string
      required:
      - passwordResetActionId
      - newPassword
    responseCreateAction:
      $schema: http://json-schema.org/draft-04/schema#
      id: passwordCreateResponse.json
      title: Password Create Action Response Schema
      description: Response entity to create a new password change action
      type: object
      properties:
        passwordExists:
          description: Check if the user has an existing password or credential
          type: boolean
    responseResetAction:
      $schema: http://json-schema.org/draft-04/schema#
      id: passwordResetResponse.json
      title: Password Reset Action Response Schema
      description: Response entity to reset the password
      type: object
      properties:
        isNewPassword:
          description: Indicates the presence of a new password for the user
          type: boolean
    validPasswordResponse:
      $ref: '#/components/schemas/validPassword'
    logEvent:
      $schema: http://json-schema.org/draft-04/schema#
      id: logEvent.json
      title: Log Event Schema
      description: A logging event that describes the event code and basic information for logging events
      type: object
      properties:
        id:
          type: string
          description: The system assigned unique ID of the instance record; UUID
        eventType:
          description: Log event type
          $ref: '#/components/schemas/logEventType'
        tenant:
          type: string
          description: The tenant for which the event occurred
        userId:
          type: string
          description: User ID for which the event is registered.
        ip:
          type: string
          description: Client IP address of registered user Okapi
        browserInformation:
          type: string
          description: Client's browser information obtained from User-Agent http header
        timestamp:
          type: string
          format: date-time
          description: Event registration time
        metadata:
          $ref: '#/components/schemas/metadata'
      required:
      - tenant
      - userId
      - eventType
      additionalProperties: false
    logEventCollection:
      $schema: http://json-schema.org/draft-04/schema#
      id: logEventCollection.json
      title: Log Event Collection Schema
      description: Event List
      type: object
      properties:
        loggingEvent:
          description: Event log with a list of events
          id: eventData
          type: array
          items:
            $ref: '#/components/schemas/logEvent'
        totalRecords:
          description: Number of entries in the event log
          type: integer
      required:
      - loggingEvent
      - totalRecords
    logResponse:
      $schema: http://json-schema.org/draft-04/schema#
      id: logResponse.json
      title: Log Response Schema
      description: The log event object containing the message received from LoginAPI
      type: object
      properties:
        message:
          description: The message containing API response information
          type: string
      required:
      - message
    credentialsExistence:
      $schema: http://json-schema.org/draft-04/schema#
      id: credentialsExistence.json
      title: Credential Existence Schema
      description: Credentials existence response
      type: object
      properties:
        credentialsExist:
          type: boolean
          description: True if user has local password
      required:
      - credentialsExist
    token:
      description: The signed JWT token based on the payload
      type: object
      properties:
        token:
          type: string
          description: The JWT token
      required:
      - token
      additionalProperties: false
    tokenResponse:
      description: A signed JWT token when used in the context of a dummy token. Otherwise, a signed JWT access token and a signed JWE refresh token.
      type: object
      properties:
        token:
          type: string
          description: A dummy token
        refreshToken:
          type: string
          description: A refresh token
        accessToken:
          type: string
          description: An access token
      additionalProperties: false
    tokenResponseLegacy:
      description: The signed JWT token based on the payload
      type: object
      properties:
        token:
          type: string
          description: The JWT token
      required:
      - token
      additionalProperties: false
    refreshToken:
      description: The refresh token being presented to get a new refresh token and access token
      type: object
      properties:
        refreshToken:
          type: string
          description: The JWE refresh token
      required:
      - refreshToken
      additionalProperties: false
    signRefreshToken:
      description: The request to sign a new refresh token
      type: object
      properties:
        userId:
          type: string
          description: The user id of the request
          format: uuid
        sub:
          type: string
          description: The subject (user id) of the request
      required:
      - userId
      - sub
      additionalProperties: false
    signTokenPayload:
      description: The POST body for the request to generate a signed token
      type: object
      properties:
        payload:
          type: object
          description: The payload of the token signing request
          properties:
            sub:
              type: string
              description: The subject (the username) for the user
          required:
          - sub
          additionalProperties: true
      required:
      - payload
      additionalProperties: false
    errorResponse:
      $ref: '#/components/schemas/errors'
    errorCode:
      $schema: http://json-schema.org/draft-04/schema#
      id: errorCode.json
      title: Error Code Schema
      description: Error message code
      type: string
      enum:
      - unknown_error
      - service_error
      - validation_error
      - not_found_error
      - found_error
      - token.parse.failure
      - token.refresh.unprocessable
      - token.logout.unprocessable
      - unauthorized_error
    parameter:
      $schema: http://json-schema.org/draft-04/schema#
      id: parameter.json
      title: Key/Value Parameter Schema
      description: List of key/value parameters of an error
      type: object
      properties:
        key:
          description: Parameter key
          type: string
        value:
          description: Parameter value
          type: string
    parameters:
      $schema: http://json-schema.org/draft-04/schema#
      id: parameters.json
      title: List of Parameters Schema
      description: List of key/value parameters of an error
      type: array
      items:
        $ref: '#/components/schemas/parameter'
    error:
      $schema: http://json-schema.org/draft-04/schema#
      id: error.json
      title: Error Schema
      description: An error object
      type: object
      properties:
        message:
          type: string
          description: Error message text
        type:
          type: string
          description: Error message type
        code:
          description: Error message code
          $ref: '#/components/schemas/errorCode'
        parameters:
          description: List of key/value parameters of an error
          $ref: '#/components/schemas/parameters'
    errors:
      $schema: http://json-schema.org/draft-04/schema#
      id: Errors Schema
      description: A set of errors
      type: object
      properties:
        errors:
          description: List of errors
          id: errors
          type: array
          items:
            $ref: '#/components/schemas/error'
        total_records:
          description: Total number of errors
          type: integer
    validPassword:
      $schema: http://json-schema.org/draft-04/schema#
      id: passwordValid.json
      title: Password validation result
      description: Password success validation result
      type: object
      properties:
        result:
          type: string
          description: Password validation result message
      required:
      - result
    logEventType:
      $schema: http://json-schema.org/draft-04/schema#
      id: logEventType.json
      title: Log Event Type Schema
      description: Log event type
      type: string
      enum:
      - PASSWORD_RESET
      - PASSWORD_CREATE
      - PASSWORD_CHANGE
      - SUCCESSFUL_LOGIN_ATTEMPT
      - FAILED_LOGIN_ATTEMPT
      - USER_BLOCK
    metadata:
      $schema: http://json-schema.org/draft-04/schema#
      id: metadata.json
      title: Metadata Schema
      description: Record metadata
      type: object
      properties:
        createdDate:
          description: Date and time when the record was created
          type: string
        createdByUserId:
          description: ID of the user who created the record (when available)
          type: string
        createdByUsername:
          description: Username of the user who created the record (when available)
          type: string
        updatedDate:
          description: Date and time when the record was last updated
          type: string
        updatedByUserId:
          description: ID of the user who last updated the record (when available)
          type: string
        updatedByUsername:
          description: Username of the user who last updated the record (when available)
          type: string
  responses:
    badRequestResponse:
      description: Error response in JSON format for validation errors.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errors'
    unauthorizedResponse:
      description: Error response in JSON format if user is not authorized to perform operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errors'
    entityNotFoundResponse:
      description: Error response if entity is not found by id (in json format)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errors'
    unprocessableEntityResponse:
      description: Error response in JSON format for unprocessable entity.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errors'
    notImplementedEntityResponse:
      description: Error response in JSON format for endpoints that are not implemented.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errors'
    internalServerErrorResponse:
      description: Error response for unhandled or critical server exceptions, e.g. NullPointerException.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errors'
  parameters:
    actionId:
      in: path
      required: true
      name: actionId
      description: Action Identifier
      schema:
        type: string
    userId:
      in: query
      required: true
      name: userId
      description: User identifier
      schema:
        type: string
    eventId:
      in: path
      required: true
      name: eventId
      description: Event Identifier
      schema:
        type: string
    pathUserId:
      in: path
      required: true
      name: userId
      description: User identifier
      schema:
        type: string
    userAgentHeader:
      in: header
      required: false
      name: userAgent
      description: Used to identify the Operating System and Browser of the web-server
      schema:
        type: string
    xForwardedForHeader:
      in: header
      required: false
      name: forwardedFor
      description: -< HTTP header field is a common method for identifying the originating IP address of a client connecting to a web server through an HTTP proxy or load balancer
      schema:
        type: string
    folioRefreshToken:
      in: cookie
      required: false
      name: folioRefreshToken
      description: Refresh token cookie
      schema:
        type: string
    folioRefreshTokenRequired:
      in: cookie
      required: true
      name: folioRefreshToken
      description: Refresh token cookie
      schema:
        type: string
    length:
      in: query
      name: length
      description: The maximum number of results to return.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 10
      example: 10
    start:
      in: query
      name: start
      description: The starting index in a list of results (starts at one).
      schema:
        type: integer
        minimum: 1
        default: 1
    query:
      in: query
      name: query
      description: A query string to filter users based on matching criteria in fields.
      required: false
      schema:
        type: string
      example: '10'
    code:
      in: query
      required: true
      name: code
      description: temporary authentication code
      schema:
        type: string
    redirect-uri:
      in: query
      required: true
      name: redirect-uri
      description: initial uri that was used as redirect uri for getting authentication code
      schema:
        type: string
    okapi-token-required:
      in: header
      name: X-Okapi-Tenant
      description: Okapi Tenant
      required: true
      schema:
        type: string
    okapi-url-required:
      in: header
      name: X-Okapi-Url
      description: Okapi URL
      required: true
      schema:
        type: string
