        instanceFormatIds:
          type: array
          description: UUIDs for the unique terms for the format whether it's from the RDA carrier term list of locally defined
          items:
            type: string
            $ref: '#/components/schemas/uuid-2'
        instanceFormats:
          type: array
          description: List of dereferenced instance formats
          items:
            type: object
            $ref: '#/components/schemas/instanceformat'
          readonly: true
          folio:isVirtual: true
          folio:linkBase: instance-formats
          folio:linkFromField: instanceFormatIds
          folio:linkToField: id
          folio:includedElement: instanceFormats
        physicalDescriptions:
          type: array
          description: Physical description of the described resource, including its extent, dimensions, and such other physical details as a description of any accompanying materials and unit type and size
          items:
            type: string
        languages:
          type: array
          description: The set of languages used by the resource
          minItems: 0
          items:
            type: string
        notes:
          type: array
          description: Bibliographic notes (e.g. general notes, specialized notes)
          items:
            type: object
            javaType: org.folio.rest.jaxrs.model.InstanceNote
            additionalProperties: true
            properties:
              instanceNoteTypeId:
                description: ID of the type of note
                $ref: '#/components/schemas/uuid-2'
              note:
                type: string
                description: Text content of the note
              staffOnly:
                type: boolean
                description: If true, determines that the note should not be visible for others than staff
                default: false
        administrativeNotes:
          type: array
          description: Administrative notes
          minItems: 0
          items:
            type: string
        modeOfIssuanceId:
          type: string
          description: UUID of the RDA mode of issuance, a categorization reflecting whether a resource is issued in one or more parts, the way it is updated, and whether its termination is predetermined or not (e.g. monograph,  sequential monograph, serial; integrating Resource, other)
          $ref: '#/components/schemas/uuid-2'
        catalogedDate:
          type: string
          description: Date or timestamp on an instance for when is was considered cataloged
        previouslyHeld:
          type: boolean
          description: Records the fact that the resource was previously held by the library for things like Hathi access, etc.
          default: false
        staffSuppress:
          type: boolean
          description: Records the fact that the record should not be displayed for others than catalogers
        discoverySuppress:
          type: boolean
          description: Records the fact that the record should not be displayed in a discovery system
          default: false
        statisticalCodeIds:
          type: array
          description: List of statistical code IDs
          items:
            type: string
          uniqueItems: true
        sourceRecordFormat:
          type: string
          description: Format of the instance source record, if a source record exists (e.g. FOLIO if it's a record created in Inventory,  MARC if it's a MARC record created in MARCcat or EPKB if it's a record coming from eHoldings)
          enum:
          - MARC-JSON
          readonly: true
        statusId:
          type: string
          description: UUID for the Instance status term (e.g. cataloged, uncatalogued, batch loaded, temporary, other, not yet assigned)
          $ref: '#/components/schemas/uuid-2'
        statusUpdatedDate:
          type: string
          description: Date [or timestamp] for when the instance status was updated
        tags:
          description: arbitrary tags associated with this instance
          id: tags
          type: object
          $ref: '#/components/schemas/tags'
        metadata:
          type: object
          $ref: '#/components/schemas/metadata'
          readonly: true
        holdingsRecords2:
          type: array
          description: List of holdings records
          items:
            type: object
            $ref: '#/components/schemas/holdingsRecord'
          readonly: true
          folio:isVirtual: true
          folio:linkBase: holdings-storage/holdings
          folio:linkFromField: id
          folio:linkToField: instanceId
          folio:includedElement: holdingsRecords
        natureOfContentTermIds:
          type: array
          description: Array of UUID for the Instance nature of content (e.g. bibliography, biography, exhibition catalogue, festschrift, newspaper, proceedings, research report, thesis or website)
          uniqueItems: true
          items:
            type: string
            description: Single UUID for the Instance nature of content
            $ref: '#/components/schemas/uuid-2'
      additionalProperties: true
    tags-2:
      $schema: http://json-schema.org/draft-04/schema#
      title: tags
      description: List of simple tags that can be added to an object
      type: object
      properties:
        tagList:
          description: List of tags
          type: array
          items:
            type: string
      additionalProperties: false
    user:
      $schema: http://json-schema.org/draft-04/schema#
      title: User Schema
      description: A user
      javaName: User
      type: object
      properties:
        username:
          description: A unique name belonging to a user. Typically used for login
          type: string
        id:
          description: A globally unique (UUID) identifier for the user
          type: string
        externalSystemId:
          description: A unique ID that corresponds to an external authority
          type: string
        barcode:
          description: The unique library barcode for this user
          type: string
        active:
          description: A flag to determine if the user's account is effective and not expired. The tenant configuration can require the user to be active for login. Active is different from the loan patron block
          type: boolean
        type:
          description: The class of user like staff or patron; this is different from patronGroup; it can store shadow, system user and dcb types also
          type: string
        patronGroup:
          description: A UUID corresponding to the group the user belongs to, see /groups API, example groups are undergraduate and faculty; loan rules, patron blocks, fees/fines and expiration days can use the patron group
          type: string
          $ref: '#/components/schemas/uuid-2'
        departments:
          description: A list of UUIDs corresponding to the departments the user belongs to, see /departments API
          type: array
          uniqueItems: true
          items:
            type: string
            $ref: '#/components/schemas/uuid-2'
        meta:
          description: Deprecated
          type: object
        proxyFor:
          description: Deprecated
          type: array
          items:
            type: string
        personal:
          description: Personal information about the user
          type: object
          properties:
            lastName:
              description: The user's surname
              type: string
            firstName:
              description: The user's given name
              type: string
            middleName:
              description: The user's middle name (if any)
              type: string
            preferredFirstName:
              description: The user's preferred name
              type: string
            email:
              description: The user's email address
              type: string
            phone:
              description: The user's primary phone number
              type: string
            mobilePhone:
              description: The user's mobile phone number
              type: string
            dateOfBirth:
              type: string
              description: The user's birth date
              format: date-time
            addresses:
              description: Physical addresses associated with the user
              type: array
              minItems: 0
              items:
                type: object
                properties:
                  id:
                    description: A unique id for this address
                    type: string
                  countryId:
                    description: The country code for this address
                    type: string
                  addressLine1:
                    description: Address, Line 1
                    type: string
                  addressLine2:
                    description: Address, Line 2
                    type: string
                  city:
                    description: City name
                    type: string
                  region:
                    description: Region
                    type: string
                  postalCode:
                    description: Postal Code
                    type: string
                  addressTypeId:
                    description: A UUID that corresponds with an address type object
                    type: string
                    $ref: '#/components/schemas/uuid-2'
                  primaryAddress:
                    description: Is this the user's primary address?
                    type: boolean
            preferredContactTypeId:
              description: Id of user's preferred contact type like Email, Mail or Text Message, see /addresstypes API
              type: string
            profilePictureLink:
              description: Link to the profile picture
              type: string
              format: uri
        enrollmentDate:
          description: The date in which the user joined the organization
          type: string
          format: date-time
        expirationDate:
          description: The date for when the user becomes inactive
          type: string
          format: date-time
        createdDate:
          description: Deprecated
          type: string
          format: date-time
        updatedDate:
          description: Deprecated
          type: string
          format: date-time
        metadata:
          type: object
          $ref: '#/components/schemas/metadata'
        tags:
          type: object
          $ref: '#/components/schemas/tags-2'
        customFields:
          description: Object that contains custom field
          type: object
        preferredEmailCommunication:
          type: array
          items:
            type: string
            enum:
            - Support
            - Programs
            - Services
          maxItems: 3
          uniqueItems: true
          description: Preferred email communication types
    userGroup:
      $schema: http://json-schema.org/draft-04/schema#
      description: A user group
      type: object
      properties:
        group:
          description: The unique name of this group
          type: string
        desc:
          description: An explanation of this group
          type: string
        id:
          description: A UUID identifying this group
          type: string
        expirationOffsetInDays:
          description: The default period in days after which a newly created user that belongs to this group will expire
          type: integer
        source:
          description: Origin of the group record, i.e. 'System' or 'User'
          type: string
        metadata:
          $ref: '#/components/schemas/metadata'
      additionalProperties: true
      required:
      - group
    userGroups:
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      description: Collection of user groups
      properties:
        usergroups:
          description: List of user group items
          id: groups
          type: array
          items:
            type: object
            $ref: '#/components/schemas/userGroup'
        totalRecords:
          type: integer
    department:
      $schema: http://json-schema.org/draft-04/schema#
      title: Department
      description: Department object schema
      type: object
      properties:
        id:
          description: A UUID identifying this department
          $ref: '#/components/schemas/uuid-2'
          example: f973c3b6-85fc-4d35-bda8-f31b568957bf
        name:
          description: The unique name of this department
          type: string
          example: Accounting
        code:
          description: The unique code of this department
          type: string
          example: ACC
        usageNumber:
          type: integer
          description: Number of users that have this department
          readonly: true
        source:
          description: Origin of the department record, i.e. 'System' or 'User'
          type: string
        metadata:
          description: Metadata about creation and changes to department records
          $ref: '#/components/schemas/metadata'
          readonly: true
    addressType:
      $schema: http://json-schema.org/draft-04/schema#
      title: Address Type Schema
      description: An address type
      type: object
      properties:
        addressType:
          description: A unique name for this address type
          type: string
        desc:
          description: An explanation of this address type
          type: string
        id:
          description: A UUID identifying this address type
          type: string
        metadata:
          $ref: '#/components/schemas/metadata'
          readonly: true
    seriesItem:
      type: object
      description: A series item description
      properties:
        value:
          type: string
          description: Series title value
        authorityId:
          type: string
          description: UUID of authority record that controls a series title
    alternativeTitle:
      type: object
      description: An alternative title description
      properties:
        alternativeTitleTypeId:
          type: string
          description: UUID for an alternative title qualifier
        alternativeTitle:
          type: string
          description: An alternative title for the resource
        authorityId:
          type: string
          description: UUID of authority record that controls an alternative title
    identifier:
      type: object
      description: Resource identifier
      properties:
        value:
          type: string
          description: Resource identifier value
        identifierTypeId:
          type: string
          description: Resource identifier type (e.g. Control number, LCCN, Other standard identifier, System control number)
    contributor:
      type: object
      description: A contributor description
      properties:
        name:
          type: string
          description: Personal name, corporate name, meeting name
        contributorTypeId:
          type: string
          description: ID for the contributor type term defined as a reference table in settings
        contributorTypeText:
          type: string
          description: Free text element for adding contributor type terms other than those defined by the MARC code list for relators
        contributorNameTypeId:
          type: string
          description: Contributor type terms defined by the MARC code list for relators
        authorityId:
          type: string
          description: ID of authority record that controls the contributor
        primary:
          type: boolean
          description: Whether this is the primary contributor
    subject:
      type: object
      description: A subject heading description
      properties:
        value:
          type: string
          description: Subject heading value
        authorityId:
          type: string
          description: UUID of authority record that controls a subject heading
        sourceId:
          type: string
          description: UUID of subject source
        typeId:
          type: string
          description: UUID of subject type
    dates:
      type: object
      description: Instance Dates
      properties:
        dateTypeId:
          type: string
          description: Date type ID
        date1:
          type: string
          description: Date1 value
        date2:
          type: string
          description: Date2 value
    metadata-2:
      type: object
      properties:
        createdDate:
          description: Date and time when the record was created
          type: string
        createdByUserId:
          description: ID of the user who created the record (when available)
          type: string
        updatedDate:
          description: Date and time when the record was last updated
          type: string
        updatedByUserId:
          description: ID of the user who last updated the record (when available)
          type: string
    publication:
      type: object
      properties:
        publisher:
          description: Name of publisher, distributor, etc.
          type: string
        dateOfPublication:
          description: Date (year YYYY) of publication, distribution, etc.
          type: string
        place:
          description: Place of publication, distribution, etc.
          type: string
    tags-3:
      title: tags
      description: List of simple tags that can be added to an object
      type: object
      properties:
        tagList:
          description: List of tags
          type: array
          items:
            type: string
    classification:
      type: object
      description: Classification object
      properties:
        classificationNumber:
          description: Classification (e.g. classification scheme, classification schedule)
          type: string
        classificationTypeId:
          description: Classification type ID
          type: string
    electronicAccess:
      description: Electronic access object
      type: object
      properties:
        uri:
          type: string
          description: Uniform Resource Identifier (URI) is a string of characters designed for unambiguous identification of resources
        linkText:
          type: string
          description: 'The value of the MARC tag field 856 2nd indicator, where the values are: no information provided, resource, version of resource, related resource, no display constant generated'
        materialsSpecification:
          type: string
          description: Materials specified is used to specify to what portion or aspect of the resource the electronic location and access information applies (e.g. a portion or subset of the item is electronic, or a related electronic resource is being linked to the record)
        publicNote:
          type: string
          description: URL public note to be displayed in the discovery
    note:
      description: Bibliographic or administrative note for instance/item/holding
      type: object
      properties:
        note:
          type: string
          description: Text content of the note
        staffOnly:
          type: boolean
          description: If true, determines that the note should not be visible for others than staff
          default: false
    circulationNote:
      description: Circulations note for item
      type: object
      properties:
        note:
          type: string
          description: Text to display
        staffOnly:
          type: boolean
          description: Flag to restrict display of this note
          default: false
    searchItem:
      description: Item description
      type: object
      properties:
        id:
          type: string
          description: Unique ID of the item record
        tenantId:
          description: Tenant ID
          type: string
        holdingsRecordId:
          description: Holdings record ID
          type: string
        hrid:
          type: string
          description: The human readable ID, also called eye readable ID. A system-assigned sequential alternate ID
        accessionNumber:
          type: string
          description: Also called inventory number
        formerIds:
          type: array
          description: Previous identifiers assigned to the item
          items:
            type: string
        itemIdentifier:
          type: string
          description: Item identifier number, e.g. imported from the union catalogue (read only).
        barcode:
          type: string
          description: Unique inventory control number for physical resources, used largely for circulation purposes
        effectiveLocationId:
          type: string
          description: Read only current home location for the item.
        status:
          description: The status of the item
          type: object
          properties:
            name:
              description: Name of the status e.g. Available, Checked out, In transit
              type: string
        materialTypeId:
          type: string
          description: Material type, term. Define what type of thing the item is.
        discoverySuppress:
          type: boolean
          description: Records the fact that the record should not be displayed in a discovery system
        effectiveCallNumberComponents:
          type: object
          description: Elements of a full call number generated from the item or holding
          properties:
            callNumber:
              type: string
              description: Effective Call Number is an identifier assigned to an item or its holding and associated with the item.
            prefix:
              type: string
              description: Effective Call Number Prefix is the prefix of the identifier assigned to an item or its holding and associated with the item.
            suffix:
              type: string
              description: Effective Call Number Suffix is the suffix of the identifier assigned to an item or its holding and associated with the item.
            typeId:
              type: string
              description: Effective Call Number Type Id is the call number type id of the item, if available, otherwise that of the holding.
        volume:
          type: string
        enumeration:
          type: string
        chronology:
          type: string
        copyNumber:
          type: string
        effectiveShelvingOrder:
          type: string
          description: A system generated normalization of the call number that allows for call number sorting in reports and search results
        itemLevelCallNumberTypeId:
          type: string
          description: Call number type id
        tags:
          $ref: '#/components/schemas/tags-3'
        electronicAccess:
          type: array
          description: List of electronic access items
          items:
            $ref: '#/components/schemas/electronicAccess'
        administrativeNotes:
          type: array
          description: Administrative notes
          items:
            type: string
        notes:
          type: array
          description: Notes about action, copy, binding etc.
          items:
            $ref: '#/components/schemas/note'
        statisticalCodeIds:
          type: array
          description: List of statistical code IDs
          items:
            type: string
            description: UUID for a statistical code
        circulationNotes:
          type: array
          description: Notes to be displayed in circulation processes.
          items:
            $ref: '#/components/schemas/circulationNote'
        metadata:
          $ref: '#/components/schemas/metadata-2'
      required:
      - notes
    searchHolding:
      description: Holding description
      type: object
      properties:
        id:
          type: string
          description: Unique ID of the holding record
        tenantId:
          description: Tenant ID
          type: string
        permanentLocationId:
          type: string
          description: The permanent shelving location in which an item resides.
        discoverySuppress:
          type: boolean
          description: Indicates that the record should not be displayed in a discovery system
        hrid:
          type: string
          description: the human readable ID, also called eye readable ID. A system-assigned sequential ID which maps to the Instance ID
        sourceId:
          description: (A reference to) the source of a holdings record
          type: string
        formerIds:
          type: array
          description: Previous identifiers assigned to the holding
          items:
            type: string
        statisticalCodeIds:
          type: array
          description: List of statistical code IDs
          items:
            type: string
            description: UUID for a statistical code
        tags:
          $ref: '#/components/schemas/tags-3'
        holdingsTypeId:
          type: string
          description: unique ID for the type of this holdings record, a UUID
        callNumberPrefix:
          type: string
          description: Prefix of the call number on the holding level.
        callNumber:
          type: string
          description: Call Number is an identifier assigned to an item, usually printed on a label attached to the item.
        callNumberSuffix:
          type: string
          description: Suffix of the call number on the holding level.
        copyNumber:
          type: string
          description: Item/Piece ID (usually barcode) for systems that do not use item records.
        electronicAccess:
          type: array
          description: List of electronic access items
          items:
            $ref: '#/components/schemas/electronicAccess'
        administrativeNotes:
          type: array
          description: Administrative notes
          items:
            type: string
        notes:
          type: array
          description: Notes about action, copy, binding etc.
          items:
            $ref: '#/components/schemas/note'
        metadata:
          $ref: '#/components/schemas/metadata-2'
    searchInstance:
      type: object
      description: instance description
      properties:
        id:
          description: The unique ID of the instance record; a UUID
          type: string
        tenantId:
          description: Tenant ID
          type: string
        shared:
          description: Indicate if it shared record
          type: boolean
        hrid:
          description: The human readable ID, also called eye readable ID. A system-assigned sequential ID which maps to the Instance ID
          type: string
        source:
          description: The metadata source and its format of the underlying record to the instance record. (e.g. FOLIO if it's a record created in Inventory;  MARC if it's a MARC record created in MARCcat or EPKB if it's a record coming from eHoldings)
          type: string
        statisticalCodeIds:
          description: List of statistical code IDs
          type: array
          items:
            description: UUID for a statistical code
            type: string
        statusId:
          description: UUID for the Instance status term (e.g. cataloged, uncatalogued, batch loaded, temporary, other, not yet assigned)
          type: string
        title:
          description: The primary title (or label) associated with the resource
          type: string
        indexTitle:
          description: Title normalized for browsing and searching; based on the title with articles removed
          type: string
        series:
          description: List of series titles associated with the resource (e.g. Harry Potter)
          type: array
          items:
            $ref: '#/components/schemas/seriesItem'
        alternativeTitles:
          type: array
          description: List of alternative titles for the resource (e.g. original language version title of a movie)
          items:
            $ref: '#/components/schemas/alternativeTitle'
        identifiers:
          type: array
          description: Resource identifier value array
          items:
            $ref: '#/components/schemas/identifier'
        contributors:
          type: array
          description: List of contributors names
          items:
            $ref: '#/components/schemas/contributor'
        subjects:
          type: array
          description: List of subject headings
          items:
            $ref: '#/components/schemas/subject'
        dates:
          $ref: '#/components/schemas/dates'
        instanceTypeId:
          description: UUID of the unique term for the resource type whether it's from the RDA content term list of locally defined
          type: string
        instanceFormatIds:
          description: UUIDs for the unique terms for the format whether it's from the RDA carrier term list of locally defined
          type: array
          items:
            type: string
        languages:
          description: The set of languages used by the resource
          type: array
          items:
            type: string
        metadata:
          $ref: '#/components/schemas/metadata-2'
        administrativeNotes:
          type: array
          description: Administrative notes
          items:
            type: string
        modeOfIssuanceId:
          description: UUID of the RDA mode of issuance, a categorization reflecting whether a resource is issued in one or more parts, the way it is updated, and whether its termination is predetermined or not (e.g. monograph,  sequential monograph, serial; integrating Resource, other)
          type: string
        natureOfContentTermIds:
          description: Array of UUID for the Instance nature of content (e.g. bibliography, biography, exhibition catalogue, festschrift, newspaper, proceedings, research report, thesis or website)
          type: array
          items:
            description: Single UUID for the Instance nature of content
            type: string
        publication:
          description: List of publication items
          type: array
          items:
            $ref: '#/components/schemas/publication'
        staffSuppress:
          description: Records the fact that the record should not be displayed for others than catalogers
          type: boolean
        discoverySuppress:
          description: Records the fact that the record should not be displayed in a discovery system
          type: boolean
        isBoundWith:
          description: Indicates if this instance is included in a bound-with
          type: boolean
        tags:
          $ref: '#/components/schemas/tags-3'
        classifications:
          type: array
          description: List of classifications
          items:
            $ref: '#/components/schemas/classification'
        electronicAccess:
          description: List of electronic access items
          type: array
          items:
            $ref: '#/components/schemas/electronicAccess'
        notes:
          description: Bibliographic notes (e.g. general notes, specialized notes), and administrative notes
          type: array
          items:
            $ref: '#/components/schemas/note'
        items:
          description: List of instance items
          type: array
          items:
            $ref: '#/components/schemas/searchItem'
        holdings:
          description: List of instance holding records
          type: array
          items:
            $ref: '#/components/schemas/searchHolding'
  parameters:
    servicePointId:
      name: servicePointId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    pick-slips:
      description: Pick slips response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/pickSlipsResponse'
    search-slips:
      description: Search slips response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/searchSlipsResponse'
    badRequestResponse:
      description: Validation errors
      content:
        application/json:
          example:
            errors:
            - message: Request is invalid
            total_records: 1
          schema:
            $ref: '#/components/schemas/errors'
    notFoundResponse:
      description: Not found
      content:
        application/json:
          example:
            errors:
            - message: Request not found
            total_records: 1
          schema:
            $ref: '#/components/schemas/errors'
    internalServerErrorResponse:
      description: When unhandled exception occurred during code execution, e.g. NullPointerException
      content:
        application/json:
          example:
            errors:
            - message: Unexpected error
            total_records: 1
          schema:
            $ref: '#/components/schemas/errors'
