      description: "A CQL query string with filter conditions must include anchor query with range conditions. Anchor field is `headingRef`.\nFilters support logic operators `AND` and `OR`. All filters should be combined in parentheses.\nAnchor will be included only if `<=` or `>=` are used in the query. Otherwise, the empty row will be added if `highlightMatch` is equal to `true`.\n<table>\n  <caption>\n      Supported filter options\n  </caption>\n  <thead>\n  <tr>\n      <th>Option</th>\n      <th>Data type</th>\n      <th>Supported operators</th>\n      <th>Description</th>\n  </tr>\n  </thead>\n  <tbody>\n  <tr>\n      <td>tenantId</td>\n      <td>string</td>\n      <td>==</td>\n      <td>Filter by tenant ID in consortium</td>\n  </tr>\n  <tr>\n      <td>shared</td>\n      <td>boolean</td>\n      <td>==</td>\n      <td>Filter by shared/non-shared in consortium</td>\n  </tr>\n  <tr>\n      <td>sourceFileId</td>\n      <td>uuid</td>\n      <td>==</td>\n      <td>Filter by authority source\
