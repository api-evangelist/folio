# x-archived-from: folio-mod-search-openapi.yml
# x-archived-on: 2026-10-09
openapi: 3.0.0
info:
  contact:
    name: Spitfire team
  description: 'API for searching, browsing, and managing facets for various record types, including instances, holdings, and authorities.

    It also provides endpoints for configuring search and browse features, as well as managing the search index.

    '
  title: Search API
  version: v4.1.0
servers:
- description: Development environments.
  url: https://{environment}-okapi.ci.folio.org
  variables:
    environment:
      default: folio-dev-spitfire
      enum:
      - folio-dev-spitfire
      - folio-perf-spitfire
- description: Reference environments.
  url: https://folio-{environment}-okapi.dev.folio.org
  variables:
    environment:
      default: snapshot
      enum:
      - snapshot
      - snapshot-2
tags:
- description: Provides endpoints to browse records (e.g., instances, authorities) in alphabetical order by a specific field, such as call number, classification number, subject, or contributor.
  name: browse
- description: Provides endpoints to configure search and browse features, such as enabling/disabling specific features or managing language settings.
  name: config
- description: Provides endpoints to retrieve aggregated information (facets) about records, such as counts of records by specific fields or ranges of values. This can be used for faceted search or browsing.
  name: facets
- description: Provides endpoints to manage the search index, including creating or updating mappings, settings, and manually populating the index with records from external sources (e.g., inventory).
  name: index-management
- description: Provides endpoints to search for records (e.g., instances, authorities) using CQL (Contextual Query Language) queries. Supports various search options and retrieval of search results.
  name: search
- description: Provides endpoints to search for consolidated records (e.g., holdings, items) across multiple institutions or libraries within a consortium.
  name: search-consortium
- description: Provides endpoints to retrieve record IDs by CQL queries, without returning the full record data.
  name: search-resources-ids
paths:
  /search/instances:
    get:
      description: Get a list of instances for CQL query
      operationId: searchInstances
      parameters:
      - description: X-Okapi-Tenant header value
        in: header
        name: x-okapi-tenant
        required: true
        schema:
          type: string
      - description: "A CQL query string\n<h5 id=\"instance-search-options\">Instance search options</h5>\n  <table>\n  <thead>\n  <tr>\n      <th>Option</th>\n      <th>Type</th>\n      <th>Example</th>\n      <th>Description</th>\n  </tr>\n  </thead>\n  <tbody>\n  <tr>\n      <td>keyword</td>\n      <td>full-text</td>\n      <td>keyword all &quot;web semantic&quot;</td>\n      <td>An alias for: title, alternativeTitles, indexTitle, series, contributors.name</td>\n  </tr>\n  <tr>\n      <td>id</td>\n      <td>term</td>\n      <td>id==&quot;1234567&quot;</td>\n      <td>Matches instance with the id</td>\n  </tr>\n  <tr>\n      <td>hrid</td>\n      <td>term</td>\n      <td>hrid==&quot;hr1*0&quot;</td>\n      <td>Matches instances with given HRID</td>\n  </tr>\n  <tr>\n      <td>source</td>\n      <td>term</td>\n      <td>source==&quot;MARC&quot;</td>\n      <td>Matches instances with given source (FOLIO/MARC)</td>\n  </tr>\n  <tr>\n      <td>title</td>\n      <td>full-text</td>\n      <td>title\
          \ all &quot;semantic web&quot;</td>\n      <td>Matches instances with the given title, searches against title, alternativeTitles,\n          indexTitle, series fields\n      </td>\n  </tr>\n  <tr>\n      <td>alternativeTitles.alternativeTitle</td>\n      <td>full-text</td>\n      <td>alternativeTitles.alternativeTitle all &quot;semantic web&quot;</td>\n      <td>Matches instances with the given alternative title</td>\n  </tr>\n  <tr>\n      <td>uniformTitle</td>\n      <td>full-text</td>\n      <td>uniformTitle all &quot;semantic web&quot;</td>\n      <td>Matches instances with the given uniform title</td>\n  </tr>\n  <tr>\n      <td>indexTitle</td>\n      <td>full-text</td>\n      <td>indexTitle all &quot;semantic web&quot;</td>\n      <td>Matches instances with the given index title</td>\n  </tr>\n  <tr>\n      <td>series</td>\n      <td>full-text</td>\n      <td>series all &quot;series&quot;</td>\n      <td>Matches instance with given series value</td>\n  </tr>\n  <tr>\n   \
          \   <td>identifiers.value</td>\n      <td>term</td>\n      <td>identifiers.value = &quot;1023*&quot;</td>\n      <td>Matches instances with the given identifier value</td>\n  </tr>\n  <tr>\n      <td>identifiers.identifierTypeId</td>\n      <td>term</td>\n      <td>identifiers.identifierTypeId==&quot;123&quot; identifiers.value = &quot;1023*&quot;\n      </td>\n      <td>Matches instances that have an identifier of type 123 and ANY\n          identifier with value 1023*\n      </td>\n  </tr>\n  <tr>\n      <td>contributors</td>\n      <td>full-text</td>\n      <td>contributors all &quot;John&quot;</td>\n      <td>Matches instances that have a John contributor</td>\n  </tr>\n  <tr>\n      <td>contributors.name</td>\n      <td>full-text</td>\n      <td>contributors.name all &quot;John&quot;</td>\n      <td>Matches instances that have a primary John contributor</td>\n  </tr>\n  <tr>\n      <td>contributors.contributorTypeId</td>\n      <td>term</td>\n      <td>contributors.contributorTypeId\
          \ all &quot;1234567&quot;</td>\n      <td>Matches instances that have a contributor type Id 1234567</td>\n  </tr>\n  <tr>\n      <td>contributors.contributorNameTypeId</td>\n      <td>term</td>\n      <td>contributors.contributorNameTypeId all &quot;1234567&quot;</td>\n      <td>Matches instances that have a contributor name type Id 1234567</td>\n  </tr>\n  <tr>\n      <td>contributors.primary</td>\n      <td>term</td>\n      <td>contributors all &quot;John&quot; and contributors.primary==true</td>\n      <td>Matches instances that have a primary John contributor</td>\n  </tr>\n  <tr>\n      <td>contributors.authorityId</td>\n      <td>term</td>\n      <td>contributors.authorityId ==\n          &quot;81ae0f60-f2bc-450c-84c8-5a21096daed9&quot;\n      </td>\n      <td>Matches instances that have a contributor authorityId 81ae0f60-f2bc-450c-84c8-5a21096daed9\n      </td>\n  </tr>\n  <tr>\n      <td>authorityId</td>\n      <td>term</td>\n      <td>authorityId == &quot;81ae0f60-f2bc-450c-84c8-5a21096daed9&quot;</td>\n\
          \      <td>Matches instances that have a contributor authorityId 81ae0f60-f2bc-450c-84c8-5a21096daed9\n      </td>\n  </tr>\n  <tr>\n      <td>subjects</td>\n      <td>full-text</td>\n      <td>subjects all &quot;Chemistry&quot;</td>\n      <td>Matches instances that have a Chemistry subject</td>\n  </tr>\n  <tr>\n      <td>instanceTypeId</td>\n      <td>term</td>\n      <td>instanceTypeId == &quot;123&quot;</td>\n      <td>Matches instances with the 123 type</td>\n  </tr>\n  <tr>\n      <td>statusId</td>\n      <td>term</td>\n      <td>statusId == &quot;123&quot;</td>\n      <td>Matches instances with the 123 status</td>\n  </tr>\n  <tr>\n      <td>instanceFormatIds</td>\n      <td>term</td>\n      <td>instanceFormatIds == &quot;123&quot;</td>\n      <td>Matches instances with the 123 format id</td>\n  </tr>\n  <tr>\n      <td>languages</td>\n      <td>term</td>\n      <td>languages == &quot;eng&quot;</td>\n      <td>Matches instances that have eng language</td>\n  </tr>\n  <tr>\n\
          \      <td>metadata.createdDate</td>\n      <td>term</td>\n      <td>metadata.createdDate &gt; &quot;2021-03-01T00:00:00.000+00:00&quot;\n      </td>\n      <td>Matches instances that were created after 2020-12-12</td>\n  </tr>\n  <tr>\n      <td>metadata.updatedDate</td>\n      <td>term</td>\n      <td>metadata.updatedDate &gt; &quot;2020-12-12&quot;</td>\n      <td>Matches instances that were updated after 2020-12-12</td>\n  </tr>\n  <tr>\n      <td>modeOfIssuanceId</td>\n      <td>term</td>\n      <td>modeOfIssuanceId==&quot;123&quot;</td>\n      <td>Matches instances that have 123 mode of issuance</td>\n  </tr>\n  <tr>\n      <td>natureOfContentTermIds</td>\n      <td>term</td>\n      <td>natureOfContentTermIds==&quot;123&quot;</td>\n      <td>Matches instances that have 123 nature of content</td>\n  </tr>\n  <tr>\n      <td>publisher</td>\n      <td>full-text</td>\n      <td>publisher all &quot;Publisher of Ukraine&quot;</td>\n      <td>Matches instances that have Publisher\
