                  type: string
                  readonly: true
                  $ref: '#/components/schemas/uuid'
                group:
                  description: The unique name of the patrongroup
                  type: string
                  readonly: true
                desc:
                  description: A description of the patrongroup
                  type: string
                  readonly: true
