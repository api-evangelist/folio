          type: string
        natureOfContentTermIds:
          description: Array of UUID for the Instance nature of content (e.g. bibliography, biography, exhibition catalogue, festschrift, newspaper, proceedings, research report, thesis or website)
          type: array
          items:
            description: Single UUID for the Instance nature of content
            type: string
        publication:
          description: List of publication items
          type: array
          items:
            $ref: '#/components/schemas/publication'
        staffSuppress:
          description: Records the fact that the record should not be displayed for others than catalogers
          type: boolean
        discoverySuppress:
          description: Records the fact that the record should not be displayed in a discovery system
          type: boolean
        isBoundWith:
          description: Indicates if this instance is included in a bound-with
          type: boolean
        tags:
          $ref: '#/components/schemas/tags-2'
        classifications:
          type: array
          description: List of classifications
          items:
            $ref: '#/components/schemas/classification'
        electronicAccess:
          description: List of electronic access items
          type: array
          items:
            $ref: '#/components/schemas/electronicAccess'
        notes:
          description: Bibliographic notes (e.g. general notes, specialized notes), and administrative notes
          type: array
          items:
            $ref: '#/components/schemas/note'
        items:
          description: List of instance items
          type: array
          items:
            $ref: '#/components/schemas/searchItem'
        holdings:
          description: List of instance holding records
          type: array
          items:
            $ref: '#/components/schemas/searchHolding'
    timePeriod:
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      description: schema for time-period, which contains time interval 'duration' and the time unit
      properties:
        duration:
          type: integer
          description: Duration interval
        intervalId:
          type: string
          description: Unit of time for the duration
          enum:
          - Minutes
          - Hours
          - Days
          - Weeks
          - Months
          default: Days
    cancellation-reason:
      $schema: http://json-schema.org/draft-04/schema#
      description: Cancellation reason
      type: object
      properties:
        id:
          type: string
          description: Id of the cancellation reason record
        name:
          type: string
          description: Name of the cancellation reason
        description:
          type: string
          description: Description of the cancellation reason
        publicDescription:
          type: string
          description: Public description of the cancellation reason
        requiresAdditionalInformation:
          type: boolean
          description: Indicates if additional information is required when this reason is used
        source:
          type: string
          description: Origin of the cancellation reason record, e.g. 'System', 'User', 'Consortium' etc.
        metadata:
          type: object
          $ref: '#/components/schemas/metadata'
          readonly: true
      additionalProperties: false
      required:
      - name
    requests-batch-update:
      $schema: http://json-schema.org/draft-04/schema#
      title: Requests batch update
      description: List of ids reordered requests
      type: object
      properties:
        instanceId:
          description: Instance ID of reordered requests
          type: string
          $ref: '#/components/schemas/uuid-2'
        itemId:
          description: Item ID of reordered requests
          type: string
          $ref: '#/components/schemas/uuid-2'
        requestLevel:
          description: Level of the request - Item or Title
          type: string
          enum:
          - Item
          - Title
        requestIds:
          description: Array of requests ids
          type: array
          items:
            type: string
            $ref: '#/components/schemas/uuid-2'
      additionalProperties: false
      required:
      - requestLevel
    reorder-queue:
      $schema: http://json-schema.org/draft-04/schema#
      title: Reordered queue
      description: New positions for all requests in the queue
      type: object
      properties:
        reorderedQueue:
          type: array
          description: All request from the item queue and their's new positions in the queue.
          items:
            description: Reorder request
            type: object
            properties:
              id:
                description: Request id
                type: string
                $ref: '#/components/schemas/uuid-2'
              newPosition:
                description: New position for the request
                type: integer
                minimum: 1
            additionalProperties: false
            required:
            - id
            - newPosition
      additionalProperties: false
      required:
      - reorderedQueue
    CirculationItemStatus:
      type: object
      description: status of the Item
      properties:
        name:
          type: string
          enum:
          - Aged to lost
          - Available
          - Awaiting delivery
          - Awaiting pickup
          - Checked out
          - Claimed returned
          - Declared lost
          - Lost and paid
          - Long missing
          - Missing
          - In process
          - In process (non-requestable)
          - In transit
          - Intellectual item
          - On order
          - Order closed
          - Paged
          - Restricted
          - Unavailable
          - Unknown
          - Withdrawn
        date:
          description: Date of the current item state. E.g. date set when item state was changed by the Check out app
          type: string
          format: date-time
    CirculationItem:
      type: object
      description: CirculationItem
      properties:
        id:
          type: string
          format: uuid
        holdingsRecordId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CirculationItemStatus'
        dcbItem:
          type: boolean
        materialTypeId:
          type: string
        permanentLoanTypeId:
          type: string
        instanceTitle:
          type: string
        barcode:
          type: string
        pickupLocation:
          type: string
        effectiveLocationId:
          type: string
        lendingLibraryCode:
          type: string
      additionalProperties: false
  parameters:
    requestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ecs-tlr:
      description: ECS TLR object
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EcsTlr'
    badRequestResponse:
      description: Validation errors
      content:
        application/json:
          example:
            errors:
            - message: Request is invalid
            total_records: 1
          schema:
            $ref: '#/components/schemas/errors'
    notFoundResponse:
      description: Not found
      content:
        application/json:
          example:
            errors:
            - message: Request not found
            total_records: 1
          schema:
            $ref: '#/components/schemas/errors'
    internalServerErrorResponse:
      description: When unhandled exception occurred during code execution, e.g. NullPointerException
      content:
        application/json:
          example:
            errors:
            - message: Unexpected error
            total_records: 1
          schema:
            $ref: '#/components/schemas/errors'
