        required: false
        schema:
          $ref: '#/components/schemas/sortOrder'
      - description: X-Okapi-Tenant header value
        in: header
        name: x-okapi-tenant
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                consortiumItemCollection:
