openapi: 3.2.0
info:
  contact:
    name: Spitfire team
  description: 'API for searching, browsing, and managing facets for various record types, including instances, holdings, and authorities.

    It also provides endpoints for configuring search and browse features, as well as managing the search index.'
  title: Search Consortium API
  version: v4.1.0
servers:
- description: Development environments.
  url: https://{environment}-okapi.ci.folio.org
  variables:
    environment:
      default: folio-dev-spitfire
      enum:
      - folio-dev-spitfire
      - folio-perf-spitfire
- description: Reference environments.
  url: https://folio-{environment}-okapi.dev.folio.org
  variables:
    environment:
      default: snapshot
      enum:
      - snapshot
      - snapshot-2
tags:
- description: Provides endpoints to search for consolidated records (e.g., holdings, items) across multiple institutions or libraries within a consortium.
  name: search-consortium
paths:
  /search/consortium/holdings:
    get:
      description: Get a list of holdings (only for consortium environment)
      operationId: getConsortiumHoldings
      parameters:
      - description: UUID of the instance
        in: query
        name: instanceId
        required: false
        schema:
          type: string
      - description: Tenant ID to filter by
        in: query
        name: tenantId
        required: false
        schema:
          type: string
      - description: Limit the number of elements returned in the response.
        in: query
        name: limit
        schema:
          default: 100
          maximum: 1000
          minimum: 0
          type: integer
      - description: Skip over a number of elements by specifying an offset value for the query.
        in: query
        name: offset
        schema:
          default: 0
          maximum: 9999
          minimum: 0
          type: integer
      - description: "Defines a field to sort by.\nPossible values:\n  - id\n  - hrid\n  - tenantId\n  - instanceId\n  - callNumberPrefix\n  - callNumber\n  - copyNumber\n  - permanentLocationId\n"
        in: query
        name: sortBy
        required: false
        schema:
          type: string
      - description: Defines sorting order
        in: query
        name: sortOrder
        required: false
        schema:
          $ref: '#/components/schemas/sortOrder'
      - description: X-Okapi-Tenant header value
        in: header
        name: x-okapi-tenant
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              examples:
                consortiumHoldingsCollectionResponse:
                  $ref: '#/components/examples/consortiumHoldingsCollectionResponse'
              schema:
                $ref: '#/components/schemas/consortiumHoldingCollection'
          description: List of holdings
        '400':
          content:
            application/json:
              examples:
                validationErrorResponse:
                  $ref: '#/components/examples/validationErrorResponse'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: Validation errors
        '500':
          content:
            application/json:
              examples:
                unknownError:
                  $ref: '#/components/examples/unknownError'
              schema:
                $ref: '#/components/schemas/errorResponse'
          description: When unhandled exception occurred during code execution, e.g. NullPointerException.
      summary: Get Consolidated Holdings
      tags:
      - search-consortium
  /search/consortium/items:
    get:
      description: Get a list of items (only for consortium environment)
      operationId: getConsortiumItems
      parameters:
      - description: UUID of the instance
        in: query
        name: instanceId
        required: false
        schema:
          type: string
      - description: UUID of the holdings record
