components:
  schemas:
    consortiumLibraryCollection:
      example:
        libraries:
        - id: id
          tenantId: tenantId
          name: name
          campusId: campusId
          code: code
          metadata:
            createdDate: createdDate
            createdByUserId: createdByUserId
            updatedDate: updatedDate
            updatedByUserId: updatedByUserId
        - id: id
          tenantId: tenantId
          name: name
          campusId: campusId
          code: code
          metadata:
            createdDate: createdDate
            createdByUserId: createdByUserId
            updatedDate: updatedDate
            updatedByUserId: updatedByUserId
        totalRecords: 0
      properties:
        libraries:
          items:
            $ref: '#/components/schemas/consortiumLibrary'
          type: array
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
        totalRecords:
          type: integer
      type: object
    batchIdsDto:
      description: Batch IDs DTO
      properties:
        identifierType:
          description: Type of entity identifier
          enum:
          - id
          - hrid
          - accessionNumber
          - formerIds
          - barcode
          - holdingsRecordId
          - instanceId
          - instanceHrid
          - itemBarcode
          type: string
        identifierValues:
          description: Entity identifier values
          items:
            type: string
          type: array
      required:
      - identifierType
      - identifierValues
      type: object
    consortiumInstitutionCollection:
      example:
        institutions:
        - id: id
          tenantId: tenantId
          name: name
          code: code
          metadata:
            createdDate: createdDate
            createdByUserId: createdByUserId
            updatedDate: updatedDate
            updatedByUserId: updatedByUserId
        - id: id
          tenantId: tenantId
          name: name
          code: code
          metadata:
            createdDate: createdDate
            createdByUserId: createdByUserId
            updatedDate: updatedDate
            updatedByUserId: updatedByUserId
        totalRecords: 0
      properties:
        institutions:
          items:
            $ref: '#/components/schemas/consortiumInstitution'
          type: array
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
        totalRecords:
          type: integer
      type: object
    consortiumItemCollection:
      example:
        items:
        - id: id
          hrid: hrid
          tenantId: tenantId
          instanceId: instanceId
          holdingsRecordId: holdingsRecordId
          barcode: barcode
        - id: id
          hrid: hrid
          tenantId: tenantId
          instanceId: instanceId
          holdingsRecordId: holdingsRecordId
          barcode: barcode
        totalRecords: 0
      properties:
        items:
          items:
            $ref: '#/components/schemas/consortiumItem'
          type: array
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
        totalRecords:
          type: integer
      type: object
    sortOrder:
      enum:
      - asc
      - desc
      type: string
    consortiumItem:
      example:
        id: id
        hrid: hrid
        tenantId: tenantId
        instanceId: instanceId
        holdingsRecordId: holdingsRecordId
        barcode: barcode
      properties:
        id:
          description: Item ID
          type: string
        hrid:
          description: Item HRID
          type: string
        tenantId:
          description: Tenant ID of the Item
          type: string
        instanceId:
          description: Related Instance Id
          type: string
        holdingsRecordId:
          description: Related Holding Record Id
          type: string
        barcode:
          description: Item barcode
          type: string
      type: object
    parameter:
      description: List of key/value parameters of an error
      example:
        key: source
        value: 'null'
      properties:
        key:
          description: Parameter key
          type: string
        value:
          description: Parameter value
          type: string
      type: object
    consortiumLocation:
      example:
        id: id
        name: name
        tenantId: tenantId
        code: code
        description: description
        discoveryDisplayName: discoveryDisplayName
        isActive: isActive
        institutionId: institutionId
        campusId: campusId
        libraryId: libraryId
        primaryServicePoint: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        servicePointIds:
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        metadata:
          createdDate: createdDate
          createdByUserId: createdByUserId
          updatedDate: updatedDate
          updatedByUserId: updatedByUserId
      properties:
        id:
          description: Location ID
          type: string
        name:
          description: Location name
          type: string
        tenantId:
          description: Tenant ID of the Location
          type: string
        code:
          description: Code of the (shelf) location, usually an abbreviation of the name.
          type: string
        description:
          description: Description of the (shelf) location.
          type: string
        discoveryDisplayName:
          description: Name of the (shelf) location to be shown in the discovery.
          type: string
        isActive:
          description: Whether this (shelf) location is active. Inactive (shelf) locations can no longer been used.
          type: string
        institutionId:
          description: The UUID of the institution, the first-level location unit, this (shelf) location belongs to.
          type: string
        campusId:
          description: The UUID of the campus, the second-level location unit, this (shelf) location belongs to.
          type: string
        libraryId:
          description: The UUID of the library, the third-level location unit, this (shelf) location belongs to.
          type: string
        primaryServicePoint:
          description: The UUID of the primary service point of this (shelf) location.
          format: uuid
          type: string
        servicePointIds:
          description: All service points that this (shelf) location has.
          items:
            format: uuid
            type: string
          type: array
        metadata:
          $ref: '#/components/schemas/metadata'
      type: object
    error:
      description: An error
      properties:
        message:
          description: Error message text
          type: string
        type:
          description: Error message type
          type: string
        code:
          description: Error message code
          type: string
        parameters:
          items:
            $ref: '#/components/schemas/parameter'
          type: array
      type: object
    errorResponse:
      description: A set of errors
      example:
        errors:
        - message: Illegal argument error
          type: IllegalArgumentException
          code: unknown_error
        total_records: 1
      properties:
        errors:
          description: List of errors
          items:
