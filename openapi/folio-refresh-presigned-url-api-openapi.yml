openapi: 3.2.0
info:
  title: Refresh Presigned Url API
  version: v1
tags:
- name: Refresh Presigned Url
paths:
  /refresh-presigned-url:
    get:
      description: Get presigned Url for export file
      operationId: getRefreshedPresignedUrl
      parameters:
      - in: query
        name: filePath
        required: true
        description: Path to exported file
        schema:
          type: string
      responses:
        '200':
          description: Presigned Url for download
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PresignedUrl'
      tags:
      - Refresh Presigned Url
      summary: Get refreshed presigned url
      x-summary-source: derived
components:
  schemas:
    PresignedUrl:
      type: object
      properties:
        url:
          type: string
          description: Presigned Url for download
      required:
      - url
