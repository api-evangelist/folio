          description: List of authority heading types
          items:
            $ref: '#/components/schemas/authorityHeadingTypeDto'
          type: array
        totalRecords:
          description: Total amount of records
          type: integer
      required:
      - headingTypes
      - totalRecords
      type: object
    error_parameters_inner:
      properties:
