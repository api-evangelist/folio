      - name
      type: object
    authorityHeadingTypeDtoCollection:
      description: A collection of authority heading types
      example:
        headingTypes:
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: name
          code: code
          queryable: true
        - id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: name
          code: code
          queryable: true
        totalRecords: 0
      properties:
