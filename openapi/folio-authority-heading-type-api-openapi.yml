info:
  title: Folio Authority Heading Type API
  version: v1.0
  description: 'Operations tagged authority-heading-type across 2 of this provider''s published API definitions: folio-mod-entities-links-openapi.json, folio-mod-entities-links-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8081
tags:
- name: authority-heading-type
paths:
  /authority-heading-types:
    get:
      operationId: retrieveAuthorityHeadingTypes
      parameters:
      - description: Skip over a number of elements by specifying an offset value for the query.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          maximum: 2147483647
          minimum: 0
          type: integer
      - description: Limit the number of elements returned in the response.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 2000
          minimum: 1
          type: integer
      - description: A query expressed as a CQL string (see [dev.folio.org/reference/glossary#cql](https://dev.folio.org/reference/glossary#cql)) using valid searchable fields. The first example below shows the general form of a full CQL query, but those fields might not be relevant in this context.
        in: query
        name: query
        required: false
        schema:
          default: cql.allRecords=1
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authorityHeadingTypeDtoCollection'
          description: Returns a list of authority heading types
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation errors.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Internal server error.
      tags:
      - authority-heading-type
      summary: Retrieve authority heading types
      x-summary-source: derived
    servers:
    - url: https://localhost:8081
components:
