openapi: 3.2.0
info:
  title: Folio Requests API
  version: v1
  description: 'Operations tagged Requests across 2 of this provider''s published API definitions: folio-edge-caiasoft-openapi.json, folio-edge-caiasoft-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /caiasoftService/
tags:
- name: Requests
paths:
  /Requests/{requestId}/route/{remoteStorageConfigurationId}:
    post:
      responses:
        '200':
          description: Success check-in by requestId and remoteStorageConfigurationId
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: Internal server error
      operationId: checkInByHoldId
      parameters:
      - $ref: '#/components/parameters/request-id'
      - $ref: '#/components/parameters/remote-storage-id'
      - $ref: '#/components/parameters/x-okapi-token'
      - $ref: '#/components/parameters/x-okapi-tenant'
      tags:
      - Requests
      summary: Check in by hold id
      x-summary-source: derived
    servers:
    - url: /caiasoftService/
components:
  parameters:
    remote-storage-id:
      name: remoteStorageConfigurationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/uuid'
    x-okapi-token:
      name: x-okapi-token
      in: header
      required: true
      schema:
        type: string
    x-okapi-tenant:
      name: x-okapi-tenant
      in: header
      required: true
      schema:
        type: string
    request-id:
      name: requestId
      in: path
      required: true
      schema:
        type: string
  schemas:
    uuid:
      $schema: http://json-schema.org/draft-04/schema#
      description: Regexp pattern for UUID validation
      type: string
      pattern: ^[a-fA-F0-9]{8}-[a-fA-F0-9]{4}-[1-5][a-fA-F0-9]{3}-[89abAB][a-fA-F0-9]{3}-[a-fA-F0-9]{12}$
x-refined-from:
- folio-edge-caiasoft-openapi.json
- folio-edge-caiasoft-openapi.yml
