  /erm/jobs/{jobId}/downloadFileObject:
    parameters:
    - $ref: '#/components/parameters/x-okapi-tenant'
    - $ref: '#/components/parameters/jobId'
    get:
      tags:
      - Jobs
      summary: Download the file object attached to a specified job
      operationId: getJobFileObject
      description: Only meaningful for comparison jobs -- the underlying implementation looks up the record as a ComparisonJob regardless of the job's actual type, so ids for other job types will return a 404. Only available once the job has ended; returns a 405 otherwise
      responses:
        '200':
          description: OK
          content:
            text/json:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request error
        '403':
          description: Forbidden
        '404':
          description: Not found error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
        '405':
          description: Method not allowed - this job has not yet ended
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrailsErrorResponse'
      security:
      - accessToken: []
      - okapiToken: []
    servers:
    - url: https://folio-snapshot-okapi.dev.folio.org
    - url: https://folio-snapshot-2-okapi.dev.folio.org
    - url: https://folio-etesting-snapshot-kong.ci.folio.org
  /jobs:
    get:
      description: Get jobs fy filter
      operationId: getJobs
      parameters:
      - $ref: '#/components/parameters/trait_pageable_offset'
      - $ref: '#/components/parameters/trait_pageable_limit'
      - $ref: '#/components/parameters/trait_queryable_query'
      responses:
        '200':
          description: Jobs successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCollection'
        '400':
          description: Bad request, e.g. malformed request body or query parameter. Details of the errors (e.g. name of the parameter or line/character number with malformed data) provided in the response.
          content:
            application/json:
              example:
                value:
                  $ref: ../../../../folio-export-common/examples/errors.sample
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              example:
                value:
                  $ref: ../../../../folio-export-common/examples/errors.sample
              schema:
                $ref: '#/components/schemas/Errors'
      tags:
      - Jobs
      summary: Get jobs
      x-summary-source: derived
    post:
      description: Create or update a job
      operationId: upsertJob
      parameters:
      - name: X-Okapi-Tenant
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Job updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '201':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                value:
                  $ref: ../../../../folio-export-common/examples/errors.sample
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              example:
                value:
                  $ref: ../../../../folio-export-common/examples/errors.sample
              schema:
                $ref: '#/components/schemas/Errors'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
        required: true
      tags:
      - Jobs
      summary: Upsert job
      x-summary-source: derived
    servers:
    - url: /data-export-spring/
  /jobs/{id}:
    get:
      description: Get a job by the job ID
      operationId: getJobById
      parameters:
      - name: id
        in: path
        required: true
        description: UUID of the job
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Job successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Bad request, e.g. malformed request body or query parameter. Details of the errors (e.g. name of the parameter or line/character number with malformed data) provided in the response.
          content:
            application/json:
              example:
                value:
                  $ref: ../../../../folio-export-common/examples/errors.sample
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: Job with a given ID not found
          content:
            application/json:
              example:
                value:
                  $ref: ../../../../folio-export-common/examples/errors.sample
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              example:
                value:
                  $ref: ../../../../folio-export-common/examples/errors.sample
              schema:
                $ref: '#/components/schemas/Errors'
      tags:
      - Jobs
      summary: Get job by id
      x-summary-source: derived
    servers:
    - url: /data-export-spring/
  /jobs/{id}/resend:
    post:
      description: resend exported file by the job ID
      operationId: resendExportedFile
      parameters:
      - name: id
        in: path
        required: true
        description: UUID of the job
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        '201':
          description: Resend job created
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                value:
                  $ref: ../../../../folio-export-common/examples/errors.sample
              schema:
                $ref: '#/components/schemas/Errors'
        '404':
          description: ExportFile with a given Job ID not found
          content:
            application/json:
              example:
                value:
                  $ref: ../../../../folio-export-common/examples/errors.sample
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal server errors
          content:
            application/json:
              example:
                value:
                  $ref: ../../../../folio-export-common/examples/errors.sample
              schema:
                $ref: '#/components/schemas/Errors'
      tags:
      - Jobs
      summary: Resend exported file
      x-summary-source: derived
    servers:
    - url: /data-export-spring/
  /jobs/{id}/download:
    get:
      description: Download exported file by the job ID
      operationId: downloadExportedFileByJobId
      parameters:
      - name: id
        in: path
        required: true
        description: UUID of the job
        schema:
          $ref: '#/components/schemas/UUID'
      - name: key
        in: query
        required: false
        description: Key of the file in storage to be downloaded
        schema:
          type: string
      responses:
        '200':
          description: Export file successfully retrieved
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
      tags:
      - Jobs
      summary: Download exported file by job id
      x-summary-source: derived
    servers:
    - url: /data-export-spring/
  /jobs/send:
    post:
      description: Send job via Kafka
      operationId: sendJob
      responses:
        '200':
          description: Job was sent
        '400':
          description: Bad Request
          content:
            application/json:
              example:
                value:
                  $ref: ../../../../folio-export-common/examples/errors.sample
              schema:
                $ref: '#/components/schemas/Errors'
        '500':
          description: Internal server errors, e.g. due to misconfiguration
          content:
            application/json:
              example:
                value:
                  $ref: ../../../../folio-export-common/examples/errors.sample
              schema:
                $ref: '#/components/schemas/Errors'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
        required: true
      tags:
      - Jobs
      summary: Send job
      x-summary-source: derived
    servers:
    - url: /data-export-spring/
components:
  schemas:
    PersistentJobResultsArray:
      type: array
      items:
        $ref: '#/components/schemas/PersistentJob'
    LogEntryResults:
      type: object
      required:
      - results
      allOf:
      - $ref: '#/components/schemas/ResultsMeta'
      - type: object
      - properties:
          results:
            $ref: '#/components/schemas/LogEntryResultsArray'
    ResultsMeta:
      type: object
      properties:
        meta:
          type: object
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
        totalRecords:
          type: integer
    PersistentJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        class:
          type: string
          description: Fully-qualified class name identifying the concrete job type
          enum:
          - org.olf.general.jobs.ComparisonJob
          - org.olf.general.jobs.CoverageRegenerationJob
          - org.olf.general.jobs.PackageImportJob
          - org.olf.general.jobs.KbartImportJob
          - org.olf.general.jobs.PackageIngestJob
          - org.olf.general.jobs.SupplementaryDocumentsCleaningJob
          - org.olf.general.jobs.ExternalEntitlementSyncJob
          - org.olf.general.jobs.PackageTriggerResyncJob
          - org.olf.general.jobs.TitleIngestJob
          - org.olf.general.jobs.ResourceDeletionJob
          - org.olf.general.jobs.EHoldingsEntitlementSyncJob
          - org.olf.general.jobs.IdentifierReassignmentJob
        name:
          type: string
        runnerId:
          description: Only present for comparison jobs (class ComparisonJob)
          type: string
        dateCreated:
          type: integer
        started:
          description: Null until the job begins running
          type:
          - integer
          - 'null'
        ended:
          description: Null until the job finishes
          type:
          - integer
          - 'null'
        status:
          oneOf:
          - type: string
          - $ref: '#/components/schemas/Refdata'
        result:
          description: Null until the job finishes
          oneOf:
          - type: string
          - $ref: '#/components/schemas/Refdata'
          - type: 'null'
        fileUpload:
          description: Present only for job types that accept a file upload (e.g. packageImport, kbartImport)
          oneOf:
          - $ref: '#/components/schemas/File'
          - type: 'null'
        fullLogCount:
          type: integer
        errorLogCount:
          type: integer
        infoLogCount:
          type: integer
        comparisonPoints:
          description: Only present for comparison jobs (class ComparisonJob)
          type: array
          items:
            $ref: '#/components/schemas/ComparisonPoint'
    LogEntryResultsArray:
      type: array
      items:
        $ref: '#/components/schemas/LogEntry'
    File:
      type: object
      required:
      - id
      - name
      - size
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        contentType:
          type: string
          description: MIME type of the uploaded file
        modified:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          description: Original filename of the uploaded file
        size:
          type: integer
          description: Size of the uploaded file in bytes
    HttpError:
      type: object
      properties:
        message:
          type: string
        error:
          type: integer
    ComparisonPoint:
      type: object
      properties:
        titleList:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
    ApplicationError:
      type: object
      properties:
        total:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              i18n_code:
                type: string
              message:
                type: string
              object:
                type: string
    GrailsErrorResponse:
      type: object
      description: Error-handler body for an uncaught exception raised during request processing. `exception` and `stackTrace` usually suppressed in production systems
      required:
      - error
      - timestamp
      - message
      properties:
        error:
          type: integer
          description: HTTP status code
        timestamp:
          type: string
          format: date-time
        message:
          type: string
        exception:
          type: string
          description: Exception class and message.
        stackTrace:
          type: array
          items:
            type: string
    CreatePackageImportJobBody:
      type: object
      description: Used for jobType packageImport. Requires either fileUpload or payload to supply the package file
      properties:
        name:
          description: Derived from the uploaded file's name if omitted
          type: string
        fileUpload:
          description: Reference to a file already uploaded via /erm/files
          type: object
          properties:
            id:
              type: string
              format: uuid
        payload:
          description: Raw JSON payload. If provided without fileUpload, it is automatically wrapped into a file server-side
          type: object
        fileTitle:
          description: Optional file name to use when payload is supplied instead of fileUpload
          type: string
    Refdata:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: string
    ComparisonJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        class:
          type: string
          enum:
          - org.olf.general.jobs.ComparisonJob
        name:
          type: string
        runnerId:
          type: string
        dateCreated:
          type: integer
        started:
          description: Null until the job begins running
          type:
          - string
          - 'null'
          format: date-time
        ended:
          description: Null until the job finishes
          type:
          - string
          - 'null'
          format: date-time
        status:
          oneOf:
          - type: string
          - $ref: '#/components/schemas/Refdata'
        result:
          description: Null until the job finishes
          oneOf:
          - type: string
          - $ref: '#/components/schemas/Refdata'
          - type: 'null'
        fileUpload:
          oneOf:
          - $ref: '#/components/schemas/File'
          - type: 'null'
        fullLogCount:
          type: integer
        errorLogCount:
          type: integer
        infoLogCount:
          type: integer
        comparisonPoints:
          type: array
          items:
            $ref: '#/components/schemas/ComparisonPoint'
    CreateComparisonJobBody:
      type: object
      description: Used for jobType comparison
      required:
      - name
      - comparisonPoints
      properties:
        name:
          type: string
        comparisonPoints:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/ComparisonPoint'
    CreateKbartImportJobBody:
      type: object
      description: Used for jobType kbartImport. Requires either fileUpload or payload to supply the KBART file, plus package identification fields
      required:
      - packageName
      - packageSource
      - packageReference
      properties:
        name:
          description: Derived from the uploaded file's name if omitted
          type: string
        fileUpload:
          description: Reference to a file already uploaded via /erm/files
          type: object
          properties:
            id:
              type: string
              format: uuid
        payload:
          description: Raw JSON payload. If provided without fileUpload, it is automatically wrapped into a file server-side
          type: object
        fileTitle:
          description: Optional file name to use when payload is supplied instead of fileUpload
          type: string
        packageName:
          type: string
        packageSource:
          type: string
        packageReference:
          type: string
        packageProvider:
          type: string
        trustedSourceTI:
          type: boolean
    LogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        message:
          type: string
        dateCreated:
          type: integer
        origin:
          type: string
          format: uuid
        type:
          type: string
        additionalInfo:
          type: object
          properties:
            jobId:
              type: string
              format: uuid
            tenant:
              type: string
            tenantId:
              type: string
    PersistentJobResults:
      type: object
      required:
      - results
      allOf:
      - $ref: '#/components/schemas/ResultsMeta'
      - type: object
      - properties:
          results:
            $ref: '#/components/schemas/PersistentJobResultsArray'
    CreateSimpleJobBody:
      type: object
      description: Used for jobType values coverageRegeneration, packageIngest, and supplementaryDocumentsCleaning -- these job types take no extra input beyond a name
      required:
      - name
      properties:
        name:
          type: string
    bursarExportTransferCriteria:
      description: Transfer criteria
      type: object
      properties:
        conditions:
          description: Conditions to apply to the transfer of fees/fines
          type: array
          items:
            type: object
            properties:
              condition:
                description: Condition to apply tp this item
                $ref: '#/components/schemas/bursarExportFilter'
              account:
                description: Account to transfer fees/fines that meet this condition to
                type: string
                format: uuid
            additionalProperties: false
            required:
            - condition
            - account
        else:
          type: object
          description: If none of the specified conditions is met
          properties:
            account:
              description: Account to transfer fees/fines that do not meet any specified conditions to
              type: string
              format: uuid
          additionalProperties: false
          required:
          - account
      additionalProperties: false
      required:
      - conditions
      - else
    bursarExportJob:
      description: Bursar export job schema
      type: object
      properties:
        filter:
          description: Filter to use for the regular export
          $ref: '#/components/schemas/bursarExportFilter'
        groupByPatron:
          description: Choose whether to group fee/fines by patron
          type: boolean
        groupByPatronFilter:
          description: Filter to use for the export when grouping by patron
          $ref: '#/components/schemas/bursarExportFilterAggregate'
        header:
          description: Header format for the export file
          type: array
          items:
            $ref: '#/components/schemas/bursarExportHeaderFooterToken'
        data:
          description: Data format for the export file
          type: array
          items:
            $ref: '#/components/schemas/bursarExportDataToken'
        footer:
          description: Footer format for the export file
          type: array
          items:
            $ref: '#/components/schemas/bursarExportHeaderFooterToken'
        transferInfo:
          description: Transfer information for the export
          $ref: '#/components/schemas/bursarExportTransferCriteria'
      additionalProperties: false
      required:
      - filter
      - groupByPatron
      - header
      - data
      - footer
      - transferInfo
    Errors:
      type: object
      properties:
        errors:
          description: List of errors
          type: array
          items:
            type: object
            $ref: '#/components/schemas/Error'
        total_error_records:
          description: Total number of errors
          type: integer
        total_warning_records:
          description: Total number of warnings
          type: integer
      additionalProperties: false
    Metadata:
      type: object
      title: Metadata Schema
      properties:
        createdDate:
          description: Date and time when the record was created
          type: string
          format: date-time
        createdByUserId:
          description: ID of the user who created the record (when available)
          type: string
          format: uuid
        createdByUsername:
          description: Username of the user who created the record (when available)
          type: string
          maxLength: 50
        updatedDate:
          description: Date and time when the record was last updated
          type: string
          format: date-time
        updatedByUserId:
          description: ID of the user who last updated the record (when available)
          type: string
          format: uuid
        updatedByUsername:
          description: Username of the user who last updated the record (when available)
          type: string
          maxLength: 50
      additionalProperties: false
    bursarExportFilterFeeFineOwner:
      description: Filter by fee fine owner
      type: object
      properties:
        type:
          description: Type of filter
          type: string
          default: FeeFineOwner
        feeFineOwner:
          description: Id of fee/fine owner to filter by
          type: string
          format: uuid
      additionalProperties: false
      required:
      - type
      - feeFineOwner
    AuthorityControlExportConfig:
      type: object
      properties:
        fromDate:
          description: Report date range start
          type: string
          format: date
        toDate:
          description: Report date range end
          type: string
          format: date
      required:
      - fromDate
      - toDate
    bursarExportFilterFeeType:
      description: Filter by fee type
      type: object
      properties:
        type:
          description: Type of filter
          type: string
          default: FeeType
        feeFineTypeId:
          description: Id of fee/fine type to filter by
          type: string
          format: uuid
      additionalProperties: false
      required:
      - type
      - feeFineTypeId
    bursarExportFilterLocation:
      description: Filter by location
      type: object
      properties:
        type:
          description: Type of filter
          type: string
          default: Location
        locationId:
          description: Id of location to filter by
          type: string
          format: uuid
      additionalProperties: false
      required:
      - type
      - locationId
    bursarExportFilterPass:
      description: Filter that is always true
      type: object
      properties:
        type:
          description: Type of filter
          type: string
          default: Pass
      additionalProperties: false
      required:
      - type
    bursarExportFilterAge:
      description: Filter by fees within certain days range
      type: object
      properties:
        type:
          description: Type of filter
          type: string
          default: Age
        numDays:
          description: Number of days
          type: integer
          minimum: 1
        condition:
          description: Condition to get days range
          type: string
          enum:
          - LESS_THAN_EQUAL
          - LESS_THAN
          - GREATER_THAN
          - GREATER_THAN_EQUAL
      additionalProperties: false
      required:
      - type
      - numDays
      - condition
    ScheduleParameters:
      type: object
      properties:
        id:
          description: Schedule unique identifier
          type: string
          format: uuid
        scheduleFrequency:
          type: integer
          description: Number of time periods
        schedulePeriod:
          type: string
          description: Time period for repeating job
          enum:
          - MONTH
          - WEEK
          - DAY
          - HOUR
          - EXACT_DATE
          - NONE
        schedulingDate:
          description: The date (MM/DD/YYYY) for this job to start running
          format: date-time
          type: string
        scheduleTime:
          type: string
          description: Time to run the job
        scheduleDay:
          type: integer
          description: Day of month to run the job (One-based)
        weekDays:
          type: array
          description: Day of week to run the job
          items:
            type: string
            description: Day of week
            enum:
            - MONDAY
            - TUESDAY
            - WEDNESDAY
            - THURSDAY
            - FRIDAY
            - SATURDAY
            - SUNDAY
        timeZone:
          type: string
          description: Schedule time zone
          default: UTC
    EHoldingsExportConfig:
      type: object
      properties:
        recordId:
          description: Unique identifier of package - combination of providerId-packageId
          example: 91525-1152699-659590
          type: string
        recordType:
          type: string
          description: The record type
          enum:
          - PACKAGE
          - RESOURCE
        titleSearchFilters:
          description: The filters needed to filter package titles
          example: filter[name]=title&sort=name
          type: string
        packageFields:
          description: The list of package fields for export
          type: array
          items:
            type: string
        titleFields:
          description: The list of title fields for export
          type: array
          items:
            type: string
      required:
      - recordId
      - recordType
    EdiConfig:
      type: object
      properties:
        accountNoList:
          description: The list of account numbers of the vendor
          type: array
          items:
            type: string
        defaultAcquisitionMethods:
          description: Default acquisition methods for the accounts
          type: array
          items:
            description: UUID of the acquisition method
            type: string
            format: uuid
        ediNamingConvention:
          description: The naming convention for this EDI
          type: string
        libEdiCode:
          description: The library code for this EDI
          type: string
        libEdiType:
          description: The library type for this EDI
          type: string
          enum:
          - 014/EAN
          - 31B/US-SAN
          - 091/Vendor-assigned
          - 092/Customer-assigned
        vendorEdiCode:
          description: The library code for this EDI
          type: string
        vendorEdiType:
          description: The library type for this EDI
          type: string
          enum:
          - 014/EAN
          - 31B/US-SAN
          - 091/Vendor-assigned
          - 092/Customer-assigned
        notes:
          description: The notes for this EDI
          type: string
        sendAccountNumber:
          description: If true then send account number
          type: boolean
          default: false
        supportOrder:
          description: If true then order support
          type: boolean
          default: false
        supportInvoice:
          description: If true then invoice support
          type: boolean
          default: false
    bursarExportTokenUserDataOptional:
      description: Token to represent optional user data
      type: object
      properties:
        type:
          description: Type of data token
          type: string
          default: UserDataOptional
        value:
          description: Optional user data to represent
          type: string
          enum:
          - BARCODE
          - USERNAME
          - FIRST_NAME
          - MIDDLE_NAME
          - LAST_NAME
          - PATRON_GROUP_ID
          - EXTERNAL_SYSTEM_ID
        placeholder:
          description: Placeholder text to display when no value is present
          type: string
        lengthControl:
          description: Control length of token
          $ref: '#/components/schemas/bursarExportTokenLengthControl'
      additionalProperties: false
      required:
      - type
      - value
      - placeholder
    ExportTypeSpecificParameters:
      type: object
      properties:
        bursarFeeFines:
          $ref: '#/components/schemas/bursarExportJob'
        vendorEdiOrdersExportConfig:
          $ref: '#/components/schemas/VendorEdiOrdersExportConfig'
        query:
          description: CQL query to be passed to the module which data is being exported. Use it to filter data.
          type: string
          maxLength: 5000
        eHoldingsExportConfig:
          $ref: '#/components/schemas/EHoldingsExportConfig'
        authorityControlExportConfig:
          $ref: '#/components/schemas/AuthorityControlExportConfig'
    bursarExportTokenUserData:
      description: Token to represent user data
      type: object
      properties:
        type:
          description: Type of data token
          type: string
          default: UserData
        value:
          description: User data to represent
          type: string
          enum:
          - FOLIO_ID
        lengthControl:
          description: Control length of token
          $ref: '#/components/schemas/bursarExportTokenLengthControl'
      additionalProperties: false
      required:
      - type
      - value
    bursarExportFilterServicePoint:
      description: Filter by service point
      type: object
      properties:
        type:
          description: Type of filter
          type: string
          default: ServicePoint
        servicePointId:
          description: Id of service point to filter by
          type: string
          format: uuid
      additionalProperties: false
      required:
      - type
      - servicePointId
    bursarExportTokenFeeDate:
      description: Token to represent part of date about a fee
      type: object
      properties:
        type:
          description: Type of data token
          type: string
          default: FeeDate
        property:
          description: Property of fee to be represented by token
          type: string
          enum:
          - CREATED
          - UPDATED
          - DUE
          - RETURNED
        value:
          description: Type of date value to represent
          $ref: '#/components/schemas/bursarExportTokenDateType'
        placeholder:
          description: Placeholder value to use if date is not available
          type: string
        timezone:
          description: Timezone to use for date
          type: string
        lengthControl:
          description: Control length of token
          $ref: '#/components/schemas/bursarExportTokenLengthControl'
      additionalProperties: false
      required:
      - type
      - property
      - value
      - placeholder
      - timezone
    ErrorType:
      type: string
      enum:
      - ERROR
      - WARNING
    bursarExportHeaderFooterToken:
      description: Token permitted in header/footer
      oneOf:
      - $ref: '#/components/schemas/bursarExportTokenAggregate'
      - $ref: '#/components/schemas/bursarExportTokenConstant'
      - $ref: '#/components/schemas/bursarExportTokenCurrentDate'
      discriminator:
        propertyName: type
        mapping:
          Aggregate: '#/components/schemas/bursarExportTokenAggregate'
          Constant: '#/components/schemas/bursarExportTokenConstant'
          CurrentDate: '#/components/schemas/bursarExportTokenCurrentDate'
    bursarExportDataToken:
      description: Usable token for bursar export
      oneOf:
      - $ref: '#/components/schemas/bursarExportTokenAggregate'
      - $ref: '#/components/schemas/bursarExportTokenConstant'
      - $ref: '#/components/schemas/bursarExportTokenCurrentDate'
      - $ref: '#/components/schemas/bursarExportTokenFeeDate'
      - $ref: '#/components/schemas/bursarExportTokenFeeAmount'
      - $ref: '#/components/schemas/bursarExportTokenFeeMetadata'
      - $ref: '#/components/schemas/bursarExportTokenItemData'
      - $ref: '#/components/schemas/bursarExportTokenUserData'
      - $ref: '#/components/schemas/bursarExportTokenUserDataOptional'
      - $ref: '#/components/schemas/bursarExportTokenConditional'
      discriminator:
        propertyName: type
        mapping:
          Aggregate: '#/components/schemas/bursarExportTokenAggregate'
          Constant: '#/components/schemas/bursarExportTokenConstant'
          CurrentDate: '#/components/schemas/bursarExportTokenCurrentDate'
          FeeDate: '#/components/schemas/bursarExportTokenFeeDate'
          FeeAmount: '#/components/schemas/bursarExportTokenFeeAmount'
          FeeMetadata: '#/components/schemas/bursarExportTokenFeeMetadata'
          ItemData: '#/components/schemas/bursarExportTokenItemData'
