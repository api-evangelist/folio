          label: label
          fieldId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          order: 0
      properties:
        indicators:
          description: Collection of field indicators
          items:
            $ref: '#/components/schemas/fieldIndicatorDto'
          type: array
        totalRecords:
          description: Total number of field indicators in collection
          type: integer
      title: Field Indicators DTO Collection
      type: object
    scope:
      description: Scope of the specification definition
      enum:
      - system
      - standard
      - local
      type: string
    subfieldDto:
      description: Describe field subfield definition that will be used for record validation
      example:
        metadata:
          createdByUserId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          createdDate: createdDate
          updatedDate: updatedDate
          updatedByUserId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        code: code
        repeatable: true
        deprecated: false
        scope: null
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        label: label
        required: false
        fieldId: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        id:
          description: Subfield ID
          format: uuid
          type: string
        fieldId:
          description: Field ID
          format: uuid
          type: string
        code:
          description: Subfield code
          type: string
        label:
          description: Subfield description
          type: string
        repeatable:
