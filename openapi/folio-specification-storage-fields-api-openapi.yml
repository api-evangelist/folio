      type: object
    fieldIndicatorChangeDto:
      additionalProperties: false
      description: Describe indicator definition that should be created or change to existed indicator definition
      properties:
        order:
          description: Indicator order
          maximum: 2
          minimum: 1
          type: integer
        label:
          description: Indicator description
          maxLength: 350
          type: string
      required:
      - label
      - order
      title: Field indicator definition change DTO
      type: object
    subfieldChangeDto:
      additionalProperties: false
      description: Describe subfield definition that should be created or change to existed subfield definition
      properties:
        code:
          description: Subfield code
          pattern: '[0-9a-z]'
          type: string
        label:
          description: Subfield description
          maxLength: 350
          type: string
        repeatable:
          default: true
          description: Define if subfield is repeatable
          type: boolean
        required:
          default: false
          description: Define if subfield is required
          type: boolean
        deprecated:
          default: false
          description: Define if subfield is deprecated
          type: boolean
