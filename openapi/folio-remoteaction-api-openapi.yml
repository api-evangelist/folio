openapi: 3.2.0
info:
  title: Edge ILL FOLIO Remote Action API
  description: 'Edge API that proxies external client requests to the FOLIO mod-ill module.

    Endpoints mirror the mod-ill `ill` interface as declared in its module descriptor.'
  version: 1.0.0
servers:
- url: /
tags:
- name: RemoteAction
paths:
  /illService/tenants/{tenantId}/remoteAction/{id}/perform:
    get:
      tags:
      - RemoteAction
      description: Perform Remote Action
      operationId: perform
      parameters:
      - $ref: '#/components/parameters/tenant-id'
      - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful response - the document is streamed as-is from the backend (mod-ill)
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
      summary: Perform
      x-summary-source: derived
components:
  parameters:
    tenant-id:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
      example: diku
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    error:
      description: An error
      type: object
      properties:
        message:
          type: string
          description: Error message text
        type:
          type: string
          description: Error message type
        code:
          type: string
          description: Error message code
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/parameter'
      example:
        message: Entity already exists.
        type: EntityExistsException
        code: entity_exists
        parameters:
        - name: id
          value: 5ac63bf6-20e4-4449-9efd-01dbca051acf
    parameter:
      description: List of key/value parameters of an error
      type: object
      properties:
        key:
          description: Parameter key
          type: string
        value:
          description: Parameter value
          type: string
      example:
        name: field
        value: must not be empty
    errors:
      description: A set of errors
      type: object
      properties:
        errors:
          description: List of errors
          x-field-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
          type: array
          items:
            $ref: '#/components/schemas/error'
        total_records:
          description: Total number of errors
          type: integer
      example:
        errors:
        - message: Error Message Text
          type: ServiceException
          code: error_code
          parameters:
          - name: cause
            value: Service exception cause
        total_records: 1
  responses:
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errors'
          example:
            errors:
            - code: service
              type: InternalServerErrorException
              message: Unknown Service Exception
            total_records: 1
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errors'
          example:
            errors:
            - code: validation
              type: BadRequest
              message: The input provided is invalid.
              parameters:
              - name: field
                value: must not be empty
            total_records: 1
