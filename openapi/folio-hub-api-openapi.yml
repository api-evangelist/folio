openapi: 3.2.0
info:
  title: Folio Hub API
  version: v1
  description: 'Operations tagged hub across 2 of this provider''s published API definitions: folio-mod-linked-data-openapi.json, folio-mod-linked-data-openapi.yml. Each path carries the servers of the definition it was published in.'
tags:
- name: Hub
paths:
  /linked-data/hub:
    get:
      operationId: getHubPreviewByUri
      tags:
      - Hub
      description: Get the preview of a remote Hub resource
      parameters:
      - $ref: '#/components/parameters/hubUri'
      responses:
        '200':
          description: Resource as json string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceResponseDto'
        '404':
          description: No Hub resource is found by Hub URI
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Get hub preview by uri
      x-summary-source: derived
    post:
      operationId: saveHubByUri
      tags:
      - Hub
      description: Save a remote Hub resource
      parameters:
      - $ref: '#/components/parameters/hubUri'
      responses:
        '200':
          description: Saved resource as json string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resourceResponseDto'
        '404':
          description: No Hub resource is found by Hub URI
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
      summary: Save hub by uri
      x-summary-source: derived
components:
  schemas:
    parameter:
      description: List of key/value parameters of an error
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      properties:
        key:
          description: Parameter key
          type: string
        value:
          description: Parameter value
          type: string
    Language:
      $schema: http://json-schema.org/draft-04/schema#
      description: Language object
      type: object
      x-from-string-field: term
      allOf:
      - $ref: '#/components/schemas/IdField'
      - properties:
          code:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/code
          term:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/term
          link:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/link
    BaseTitleResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Base Title Fields
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/BaseTitle'
    AccessLocation:
      $schema: http://json-schema.org/draft-04/schema#
      description: AccessLocation
      allOf:
      - type: object
        properties:
          link:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/link
          note:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/note
    CopyrightEventResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Copyright event object
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/CopyrightEvent'
    CategoryResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Category object
      x-from-string-field: term
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/Category'
    LanguageWithType:
      $schema: http://json-schema.org/draft-04/schema#
      description: Language object with corresponding types
      type: object
      properties:
        types:
          type: array
          items:
            type: string
          x-json-property: _types
          description: The list of language types
        codes:
          type: array
          items:
            type: object
            $ref: '#/components/schemas/Language'
          x-json-property: _codes
          description: List of language objects corresponding to the specified types.
    errors:
      description: A set of errors
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      properties:
        errors:
          description: List of errors
          id: errors
          type: array
          items:
            type: object
            $ref: '#/components/schemas/error'
        total_records:
          description: Total number of errors
          type: integer
    Status:
      $schema: http://json-schema.org/draft-04/schema#
      description: Status Info
      allOf:
      - type: object
        properties:
          link:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/link
          value:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/label
    parameters:
      description: List of key/value parameters of an error
      $schema: http://json-schema.org/draft-04/schema#
      type: array
      items:
        type: object
        $ref: '#/components/schemas/parameter'
    PartOfSeries:
      $schema: http://json-schema.org/draft-04/schema#
      description: Schema for a 'part of series' object which indicates if a work is part of a series.
      allOf:
      - type: object
        properties:
          name:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/name
          issn:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/issn
          volume:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/volume
    DissertationResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Dissertation object
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/DissertationBase'
      - type: object
        properties:
          _grantingInstitutionReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/ReferenceResponse'
    ParallelTitleResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Parallel Title Info
      allOf:
      - $ref: '#/components/schemas/BaseTitleResponse'
      - $ref: '#/components/schemas/ParallelTitle'
    ProviderEventResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Provider Event
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/ProviderEventBase'
      - type: object
        properties:
          providerPlace:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/PlaceResponse'
            x-json-property: http://bibfra.me/vocab/lite/providerPlace
    VariantTitle:
      $schema: http://json-schema.org/draft-04/schema#
      description: Variant Title Info
      allOf:
      - $ref: '#/components/schemas/BaseTitle'
      - type: object
        properties:
          note:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/note
          date:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/date
          variantType:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/variantType
    FolioMetadata:
      $schema: http://json-schema.org/draft-04/schema#
      description: Metadata of the instance resource
      properties:
        source:
          type: string
          enum:
          - MARC
          - LINKED_DATA
          description: The source of the instance
        inventoryId:
          type: string
          description: ID of the instance in the Inventory application
        srsId:
          type: string
          description: ID of the MARC bib record in the SRS application
    ClassificationResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Dewey decimal classification object
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/ClassificationBase'
      - type: object
        properties:
          status:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/StatusResponse'
            x-json-property: http://bibfra.me/vocab/library/status
          _assigningSourceReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/ReferenceResponse'
    PrimaryTitleResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Primary Title Info
      allOf:
      - $ref: '#/components/schemas/BaseTitleResponse'
      - $ref: '#/components/schemas/PrimaryTitle'
    VariantTitleResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Variant Title Info
      allOf:
      - $ref: '#/components/schemas/BaseTitleResponse'
      - $ref: '#/components/schemas/VariantTitle'
    Extent:
      $schema: http://json-schema.org/draft-04/schema#
      description: Extent
      allOf:
      - type: object
        properties:
          label:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/label
          materialsSpec:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/materialsSpecified
          note:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/note
    PublicationFrequency:
      $schema: http://json-schema.org/draft-04/schema#
      description: Publication frequency DTO
      type: object
      properties:
        label:
          type: array
          items:
            type: string
          description: Publication frequency label
          x-json-property: http://bibfra.me/vocab/lite/label
        link:
          type: array
          items:
            type: string
          description: Publication frequency link
          x-json-property: http://bibfra.me/vocab/lite/link
    HubResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Work Info
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/ProfileIdField'
      - $ref: '#/components/schemas/TitleFieldResponse'
      - type: object
        properties:
          languages:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/Language'
            x-json-property: http://bibfra.me/vocab/lite/language
          _creatorReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/AgentResponse'
          _contributorReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/AgentResponse'
      x-implements:
      - org.folio.linked.data.model.dto.HasTitle
      - org.folio.linked.data.model.dto.HasCreator
    TitleFieldResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Title of the Work or Instance resource
      properties:
        title:
          type: array
          description: The title of the work or instance
          items:
            type: object
            oneOf:
            - type: object
              title: PrimaryTitleFieldResponse
              properties:
                PrimaryTitle:
                  type: object
                  $ref: '#/components/schemas/PrimaryTitleResponse'
                  x-json-property: http://bibfra.me/vocab/library/Title
                  description: The primary title of the work or instance
            - type: object
              title: VariantTitleFieldResponse
              properties:
                VariantTitle:
                  type: object
                  $ref: '#/components/schemas/VariantTitleResponse'
                  x-json-property: http://bibfra.me/vocab/library/VariantTitle
                  description: The variant title of the work or instance
            - type: object
              title: ParallelTitleFieldResponse
              properties:
                ParallelTitle:
                  type: object
                  $ref: '#/components/schemas/ParallelTitleResponse'
                  x-json-property: http://bibfra.me/vocab/library/ParallelTitle
                  description: The parallel title of the work or instance
          x-json-property: http://bibfra.me/vocab/library/title
    ClassificationBase:
      $schema: http://json-schema.org/draft-04/schema#
      description: Classification base object
      allOf:
      - type: object
        properties:
          code:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/code
          source:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/source
          itemNumber:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/itemNumber
          editionNumber:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/editionNumber
          edition:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/edition
    Place:
      $schema: http://json-schema.org/draft-04/schema#
      description: Place
      allOf:
      - type: object
        properties:
          name:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/name
          code:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/code
          label:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/label
          link:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/link
    PrimaryTitle:
      $schema: http://json-schema.org/draft-04/schema#
      description: Primary Title Info
      allOf:
      - $ref: '#/components/schemas/BaseTitle'
      - type: object
        properties:
          nonSortNum:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/bflc/nonSortNum
    Reference:
      $schema: http://json-schema.org/draft-04/schema#
      description: Schema representing reference to a resource in the FOLIO graph or an external source from where the resource can be imported into FOLIO graph
      allOf:
      - $ref: '#/components/schemas/IdField'
      - type: object
        properties:
          label:
            type: string
          srsId:
            type: string
            description: ID of the MARC record in FOLIO's SRS system
          rdfLink:
            type: string
            description: Hyperlink to an RDF resource in Bibframe 2 ontology (https://id.loc.gov/ontologies/bibframe.html)
    IdField:
      $schema: http://json-schema.org/draft-04/schema#
      description: Schema representing the ID of a resource in the graph
      type: object
      properties:
        id:
          type: string
          description: Hash / ID of the resource
    resourceResponseDto:
      $schema: http://json-schema.org/draft-04/schema#
      description: Resource response DTO
      type: object
      properties:
        resource:
          type: object
          title: resourceResponseField
          description: Resource response. Contains either an Instance or a Work
          oneOf:
          - title: InstanceResponseField
            properties:
              Instance:
                type: object
                $ref: '#/components/schemas/InstanceResponse'
                x-json-property: http://bibfra.me/vocab/lite/Instance
                description: Instance response DTO.
          - title: WorkResponseField
            properties:
              Work:
                type: object
                $ref: '#/components/schemas/WorkResponse'
                x-json-property: http://bibfra.me/vocab/lite/Work
                description: Work response DTO.
          - title: HubResponseField
            properties:
              Hub:
                type: object
                $ref: '#/components/schemas/HubResponse'
                x-json-property: http://bibfra.me/vocab/lite/Hub
                description: Hub response DTO.
          - title: AuthorityResponseField
            properties:
              Authority:
                type: object
                $ref: '#/components/schemas/AuthorityResponse'
                x-json-property: _authority
                description: Authority response DTO
    PublicationFrequencyResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Publication frequency DTO
      x-from-string-field: label
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/PublicationFrequency'
      - type: object
        properties:
          code:
            type: array
            items:
              type: string
            description: Publication frequency code
            x-json-property: http://bibfra.me/vocab/library/code
    WorkResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Work Info
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/ProfileIdField'
      - $ref: '#/components/schemas/TitleFieldResponse'
      - type: object
        properties:
          targetAudience:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/CategoryResponse'
            x-json-property: http://bibfra.me/vocab/library/targetAudience
          tableOfContents:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/tableOfContents
          summary:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/summary
          _languages:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/LanguageWithType'
            x-json-property: _languages
          _notes:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/Note'
            x-json-property: _notes
          subjects:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/ReferenceResponse'
            x-json-property: http://bibfra.me/vocab/lite/subject
          classification:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/ClassificationResponse'
            x-json-property: http://bibfra.me/vocab/lite/classification
          _creatorReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/AgentResponse'
          _contributorReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/AgentResponse'
          content:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/CategoryResponse'
            x-json-property: http://bibfra.me/vocab/library/content
          _instanceReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/InstanceResponse'
          _geographicCoverageReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/ReferenceResponse'
          _genreReference:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/ReferenceResponse'
          dateStart:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/dateStart
          dateEnd:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/dateEnd
          governmentPublication:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/CategoryResponse'
            x-json-property: http://bibfra.me/vocab/library/governmentPublication
          originPlace:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/PlaceResponse'
            x-json-property: http://bibfra.me/vocab/library/originPlace
          dissertation:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/DissertationResponse'
            x-json-property: http://bibfra.me/vocab/scholar/dissertation
          illustrations:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/CategoryResponse'
            x-json-property: http://bibfra.me/vocab/library/illustrations
          supplementaryContent:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/CategoryResponse'
            x-json-property: http://bibfra.me/vocab/library/supplementaryContent
          partOfSeries:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/PartOfSeries'
            x-json-property: http://bibfra.me/vocab/relation/isPartOf
          characteristic:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/CategoryResponse'
            x-json-property: http://bibfra.me/vocab/library/characteristic
          _hubs:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/HubReferenceWithType'
          _analyticalEntry:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/LightWork'
      x-implements:
      - org.folio.linked.data.model.dto.HasTitle
      - org.folio.linked.data.model.dto.HasCreator
    MapResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Identifier field response discriminated union
      title: MapResponse
      oneOf:
      - type: object
        title: LccnFieldResponse
        properties:
          Lccn:
            type: object
            $ref: '#/components/schemas/IdentifierResponse'
            x-json-property: http://library.link/identifier/LCCN
      - type: object
        title: IssnFieldResponse
        properties:
          Issn:
            type: object
            $ref: '#/components/schemas/IdentifierResponse'
            x-json-property: http://library.link/identifier/ISSN
      - type: object
        title: IsbnFieldResponse
        properties:
          Isbn:
            type: object
            $ref: '#/components/schemas/IdentifierResponse'
            x-json-property: http://library.link/identifier/ISBN
      - type: object
        title: IanFieldResponse
        properties:
          Ian:
            type: object
            $ref: '#/components/schemas/IdentifierResponse'
            x-json-property: http://library.link/identifier/IAN
      - type: object
        title: OtherIdFieldResponse
        properties:
          Identifier:
            type: object
            $ref: '#/components/schemas/IdentifierResponse'
            x-json-property: http://library.link/identifier/UNKNOWN
    ProviderEventBase:
      $schema: http://json-schema.org/draft-04/schema#
      description: Provider Event
      allOf:
      - type: object
        properties:
          date:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/date
          name:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/name
          providerDate:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/providerDate
          simplePlace:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/place
    AdminMetadata:
      $schema: http://json-schema.org/draft-04/schema#
      description: Administrative metadata for an Instance
      allOf:
      - type: object
        properties:
          transcribingAgency:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/transcribingAgency
          catalogingAgency:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/catalogingAgency
          modifyingAgency:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/modifyingAgency
          createdDate:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/createdDate
          controlNumber:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/library/controlNumber
          catalogingLanguage:
            type: array
            items:
              type: object
              $ref: '#/components/schemas/Language'
            x-json-property: http://bibfra.me/vocab/lite/catalogingLanguage
    ParallelTitle:
      $schema: http://json-schema.org/draft-04/schema#
      description: Parallel Title Info
      allOf:
      - $ref: '#/components/schemas/BaseTitle'
      - type: object
        properties:
          note:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/note
          date:
            type: array
            items:
              type: string
            x-json-property: http://bibfra.me/vocab/lite/date
    HubReferenceWithType:
      $schema: http://json-schema.org/draft-04/schema#
      description: Hub reference with relation type
      allOf:
      - type: object
        properties:
          _relation:
            type: string
          _hub:
            $ref: '#/components/schemas/Reference'
    ProfileIdField:
      $schema: http://json-schema.org/draft-04/schema#
      description: Schema for the profile ID field used in request and response
      type: object
      properties:
        profileId:
          type: integer
          format: int16
          description: ID of the profile
      required:
      - profileId
    PlaceResponse:
      $schema: http://json-schema.org/draft-04/schema#
      description: Place
      allOf:
      - $ref: '#/components/schemas/IdField'
      - $ref: '#/components/schemas/Place'
    Agent:
      $schema: http://json-schema.org/draft-04/schema#
      description: Schema representing an agent, including their type and roles.
      allOf:
      - $ref: '#/components/schemas/Reference'
      - type: object
        properties:
          type:
            type: string
