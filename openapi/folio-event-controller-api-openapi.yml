openapi: 3.2.0
info:
  title: OpenAPI definition Event Controller API
  version: v0
servers:
- url: http://localhost:9000
  description: Generated server url
tags:
- name: event-controller
paths:
  /events/**:
    post:
      tags:
      - event-controller
      operationId: postHandleEventsWithFile
      parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                tenant:
                  type: string
              required:
              - file
          application/json:
            schema:
              $ref: '#/components/schemas/JsonNode'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonNode'
        '204':
          description: No Content
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ResponseErrors'
        '400':
          description: Bad Request
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ResponseErrors'
        '404':
          description: Not Found
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ResponseErrors'
        '500':
          description: Internal Server Error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ResponseErrors'
      summary: Post handle events with file
      x-summary-source: derived
components:
  schemas:
    ResponseErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        total_records:
          type: integer
          format: int32
    Error:
      type: object
      properties:
        message:
          type: string
        type:
          type: string
        code:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/Parameter'
      required:
      - message
    Parameter:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
    JsonNode: {}
