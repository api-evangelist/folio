openapi: 3.2.0
info:
  title: Folio Authority Storage API
  version: v1.0
  description: 'Operations tagged authority-storage across 2 of this provider''s published API definitions: folio-mod-entities-links-openapi.json, folio-mod-entities-links-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8081
tags:
- name: authority-storage
paths:
  /authority-storage/authorities:
    get:
      operationId: retrieveAuthorities
      parameters:
      - description: Indicates if only deleted authority records should be retrieved
        in: query
        name: deleted
        required: false
        schema:
          default: false
          type: boolean
      - description: Indicates if only IDs of authority records should be retrieved
        in: query
        name: idOnly
        required: false
        schema:
          default: false
          type: boolean
      - description: Skip over a number of elements by specifying an offset value for the query.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          maximum: 2147483647
          minimum: 0
          type: integer
      - description: Limit the number of elements returned in the response.
        in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 2000
          minimum: 1
          type: integer
      - description: 'A query expressed as a CQL string (see [dev.folio.org/reference/glossary#cql](https://dev.folio.org/reference/glossary#cql)) using valid searchable fields. Authorities can be queried using the following fields: headingType, authoritySourceFile.id, authoritySourceFile.name, createdDate, updatedDate. Example: headingType=personalName & authoritySourceFile.name=LC Genre/Form Terms & createdDate>2021-10-25T12:00:00.0'
        in: query
        name: query
        required: false
        schema:
          default: cql.allRecords=1
          type: string
      - description: Specifies accepting media-types for the response
        in: header
        name: Accept
        required: false
        schema:
          default: application/json
          items:
            description: identifies media-type
            type: string
          type: array
      responses:
        '200':
          content:
            application/json:
              example: examples/authorities.sample
              schema:
                $ref: '#/components/schemas/authorityFullDtoCollection'
            text/plain;charset=utf-8:
              example: examples/authorities_ids.sample
              schema:
                type: string
          description: Returns a list of authorities
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation errors.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Internal server error.
      tags:
      - authority-storage
      summary: Retrieve authorities
      x-summary-source: derived
    post:
      operationId: createAuthority
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/authorityDto'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authorityDto'
          description: Record successfully created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation errors.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation error for the request.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Internal server error.
      tags:
      - authority-storage
      summary: Create authority
      x-summary-source: derived
    servers:
    - url: https://localhost:8081
  /authority-storage/authorities/bulk:
    post:
      operationId: createAuthorityBulk
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/authorityBulkRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authorityBulkResponse'
          description: Record successfully created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation errors.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation error for the request.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Internal server error.
      tags:
      - authority-storage
      summary: Create authority bulk
      x-summary-source: derived
    servers:
    - url: https://localhost:8081
  /authority-storage/authorities/{id}:
    delete:
      operationId: deleteAuthority
      parameters:
      - description: The UUID of a record
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Record successfully deleted
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation errors.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Record was not found.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Internal server error.
      tags:
      - authority-storage
      summary: Delete authority
      x-summary-source: derived
    get:
      operationId: getAuthority
      parameters:
      - description: The UUID of a record
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authorityDto'
          description: Retrieved record
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation errors.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Record was not found.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Internal server error.
      tags:
      - authority-storage
      summary: Get authority
      x-summary-source: derived
    put:
      operationId: updateAuthority
      parameters:
      - description: The UUID of a record
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/authorityDto'
      responses:
        '204':
          description: Record successfully updated
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation errors.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Record was not found.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation error for the request.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Internal server error.
      tags:
      - authority-storage
      summary: Update authority
      x-summary-source: derived
    servers:
    - url: https://localhost:8081
