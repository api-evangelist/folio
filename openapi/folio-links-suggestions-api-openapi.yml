openapi: 3.2.0
info:
  title: Folio Links Suggestions API
  version: v1.0
  description: 'Operations tagged links-suggestions across 2 of this provider''s published API definitions: folio-mod-entities-links-openapi.json, folio-mod-entities-links-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://localhost:8081
tags:
- name: links-suggestions
paths:
  /links-suggestions/marc:
    post:
      description: Retrieve links suggestions for marc records
      operationId: suggestLinksForMarcRecord
      parameters:
      - description: Authority field to search by
        explode: true
        in: query
        name: authoritySearchParameter
        required: false
        schema:
          $ref: '#/components/schemas/AuthoritySearchParameter'
        style: form
      - description: Indicates if we need to ignore autoLinkingEnabled flag when filtering the fields for suggestions
        explode: true
        in: query
        name: ignoreAutoLinkingEnabled
        required: false
        schema:
          default: false
          type: boolean
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/parsedRecordContentCollection'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/parsedRecordContentCollection'
          description: The marc records with links suggestion
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Validation errors.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errors'
          description: Internal server error.
      tags:
      - links-suggestions
      summary: Suggest links for marc record
      x-summary-source: derived
    servers:
    - url: https://localhost:8081
components:
  schemas:
    AuthoritySearchParameter:
      default: NATURAL_ID
      description: Authority search parameter for link suggestions
      enum:
      - ID
      - NATURAL_ID
      type: string
    linkStatus:
      description: Link status
      enum:
      - ACTUAL
      - ERROR
      - NEW
      type: string
    FieldContent_value:
