        setup:
          $ref: '#/components/schemas/Setup'
        versionTag:
          type: string
          maxLength: 64
          minLength: 1
      required:
      - name
      - versionTag
    ResponseErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        total_records:
          type: integer
          format: int32
    Setup:
      type: object
      properties:
        asyncAfter:
          type: boolean
        asyncBefore:
          type: boolean
    WorkflowRequestBody:
      type: object
      properties:
