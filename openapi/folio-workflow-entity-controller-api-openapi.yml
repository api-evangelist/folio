          type: string
        active:
          type: boolean
        deploymentId:
          type: string
        description:
          type: string
          maxLength: 512
          minLength: 0
        historyTimeToLive:
          type: integer
          format: int32
          minimum: 0
        initialContext:
          type: object
          additionalProperties:
