          format: int64
        number:
          type: integer
          format: int64
    PagedModelEntityModelWorkflow:
      type: object
      properties:
        _embedded:
          type: object
          properties:
            workflows:
              type: array
              items:
                $ref: '#/components/schemas/EntityModelWorkflow'
        _links:
