        templated:
          type: boolean
    EntityModelWorkflow:
      type: object
      properties:
        active:
          type: boolean
        deploymentId:
          type: string
        description:
          type: string
          maxLength: 512
          minLength: 0
        historyTimeToLive:
          type: integer
