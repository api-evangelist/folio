        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: integer
    servers:
    - url: https://folio-snapshot-okapi.dev.folio.org
    - url: https://folio-snapshot-2-okapi.dev.folio.org
    - url: https://folio-etesting-snapshot-kong.ci.folio.org
  /erm/resource/delete/ti:
    description: Marks the specified title instances for deletion and immediately deletes them, cascading to works that become orphaned as a result. A resource is only deleted if it has no active entitlements
    parameters:
    - $ref: '#/components/parameters/x-okapi-tenant'
    - $ref: '#/components/parameters/includeIds'
    post:
      tags:
      - Resources
      summary: Delete title instances
      operationId: deleteTis
      requestBody:
        required: true
        content:
