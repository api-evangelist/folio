              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: integer
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: integer
    servers:
    - url: https://folio-snapshot-okapi.dev.folio.org
    - url: https://folio-snapshot-2-okapi.dev.folio.org
    - url: https://folio-etesting-snapshot-kong.ci.folio.org
components:
  schemas:
    EntitlementResultsArray:
      type: array
      items:
        $ref: '#/components/schemas/Entitlement'
    MarkForDeleteResponse:
      type: object
      properties:
        resourceIds:
          description: Omitted (null) unless the `includeIds` query parameter is set to true
          oneOf:
          - $ref: '#/components/schemas/MarkForDeleteMap'
          - type: 'null'
        statistics:
          $ref: '#/components/schemas/DeletionCounts'
    DeleteResponse:
      type: object
      properties:
        markedForDeletion:
          $ref: '#/components/schemas/MarkForDeleteResponse'
        deleted:
          $ref: '#/components/schemas/MarkForDeleteResponse'
    ErmResourceResults:
      type: object
      required:
      - results
      allOf:
      - $ref: '#/components/schemas/ResultsMeta'
      - type: object
      - properties:
          results:
            $ref: '#/components/schemas/ErmResourceResultsArray'
    IdentifierOccurrence:
      type: object
      properties:
        title:
          type: object
          properties:
            id:
              type: string
              format: uuid
        identifier:
          $ref: '#/components/schemas/Identifier'
        status:
          $ref: '#/components/schemas/Refdata'
    EntitlementOption:
      allOf:
      - oneOf:
        - $ref: '#/components/schemas/PackageContentItem'
        - $ref: '#/components/schemas/Package'
      - type: object
        properties:
          _object:
            oneOf:
            - $ref: '#/components/schemas/TitleInstance'
            - $ref: '#/components/schemas/PlatformTitleInstance'
            - $ref: '#/components/schemas/PackageContentItem'
            - $ref: '#/components/schemas/Package'
            discriminator:
              propertyName: class
              mapping:
                org.olf.kb.TitleInstance: '#/components/schemas/TitleInstance'
                org.olf.kb.PlatformTitleInstance: '#/components/schemas/PlatformTitleInstance'
                org.olf.kb.PackageContentItem: '#/components/schemas/PackageContentItem'
                org.olf.kb.Pkg: '#/components/schemas/Package'
    Embargo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        movingWallStart:
          $ref: '#/components/schemas/EmbargoStatement'
        movingWallEnd:
          $ref: '#/components/schemas/EmbargoStatement'
    PackageDescriptionUrl:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
    AlternateName:
      type: object
      required:
      - name
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
        owner:
          type: object
          properties:
            id:
              type: string
              format: uuid
          readOnly: true
          description: Agreements that owns the alternate name
    EntitlementOptionResults:
      type: object
      required:
      - results
      allOf:
      - $ref: '#/components/schemas/ResultsMeta'
      - type: object
      - properties:
          results:
            $ref: '#/components/schemas/EntitlementOptionResultsArray'
    TitleInstanceRef:
      description: A lightweight representation of a title instance, used where a title references another title (e.g. `TitleInstance.relatedTitles`). Unlike the full `TitleInstance` representation, fields such as `class`, `dateCreated` and `coverage` are not populated on this partial view, and it does not nest further `relatedTitles`.
      allOf:
      - $ref: '#/components/schemas/ErmResource'
      - properties:
          dateMonographPublished:
            type: string
