openapi: 3.2.0
info:
  title: Edge CasiaSoft Request Barcodes API
  version: v1
servers:
- url: /caiasoftService/
tags:
- name: RequestBarcodes
paths:
  /RequestBarcodes/{itemBarcode}/reshelved/{remoteStorageConfigurationId}:
    post:
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/returnItemResponse'
        '400':
          description: Bad request
          content:
            text/plain:
              schema:
                type: string
                example: Bad request
        '500':
          description: Internal server error
          content:
            text/plain:
              schema:
                type: string
                example: Internal server error
      description: Perform item return
      operationId: returnItemByBarcode
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        required: false
      parameters:
      - $ref: '#/components/parameters/item-barcode'
      - $ref: '#/components/parameters/remote-storage-id'
      - $ref: '#/components/parameters/x-okapi-token'
      - $ref: '#/components/parameters/x-okapi-tenant'
      tags:
      - RequestBarcodes
      summary: Return item by barcode
      x-summary-source: derived
components:
  schemas:
    returnItemResponse:
      $schema: http://json-schema.org/draft-04/schema#
      type: object
      description: Value of item's barcode to check in an item at service points
      properties:
        isHoldRecallRequestExist:
          description: Barcode of the item to be checked in
          type: boolean
          default: 'false'
      additionalProperties: false
      required:
      - isHoldRecallRequestExist
    uuid:
      $schema: http://json-schema.org/draft-04/schema#
      description: Regexp pattern for UUID validation
      type: string
      pattern: ^[a-fA-F0-9]{8}-[a-fA-F0-9]{4}-[1-5][a-fA-F0-9]{3}-[89abAB][a-fA-F0-9]{3}-[a-fA-F0-9]{12}$
  parameters:
    item-barcode:
      name: itemBarcode
      in: path
      required: true
      schema:
        type: string
    x-okapi-tenant:
      name: x-okapi-tenant
      in: header
      required: true
      schema:
        type: string
    x-okapi-token:
      name: x-okapi-token
      in: header
      required: true
      schema:
        type: string
    remote-storage-id:
      name: remoteStorageConfigurationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/uuid'
