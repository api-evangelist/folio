components:
  parameters:
    filters:
      in: query
      name: filters
      required: false
      schema:
        type: string
    sort:
      in: query
      name: sort
      required: false
      schema:
        type: string
    page:
      in: query
      name: page
      required: false
      schema:
        type: integer
    perPage:
      in: query
      name: perPage
      required: false
      schema:
        type: integer
    x-okapi-tenant:
      in: header
      name: x-okapi-tenant
      required: true
      schema:
        type: string
    offset:
      in: query
      name: offset
      required: false
      schema:
        type: integer
    term:
      in: query
      name: term
      required: false
      schema:
        type: string
    refdataProperty:
      in: path
      name: property
      description: Name of the refdata-backed property on the domain class, e.g. `agreementStatus` (on `SubscriptionAgreement`)
      required: true
      schema:
        type: string
    stats:
      in: query
      name: stats
      required: false
      schema:
        type: boolean
    refdataDomain:
      in: path
      name: domain
      description: Simple (case-insensitive) name of the domain class that owns the property, e.g. `SubscriptionAgreement`, `Pkg`
      required: true
      schema:
        type: string
    match:
      in: query
      name: match
      required: false
      schema:
        type: string
    refdataId:
      in: path
      name: refdataId
      description: UUID for a reference data category
      required: true
      schema:
        type: string
        format: uuid
    refdataCategoryId:
      in: path
      name: refdataCategoryId
      description: ID for a reference data category
      required: true
      schema:
        type: string
    refdataProperty_2:
      in: path
      name: property
      description: Name of the refdata-backed property on the domain class, e.g. `type` (on `License`)
      required: true
      schema:
        type: string
    refdataDomain_2:
      in: path
      name: domain
      description: Simple (case-insensitive) name of the domain class that owns the property, e.g. `License`, `LicenseAmendment`
      required: true
      schema:
        type: string
    refdataCategoryId_2:
      in: path
      name: id
      description: Id for a reference data category
      required: true
      schema:
        type: string
    refdataProperty_3:
