openapi: 3.2.0
info:
  title: Folio Locations API
  version: '1.0'
  description: 'Operations tagged locations across 3 of this provider''s published API definitions: folio-edge-inventory-openapi.json, folio-mod-inn-reach-settings-openapi.json, folio-mod-locations-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /inventory
- url: /inn-reach/
- description: Development environments.
  url: https://folio-{environment}.ci.folio.org
  variables:
    environment:
      default: edev-spitfire-diku
      enum:
      - edev-spitfire-diku
      - edev-spitfire-consortium
tags:
- name: Locations
paths:
  /inventory/locations:
    get:
      tags:
      - Locations
      operationId: getLocations
      summary: Retrieve collection of location items
      description: Retrieve collection of location items.
      parameters:
      - $ref: '#/components/parameters/x-okapi-tenant-header'
      - $ref: '#/components/parameters/x-okapi-token-header'
      - $ref: '#/components/parameters/request-query-parameters'
      responses:
        '200':
          description: 'Calls the mod-inventory-storage GET /locations API and returns the result as-is. \

            The example of response: https://github.com/folio-org/mod-inventory-storage/blob/master/ramls/examples/locations.json

            '
          content:
            application/json:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/badRequestResponse'
        '401':
          $ref: '#/components/responses/notAuthorizedResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    servers:
    - url: /inventory
  /inventory/locations/{locationId}:
    get:
      tags:
      - Locations
      operationId: getLocationById
      summary: Retrieve location information by id
      description: Retrieve location information by id.
      parameters:
      - $ref: '#/components/parameters/x-okapi-tenant-header'
      - $ref: '#/components/parameters/x-okapi-token-header'
      - $ref: '#/components/parameters/location-id'
      responses:
        '200':
          description: 'Calls the mod-inventory-storage GET /locations/{id} API and returns the result as-is. \

            The example of response: https://github.com/folio-org/mod-inventory-storage/blob/master/ramls/locinst.json

            '
          content:
            application/json:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/notFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    servers:
    - url: /inventory
  /inventory/location-units/institutions/{institutionId}:
    get:
      tags:
      - Locations
      operationId: getInstitutionById
      summary: Retrieve institution information by id
      description: Retrieve institution information by id.
      parameters:
      - $ref: '#/components/parameters/x-okapi-tenant-header'
      - $ref: '#/components/parameters/x-okapi-token-header'
      - $ref: '#/components/parameters/institution-id'
      responses:
        '200':
          description: 'Calls the mod-inventory-storage GET /location-units/institutions/{institutionId} API and returns the result as-is. \

            The example of response: https://github.com/folio-org/mod-inventory-storage/blob/master/ramls/locinst.json

            '
          content:
            application/json:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/notFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    servers:
    - url: /inventory
  /inventory/location-units/libraries/{libraryId}:
    get:
      tags:
      - Locations
      operationId: getLibraryById
      summary: Retrieve library information by id
      description: Retrieve library information by id.
      parameters:
      - $ref: '#/components/parameters/x-okapi-tenant-header'
      - $ref: '#/components/parameters/x-okapi-token-header'
      - $ref: '#/components/parameters/library-id'
      responses:
        '200':
          description: 'Calls the mod-inventory-storage GET /location-units/libraries/{libraryId} API and returns the result as-is. \

            The example of response: https://github.com/folio-org/mod-inventory-storage/blob/master/ramls/loclib.json

            '
          content:
            application/json:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/notFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    servers:
    - url: /inventory
  /inventory/location-units/campuses/{campusId}:
    get:
      tags:
      - Locations
      operationId: getCampusById
      summary: Retrieve campus information by id
      description: Retrieve campus information by id.
      parameters:
      - $ref: '#/components/parameters/x-okapi-tenant-header'
      - $ref: '#/components/parameters/x-okapi-token-header'
      - $ref: '#/components/parameters/campus-id'
      responses:
        '200':
          description: 'Calls the mod-inventory-storage GET /location-units/campuses/{campusId} API and returns the result as-is. \

            https://github.com/folio-org/mod-inventory-storage/blob/master/ramls/loccamp.json

            '
          content:
            application/json:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/notFoundResponse'
        '500':
          $ref: '#/components/responses/internalServerErrorResponse'
    servers:
    - url: /inventory
  /locations:
    post:
      description: Add new InnReach location
      operationId: postInnReachLocation
      tags:
      - Locations
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/innReachLocationDTO'
        '400':
          $ref: '#/components/responses/trait_response_validation_400'
        '500':
          $ref: '#/components/responses/trait_response_500'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/innReachLocationDTO'
        required: true
      summary: Post inn reach location
      x-summary-source: derived
    get:
      description: Get a list of InnReach locations
      operationId: getLocations
      tags:
      - Locations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/innReachLocationsDTO'
        '500':
          $ref: '#/components/responses/trait_response_500'
      parameters:
      - $ref: '#/components/parameters/trait_pageable_offset'
      - $ref: '#/components/parameters/trait_pageable_limit'
      summary: Get locations
      x-summary-source: derived
    servers:
    - url: /inn-reach/
  /locations/{locationId}:
    get:
      description: Get InnReach location by id
      operationId: getLocationsByLocationId
      tags:
      - Locations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/innReachLocationDTO'
        '404':
          $ref: '#/components/responses/trait_response_404'
        '500':
          $ref: '#/components/responses/trait_response_500'
      parameters:
      - $ref: '#/components/parameters/id'
      summary: Get location by id
      x-summary-source: derived
      x-operation-id-source: normalized
      x-operation-id-original: getLocationById
    put:
      description: Update InnReach location
      operationId: updateLocation
      tags:
      - Locations
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/trait_response_validation_400'
        '404':
          $ref: '#/components/responses/trait_response_404'
        '500':
          $ref: '#/components/responses/trait_response_500'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/innReachLocationDTO'
        required: true
      parameters:
      - $ref: '#/components/parameters/id'
      summary: Update location
      x-summary-source: derived
    delete:
      description: Delete InnReach location
      operationId: deleteLocation
      tags:
      - Locations
      responses:
        '204':
          description: No content
        '404':
          $ref: '#/components/responses/trait_response_404'
        '500':
          $ref: '#/components/responses/trait_response_500'
      parameters:
      - $ref: '#/components/parameters/id'
      summary: Delete location
      x-summary-source: derived
    servers:
    - url: /inn-reach/
  /location-storage/locations:
    delete:
      description: Delete all locations.
      operationId: deleteLocations
      responses:
        '204':
          description: All locations deleted.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: Internal server error.
      summary: Delete all locations
      tags:
      - Locations
    get:
      description: Return a list of locations.
      operationId: getLocationStorageLocations
      parameters:
      - description: CQL query expression.
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: Limit the number of elements returned.
        in: query
        name: limit
        required: false
        schema:
          default: 10
          minimum: 0
          type: integer
      - description: Skip over a number of elements.
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
      - description: Whether to include shadow records in the response or not.
        in: query
        name: includeShadow
        required: false
        schema:
          default: false
          type: boolean
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/locationsCollection'
          description: Collection of locations.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: Bad request.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: Internal server error.
      summary: Get locations
      tags:
      - Locations
      x-operation-id-source: normalized
      x-operation-id-original: getLocations
    post:
      description: Create a new location.
      operationId: createLocation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/location'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/location'
          description: Created location.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: Bad request.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorCollection'
          description: Internal server error.
      summary: Create location
      tags:
      - Locations
    servers:
    - description: Development environments.
      url: https://folio-{environment}.ci.folio.org
      variables:
        environment:
          default: edev-spitfire-diku
          enum:
          - edev-spitfire-diku
          - edev-spitfire-consortium
    - description: Reference environments.
      url: https://folio-{environment}.ci.folio.org
      variables:
        environment:
          default: etesting-snapshot-diku
          enum:
          - etesting-snapshot-diku
          - etesting-snapshot-2-diku
          - etesting-sprint-fs09000000
  /location-storage/locations/{id}:
    delete:
      description: Delete a location by id.
      operationId: deleteLocationById
      parameters:
      - description: Record identifier.
        in: path
        name: id
        required: true
