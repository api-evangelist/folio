  /erm/sas/{agreementId}/resources/export/{subset}/{format}:
    description: 'Backed by the same controller/actions as the top-level `/export` family -- `subset: all` calls the same code as `/export`, `subset: current` calls the same code as `/export/current`, just pre-scoped to this one agreement. Returns an empty result set (not a 404) if `agreementId` does not match any agreement -- existence of the agreement is not checked.'
    parameters:
    - $ref: '#/components/parameters/x-okapi-tenant'
    - $ref: '#/components/parameters/agreementId'
    - $ref: '#/components/parameters/subset'
    - $ref: '#/components/parameters/format'
    get:
      tags:
      - Agreements
      summary: Returns a list of either current or all resources in the internal KB associated…
      description: '`format: kbart` returns a tab-separated KBART file (one row per Package Content Item; Platform Title Instances and directly-entitled Title Instances are silently skipped). Any other `format` value returns a JSON array.'
      operationId: exportAgreementResourcesSubsetFormat
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExportEntry'
            text/tab-separated-value;charset=UTF-8:
              schema:
                type: string
                description: KBART-formatted TSV, with a header row followed by one row per Package Content Item.
        '400':
          description: Bad request error
        '403':
