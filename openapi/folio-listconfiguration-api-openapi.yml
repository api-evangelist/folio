openapi: 3.2.0
info:
  title: Lists List Configuration API
  description: Lists API description
  version: 1.0.0
servers:
- url: https://folio-etesting-snapshot-kong.ci.folio.org/
tags:
- name: listConfiguration
paths:
  /lists/configuration:
    get:
      operationId: getListConfiguration
      tags:
      - listConfiguration
      description: Get list app configuration.
      responses:
        '200':
          description: Returns list app configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListConfiguration'
        4XX:
          $ref: '#/components/responses/badRequestResponse'
      summary: Get list configuration
      x-summary-source: derived
components:
  schemas:
    ListConfiguration:
      $schema: https://json-schema.org/draft/2020-12/schema
      description: List Configuration Data
      type: object
      properties:
        maxListSize:
          description: Maximum allowable size of a list
          type: integer
      additionalProperties: false
      required:
      - maxListSize
    parameter:
      description: List of key/value parameters of an error
      type: object
      properties:
        key:
          description: Parameter key
          type: string
        value:
          description: Parameter value
          type: string
      additionalProperties: false
      required:
      - key
    ListAppError:
      description: An error
      type: object
      properties:
        message:
          type: string
          description: Error message text
        code:
          type: string
          description: Error message code
        parameters:
          description: Error message parameters
          $ref: '#/components/schemas/parameters'
      additionalProperties: false
      required:
      - message
      - code
    parameters:
      description: List of key/value parameters of an error
      type: array
      items:
        $ref: '#/components/schemas/parameter'
  responses:
    badRequestResponse:
      description: Invalid request
      content:
        application/json:
          example:
            message: List with ID 6c611396-b6bc-56a7-aada-3a90683d559c was not found
            code: read-list.not.found
          schema:
            $ref: '#/components/schemas/ListAppError'
