openapi: 3.2.0
info:
  title: Folio JSON Schemas Controller API
  version: v0
  description: 'Operations tagged json-schemas-controller across 4 of this provider''s published API definitions: folio-mod-camunda-openapi-openapi.json, folio-mod-workflow-openapi-openapi.json, folio-mod-camunda-openapi-openapi.yml, folio-mod-workflow-openapi-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:9000
  description: Generated server url
tags:
- name: json-schemas-controller
paths:
  /_/jsonSchemas:
    get:
      tags:
      - json-schemas-controller
      operationId: getSchemas
      parameters:
      - name: path
        in: query
        required: false
        schema:
          type: string
      - name: x-okapi-url
        in: header
        required: true
        schema:
          type: string
      - name: accept
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/hal+json:
              schema:
                type: object
        '204':
          description: No Content
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ResponseErrors'
        '400':
          description: Bad Request
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ResponseErrors'
        '404':
          description: Not Found
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ResponseErrors'
        '500':
          description: Internal Server Error
          content:
            application/hal+json:
              schema:
                $ref: '#/components/schemas/ResponseErrors'
      summary: Get schemas
      x-summary-source: derived
    servers:
    - url: http://localhost:9000
      description: Generated server url
components:
  schemas:
    ResponseErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
        total_records:
          type: integer
          format: int32
    Error:
      required:
      - message
      type: object
      properties:
        message:
          type: string
        type:
          type: string
        code:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/Parameter'
    Parameter:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
x-refined-from:
- folio-mod-camunda-openapi-openapi.json
- folio-mod-workflow-openapi-openapi.json
- folio-mod-camunda-openapi-openapi.yml
- folio-mod-workflow-openapi-openapi.yml
