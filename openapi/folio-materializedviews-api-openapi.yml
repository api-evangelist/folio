openapi: 3.2.0
info:
  title: mod-fqm-manager Materialized Views API
  version: v1
  description: mod-fqm-manager API
servers:
- url: https://folio-etesting-snapshot-kong.ci.folio.org/
tags:
- name: materializedViews
paths:
  /entity-types/materialized-views/refresh:
    post:
      operationId: refreshData
      tags:
      - materializedViews
      description: Refresh all materialized views and similar data for a tenant.
      responses:
        '200':
          description: Data refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dataRefreshResponse'
        4XX:
          $ref: '#/components/responses/badRequestResponse'
      summary: Refresh data
      x-summary-source: derived
components:
  schemas:
    error:
      description: An error
      type: object
      properties:
        message:
          type: string
          description: Error message text
        code:
          type: string
          description: Error message code
          enum:
          - entity.type.access.denied
          - entity.type.in.use
          - entity.type.invalid
          - entity.type.not.found
          - entity.type.source.missing
          - field.not.found
          - migration.query.changed
          - permissions.missing
          - query.invalid
          - query.not.found
          - query.too.large
          - unknown.error
        parameters:
          description: Error message parameters
          $ref: '#/components/schemas/parameters'
      additionalProperties: false
      required:
      - message
      - code
    parameter:
      description: List of key/value parameters of an error
      type: object
      properties:
        key:
          description: Parameter key
          type: string
        value:
          description: Parameter value
          type: string
      additionalProperties: false
      required:
      - key
    dataRefreshResponse:
      type: object
      properties:
        successfulRefresh:
          type: array
          items:
            type: string
        failedRefresh:
          type: array
          items:
            type: string
    parameters:
      description: List of key/value parameters of an error
      type: array
      items:
        $ref: '#/components/schemas/parameter'
  responses:
    badRequestResponse:
      description: Invalid request
      content:
        application/json:
          example:
            message: Entity type ID 6c611396-b6bc-56a7-aada-3a90683d559c was not found
            code: entity.type.not.found
          schema:
            $ref: '#/components/schemas/error'
