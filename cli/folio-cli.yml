name: Stripes CLI
package: '@folio/stripes-cli'
description: The stripes-cli is a command-line interface written in JavaScript that can connect to back-end APIs and help
  front-end developers that use FOLIO's User Interface framework Stripes.
install:
- yarn config set @folio:registry https://repository.folio.org/repository/npm-folio/
- yarn global add @folio/stripes-cli
commands:
- group: okapi
  commands: [okapi login, okapi logout, okapi get, okapi post, okapi put, okapi delete, okapi token]
- group: mod
  commands: [mod add, mod descriptor, mod disable, mod discover, mod enable, mod filter, mod install, mod list, mod perms,
    mod pull, mod remove, mod update, mod view]
- group: perm
  commands: [perm assign, perm create, perm filter, perm list, perm unassign]
- group: platform
  commands: [platform backend, platform clean, platform install, platform pull]
- group: app
  commands: [app bigtest, app create, app perms]
- group: other
  commands: [alias, build, inventory, serve, status, test, test karma, workspace, completion]
other_clients:
- name: okapi-curl
  description: The okapi-curl is a shell script that wraps curl.
- name: okapi-cli
  description: The okapi-cli is a command-line interface written in Java.
- name: OkapiCLI.py
  description: The OkapiCLI.py is a command-line interface written in Python.
note: The other clients are listed on https://dev.folio.org/faqs/how-to-use-apis/ ; their command surfaces were not catalogued here.
